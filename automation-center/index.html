<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自动化中心</title>
<!--
  飞书应用插件页：自动化中心（第 2 期：可新建任务）。规矩见 wiki/页面设计/概念/飞书应用自定义插件页.md
  状态来自 X40（sync_automation_center.py）；页面新建的任务写进 自动化任务 表，由本机 X39（automation_scheduler.py）审批后执行。
  页面上的权限只是界面，X39 会再查一遍：动作必须在清单里，审批只认林键春写的行，内容变了不跑。改 ACTIONS 要同步改 X39。
  授权：saveConfig 只登记产品主表，4 张表的授权组件在「数据授权4（勿删）」。
  本地预览：build_preview.py 注入 window.__SNAPSHOT__；地址加 ?as=member 看组员视角。
-->
<style>
  :root {
    --bg: #f5f6f7; --card: #ffffff; --ink: #1f2329; --sub: #646a73; --faint: #8f959e; --line: #e5e6eb; --line-2: #d0d3d6; --seg: #eceef1;
    --blue: #3370ff; --blue-soft: #e1eaff; --red: #d92f2a; --red-soft: #fde2e2;
    --amber: #b25e00; --amber-soft: #fff1d6; --green: #1a7f4b; --green-soft: #d9f5e3; --gray-soft: #eef0f2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .wrap { padding: 12px 16px 0; height: 100vh; display: flex; flex-direction: column; }
  #main { flex: 1; min-height: 0; overflow: auto; position: relative; margin: 0 -16px; padding: 0 16px 24px; }
  .tip { flex: none; background: #fff7e8; color: #b25e00; border-radius: 8px; padding: 6px 12px; font-size: 12.5px; margin-bottom: 8px; }
  .savebar { flex: none; display: none; align-items: center; gap: 12px; background: #fff7e8; border: 1px solid #ffd591; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
  .savebar.show { display: flex; }
  .savebar button { height: 32px; padding: 0 16px; border: 0; border-radius: 6px; background: var(--blue); color: #fff; font-size: 14px; }
  .savebar button:disabled { opacity: .6; cursor: default; }
  .sticky { position: relative; flex: none; z-index: 20; background: var(--bg); margin: 0 -16px; padding: 0 16px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .sticky.stuck { box-shadow: 0 6px 12px -8px rgba(0,0,0,.25); }
  h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .tabs { display: flex; gap: 4px; background: var(--seg); border-radius: 8px; padding: 3px; }
  .tabs button { flex: none; border: 0; background: none; padding: 4px 14px; border-radius: 6px; color: var(--sub); }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .spacer { flex: 1; }
  .meta { color: var(--sub); font-size: 12px; }
  .btn { height: 30px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--card); white-space: nowrap; }
  .btn:hover { background: var(--bg); }
  .btn:disabled { opacity: .55; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; min-width: 0; }
  .card h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h3 small { font-weight: normal; color: var(--sub); font-size: 12px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .kpi b { display: block; font-size: 24px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .kpi b.hot { color: var(--red); }
  .kpi span { color: var(--sub); font-size: 12px; }
  .two { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; }
  @media (max-width: 800px) { .two { grid-template-columns: minmax(0, 1fr); } }
  .up { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 7px 10px; }
  .up b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .todo { display: flex; flex-direction: column; gap: 8px; }
  .todo > div { display: flex; gap: 8px; align-items: flex-start; }
  .p { flex: none; display: inline-block; padding: 0 7px; border-radius: 4px; font-size: 12px; line-height: 19px; white-space: nowrap; }
  .p-ok { background: var(--green-soft); color: var(--green); } .p-warn { background: var(--amber-soft); color: var(--amber); }
  .p-bad { background: var(--red-soft); color: var(--red); } .p-blue { background: var(--blue-soft); color: var(--blue); } .p-gray { background: var(--gray-soft); color: var(--sub); }
  .sub { color: var(--sub); font-size: 12px; }
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
  .filters label { display: inline-flex; align-items: center; gap: 5px; color: var(--sub); }
  .filters select, .filters input { height: 28px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--card); color: var(--ink); padding: 0 6px; }
  .filters input { width: 180px; }
  .tablecard { background: var(--card); border: 1px solid var(--line); border-radius: 8px; width: max-content; min-width: 100%; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
  .tbl th, .tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .tbl th { position: sticky; top: 0; z-index: 5; background: #fafbfc; color: var(--sub); font-weight: 500; font-size: 12px; white-space: nowrap; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl td.nw { white-space: nowrap; }
  .tbl td.out { min-width: 170px; max-width: 280px; }
  .tbl td.why { min-width: 200px; max-width: 360px; }
  .tbl td b { font-weight: 500; }
  .bots { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .bots dl { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 5px 8px; margin: 0; }
  .bots dt { color: var(--sub); } .bots dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .empty { padding: 36px; text-align: center; color: var(--sub); }
  .err { color: var(--red); white-space: pre-wrap; }
  .btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.pri:hover { background: var(--blue); opacity: .9; }
  .btn.sm { height: 24px; padding: 0 8px; font-size: 12px; }
  .btn.danger { color: var(--red); }
  .ops { display: flex; flex-wrap: wrap; gap: 4px; min-width: 130px; }
  .steps { display: flex; flex-wrap: wrap; gap: 6px; }
  .steps button { border: 1px solid var(--line-2); background: var(--card); border-radius: 14px; padding: 3px 11px; }
  .steps button.on { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
  .opt { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; cursor: pointer; background: var(--card); }
  .opt.off { opacity: .55; cursor: not-allowed; background: #fafbfc; }
  .opt input { margin-top: 3px; flex: none; }
  .field { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .field > label { color: var(--sub); }
  .field select, .field input[type=time], .field input[type=text], .field input[type=number], textarea { border: 1px solid var(--line-2); border-radius: 6px; background: var(--card); padding: 4px 8px; }
  .field input[type=text] { width: min(320px, 100%); }
  textarea { width: 100%; min-height: 90px; resize: vertical; font: inherit; }
  .sum dl { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 5px 8px; margin: 0; }
  .sum dt { color: var(--sub); } .sum dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .msg { padding: 8px 12px; border-radius: 6px; background: var(--blue-soft); color: #173d99; }
  .msg.bad { background: var(--red-soft); color: var(--red); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .diff { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin: 8px 0; }
  .diff > div { padding: 8px 10px; border-radius: 6px; background: #fafbfc; border: 1px solid var(--line); overflow-wrap: anywhere; }
  .diff del { color: var(--red); } .diff ins { color: var(--green); text-decoration: none; font-weight: 600; }
  @media (max-width: 800px) { .diff { grid-template-columns: minmax(0, 1fr); } }
  /* 24 小时时间轴 */
  .tl { min-width: 840px; }
  .tlbox { overflow-x: auto; }
  .lane { display: grid; grid-template-columns: 64px minmax(0, 1fr); border-top: 1px solid var(--line); }
  .lane > span { font-size: 12px; color: var(--sub); display: flex; align-items: center; }
  .track { position: relative; height: 58px; background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: calc(100% / 12) 100%; }
  .mark { position: absolute; top: 50%; width: 0; height: 0; }
  .mark i { position: absolute; left: -4px; top: -4px; width: 9px; height: 9px; border-radius: 50%; background: var(--blue); }
  .mark.shift i { background: var(--amber); border-radius: 1px; transform: rotate(45deg); }
  .mark.bad i { background: var(--red); }
  .mark b { position: absolute; left: 0; transform: translateX(-50%); font-size: 11px; line-height: 1; font-weight: 500; white-space: nowrap; }
  .mark.a b { bottom: 8px; } .mark.c b { top: 8px; }
  .now { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px solid var(--red); z-index: 2; }
  .hours { display: grid; grid-template-columns: 64px minmax(0, 1fr); border-top: 1px solid var(--line); }
  .hours div { position: relative; height: 20px; }
  .hours em { position: absolute; top: 4px; transform: translateX(-50%); font-size: 11px; line-height: 1; color: var(--sub); font-style: normal; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--sub); margin-top: 8px; }
  .legend i { display: inline-block; width: 9px; height: 9px; background: var(--blue); border-radius: 50%; margin-right: 5px; }
  .legend .s i { background: var(--amber); border-radius: 1px; transform: rotate(45deg); }
  .legend .f i { background: var(--red); }
</style>
</head>

const withTimeout = (p, ms, what) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(`${what} 超时 ${ms / 1000} 秒`)), ms))]);

const pad = (n) => String(n).padStart(2, '0');
const bj = (ms) => new Date(Number(ms) + BJ);   // 之后都用 getUTC*，避开本机美西时区
const dayNo = (ms) => Math.floor((Number(ms) + BJ) / 86400000);
const fmtDT = (ms) => { if (!ms) return '—'; const d = bj(ms); return `${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
const fmtHM = (ms) => { const d = bj(ms); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
const PILL = { 已通过: 'ok', 待审批: 'warn', 已退回: 'bad', 草稿: 'gray', 错过: 'warn', 拒绝: 'bad', 启用: 'ok', 成功: 'ok', 在线: 'ok', 运行中: 'blue', 失败: 'bad', 异常: 'bad', 待建应用: 'warn', 未运行: 'warn', 跟美西走: 'warn', 停用: 'gray', 已移除: 'gray', 无记录: 'gray' };
const pill = (s) => s ? `<span class="p p-${PILL[s] || 'gray'}">${esc(s)}</span>` : '<span class="sub">—</span>';

function cell(v) {
  if (v == null) return '';
  if (typeof v === 'number' || typeof v === 'string' || typeof v === 'boolean') return v;
  if (Array.isArray(v)) return v.map(cell).join('');
  if (typeof v === 'object') return v.text ?? v.name ?? cell(v.value);
  return String(v);
}
const users = (v) => (Array.isArray(v) ? v : v ? [v] : []).filter((u) => u && u.id).map((u) => ({ id: u.id, name: u.name || '' }));

const managerIds = () => [...new Set(S.task.flatMap((t) => (t['相关人'] || []).filter((u) => u.name === MANAGER_NAME).map((u) => u.id)))];
const isManager = () => !!S.me && managerIds().includes(S.me);

const USER_FIELDS = new Set(['相关人', '创建人', '修改人']);
const MULTI_FIELDS = new Set(['输出', '接收人']);
const multi = (v) => (Array.isArray(v) ? v : v ? [v] : []).map((x) => (x && typeof x === 'object' ? x.text ?? x.name ?? '' : String(x))).filter(Boolean);
// 字段清单读不了就用内置清单；整表读失败隔一下再试一次。每一步记下来，出错时诊断里能看到卡在哪
const STEPS = [];
async function readRows(table, cfg, names) {
  const rows = [];
  let pageToken;
  for (let guard = 0; guard < 200; guard++) {
    const res = await withTimeout(table.getRecordsByPage({ pageSize: 200, pageToken }), 20000, `读 ${cfg.name} 记录`);
    for (const r of res.records) {
      const o = { _id: r.recordId };
      for (const [fid, v] of Object.entries(r.fields)) { const n = names[fid]; if (n) o[n] = USER_FIELDS.has(n) ? users(v) : MULTI_FIELDS.has(n) ? multi(v) : cell(v); }
      rows.push(o);
    }
    if (!res.hasMore) break;
    pageToken = res.pageToken;
  }
  return rows;
}
async function readTable(cfg, key) {
  const table = await withTimeout(SDK.bitable.base.getTableById(cfg.id), 15000, `打开 ${cfg.name}`);
  let names = FIELD_NAMES[key];
  try {
    const metas = await withTimeout(table.getFieldMetaList(), 15000, `读 ${cfg.name} 字段`);
    names = Object.fromEntries(metas.map((m) => [m.id, m.name]));
  } catch (e) { STEPS.push(`${cfg.name} 字段清单读不了，改用内置清单：${e && e.message ? e.message : e}`); }
  try { return await readRows(table, cfg, names); } catch (e) {
    STEPS.push(`${cfg.name} 记录第一次读失败：${e && e.message ? e.message : e}`);
    await new Promise((r) => setTimeout(r, 1500));
    return readRows(table, cfg, names);
  }
}

async function load() {
  S.warn = [];
  if (window.__SNAPSHOT__) { Object.assign(S, window.__SNAPSHOT__); return; }
  for (const [k, cfg] of Object.entries(TABLES)) {   // 逐张读：启动时并发调 SDK 会把通道卡死
    try { S[k] = await readTable(cfg, k); } catch (e) {
      if (cfg.required) throw e;
      S[k] = []; S.warn.push(`${cfg.name} 读不到：${e && e.message ? e.message : e}`);
    }
  }
}

function timeline(tasks) {
  const now = Date.now();
  const lanes = ['数据同步', '通知', '巡检'].map((l) => {
    const pts = [];
    for (const t of tasks) {
      if (t['类型'] !== l || t['状态'] !== '启用' || !/^(每天|工作日)/.test(String(t['时间']))) continue;
      for (const hm of String(t['时间']).match(/\d\d:\d\d/g) || []) pts.push({ hm, id: /^X\d/.test(t['任务键']) ? t['任务键'] : String(t['任务名称']).split('_')[0], shift: t['时钟'] === '跟美西走', bad: t['上次结果'] === '失败' });
    }
    pts.sort((a, b) => a.hm.localeCompare(b.hm));
    const g = [];
    for (const p of pts) { const q = g[g.length - 1]; if (q && q.hm === p.hm) { q.id += ' ' + p.id; q.bad = q.bad || p.bad; } else g.push({ ...p }); }
    return { l, g };
  }).filter((x) => x.g.length);
  if (!lanes.length) return '';
  const pct = (hm) => { const [h, m] = hm.split(':').map(Number); return (h * 60 + m) / 14.4; };
  const d = bj(now), nowPct = (d.getUTCHours() * 60 + d.getUTCMinutes()) / 14.4;
  const rows = lanes.map(({ l, g }) => `<div class="lane"><span>${esc(l)}</span><div class="track"><div class="now" style="left:${nowPct}%"></div>${g.map((p, i) =>
    `<div class="mark ${i % 2 ? 'c' : 'a'}${p.shift ? ' shift' : ''}${p.bad ? ' bad' : ''}" style="left:${pct(p.hm)}%" title="${esc(p.id)} 北京 ${p.hm}"><i></i><b>${esc(p.id)}</b></div>`).join('')}</div></div>`).join('');
  let hrs = ''; for (let i = 0; i <= 24; i += 2) hrs += `<em style="left:${i / 24 * 100}%">${pad(i)}</em>`;
  return `<div class="card"><h3>今天 24 小时 <small>北京时间，红线是现在</small></h3><div class="tlbox"><div class="tl">${rows}<div class="hours"><span></span><div>${hrs}</div></div></div></div>
    <div class="legend"><span><i></i>北京时间固定</span><span class="s"><i></i>跟美西走，换夏令时北京时间偏 1 小时</span><span class="f"><i></i>上次失败</span></div></div>`;
}

      <div class="card"><h3>需要处理</h3>${todo.length ? `<div class="todo">${todo.map(([p, h]) => `<div>${pill(p)}<span>${h}</span></div>`).join('')}</div>` : '<div class="sub">目前没有要处理的。</div>'}</div>
    </div></div>`;

function snapshot(x) {
  const o = {};
  for (const k of [...SNAP_FIELDS].sort()) {
    const v = x[k];
    if (k === '输出' || k === '接收人') o[k] = [...(v || [])].sort();
    else if (k === '周几或几号') o[k] = v === '' || v == null ? null : Number(v);
    else o[k] = String(v ?? '').trim();
  }
  return o;
}
const paramsOf = (x) => { try { return JSON.parse(x['动作参数'] || '{}'); } catch (e) { return {}; } };
const pendingTasks = () => visibleTasks().filter((t) => t['来源'] === PAGE_SRC && t['审批状态'] === '待审批');

const blankForm = () => ({ action: 'todo_overdue', name: ACTIONS.todo_overdue.t, text: '', bot: '小灯', freq: '每天', time: '09:30', n: 1, outs: [...ACTIONS.todo_overdue.out], to: [], miss: '跳过', fail: '林键春', step: 0, rec: '', key: '' });
const formFromTask = (t) => ({ action: t['动作键'], name: t['任务名称'], text: paramsOf(t).text || '', bot: t['机器人'] || '小灯', freq: t['频率'], time: t['时刻'], n: t['周几或几号'] === '' || t['周几或几号'] == null ? 1 : Number(t['周几或几号']), outs: [...(t['输出'] || [])], to: [...(t['接收人'] || [])], miss: t['错过时'] || '跳过', fail: t['失败通知'] || '林键春', step: 0, rec: t._id, key: t['任务键'] });
const formRow = (f) => ({ 任务名称: f.name.trim(), 动作键: f.action, 动作参数: f.action === 'fixed_text' ? JSON.stringify({ text: f.text.trim() }) : '', 机器人: f.bot, 频率: f.freq, 时刻: f.time, 周几或几号: f.freq === '每周' || f.freq === '每月' ? Number(f.n) : null, 输出: f.outs, 接收人: f.outs.includes('私聊指定人') ? f.to : [], 错过时: f.miss, 失败通知: f.fail });
function formError(f) {
  if (!f.name.trim()) return '还没填任务名称';
  if (!/^\d\d:\d\d$/.test(f.time)) return '时间没填对';
  if (f.action === 'fixed_text' && !f.text.trim()) return '还没写提醒内容';

const SHOW = (x) => `${x['任务名称']}\n${ACTIONS[x['动作键']] ? ACTIONS[x['动作键']].t : x['动作键']}\n${whenText(x)}\n${outText(x)}\n错过时${x['错过时']}，失败通知${x['失败通知']}${x['动作键'] === 'fixed_text' ? '\n内容：' + (paramsOf(x).text || '') : ''}`;

// ===== ⑤c 写表 =====
const tableObj = (k) => SDK.bitable.base.getTableById(TABLES[k].id);
function encodeFields(k, obj) {
  const out = {};
  for (const [name, v] of Object.entries(obj)) {
    const m = FIELD_META[k][name];
    if (!m) throw new Error(`表里没有字段：${name}`);
    if (v == null || v === '' || (Array.isArray(v) && !v.length)) { out[m.id] = null; continue; }
    if (m.type === 'select') {
      const list = (Array.isArray(v) ? v : [v]).map((x) => { if (!m.options[x]) throw new Error(`字段 ${name} 没有选项：${x}`); return { id: m.options[x], text: x }; });
      out[m.id] = MULTI_FIELDS.has(name) ? list : list[0];
    } else if (m.type === 'text') out[m.id] = [{ type: 'text', text: String(v) }];
    else out[m.id] = v;   // 数字、日期（毫秒）
  }
  return out;
}
const writeRow = async (k, id, obj) => withTimeout((await tableObj(k)).setRecord(id, { fields: encodeFields(k, obj) }), 15000, '写表');
const addRow = async (k, obj) => withTimeout((await tableObj(k)).addRecord({ fields: encodeFields(k, obj) }), 15000, '写表');
// 写入后立刻读可能是旧数据：按间隔重读，直到看到结果
async function syncUntil(check, tries = [0.4, 0.7, 1, 1.5, 2, 2.5]) {
  for (const sec of tries) {
    await new Promise((r) => setTimeout(r, sec * 1000));
    try { S.task = await readTable(TABLES.task, 'task'); } catch (e) { /* 下一轮再读 */ continue; }
    if (check()) return true;
  }
  return false;
}
const taskById = (id) => S.task.find((t) => t._id === id);
async function startTrial(id) {
  S.trialing = id; render();
  await writeRow('task', id, { 试运行请求: Date.now(), 试运行结果: null });
  // X39 每分钟跑一次，处理完会清空 试运行请求
  const done = await syncUntil(() => { const t = taskById(id); return t && !t['试运行请求'] && t['试运行结果']; }, [1, ...Array(24).fill(5)]);
  S.trialing = '';
  S.msg = done ? `试运行完成：${taskById(id)['试运行结果']}` : '等了 2 分钟调度器还没处理。请确认本机开着，X39 在运行。';
  render();
}
async function saveForm() {
  const f = S.form, row = formRow(f);
  const fields = { ...row, 时间: whenText(row), 时钟: '北京固定', 输出到: outText(row), 说明: ACTIONS[f.action].d, 类型: '通知', 模块: '任务', 可见范围: '全员', 来源: PAGE_SRC, 状态: '启用', 审批状态: null, 退回意见: null, 试运行结果: null, 下次运行: null };
  S.busy = true; S.msg = '保存中…'; render();
  let id = f.rec;
  if (id) {
    // 保存即回到草稿，重新试运行和审批；X39 也会因为内容和审批快照不一致而不跑
    await writeRow('task', id, fields);
    await syncUntil(() => { const x = taskById(id); return x && x['任务名称'] === row['任务名称'] && !x['试运行结果']; });
  } else {
    const key = 'T' + Date.now().toString(36);
    id = await addRow('task', { 任务键: key, ...fields });
    await syncUntil(() => !!taskById(id));
  }
  S.busy = false; S.form = null; S.tab = '任务'; S.f.src = PAGE_SRC; S.msg = '';
  await startTrial(id);
}
const ACTION_HANDLERS = {
  async submit(id) { await writeRow('task', id, { 审批状态: '待审批', 退回意见: null }); await syncUntil(() => taskById(id)?.['审批状态'] === '待审批'); S.msg = '已提交，等林键春审批。'; },
  async toggle(id) { const to = taskById(id)['状态'] === '启用' ? '停用' : '启用'; await writeRow('task', id, { 状态: to }); await syncUntil(() => taskById(id)?.['状态'] === to); S.msg = to === '启用' ? '已启用。' : '已暂停，到点不会运行。'; },
  async del(id) { await withTimeout((await tableObj('task')).deleteRecord(id), 15000, '删除'); S.confirmDel = ''; await syncUntil(() => !taskById(id)); S.msg = '已删除。'; },
  async approve(id) {
    const t = taskById(id);
    await addRow('appr', { 任务键: t['任务键'], 内容快照: JSON.stringify(snapshot(t)), 结果: '通过' });
    await writeRow('task', id, { 审批状态: '已通过', 退回意见: null, 状态: '启用' });
    await syncUntil(() => taskById(id)?.['审批状态'] === '已通过');
    try { S.appr = await readTable(TABLES.appr, 'appr'); } catch (e) { /* 只影响显示 */ }
    S.msg = `「${t['任务名称']}」已通过，下一个计划时间开始运行。`;
  },
  async reject(id, reason) {
    const t = taskById(id);
    await addRow('appr', { 任务键: t['任务键'], 内容快照: JSON.stringify(snapshot(t)), 结果: '退回', 意见: reason });
    await writeRow('task', id, { 审批状态: '已退回', 退回意见: reason });
    await syncUntil(() => taskById(id)?.['审批状态'] === '已退回');
    S.msg = `已退回「${t['任务名称']}」。`;
  },
};

async function diagnose() {
  const res = [];
  const t = async (name, fn) => {
    try {
      const v = await withTimeout(Promise.resolve().then(fn), 8000, name);
      let shown; try { shown = typeof v === 'string' ? v : JSON.stringify(v); } catch (x) { shown = String(v); }
      res.push(['✔', name, String(shown).slice(0, 200)]); return v;
    } catch (e) { res.push(['✘', name, e && e.message ? e.message : String(e)]); return undefined; }
  };
  await t('dashboard.state', () => SDK.dashboard.state);
  for (const cfg of Object.values(TABLES)) {
    const tb = await t(`打开 ${cfg.name}`, () => SDK.bitable.base.getTableById(cfg.id));
    if (tb) {
      await t(`${cfg.name} 字段清单`, async () => (await tb.getFieldMetaList()).length + ' 个');
      await t(`读 ${cfg.name} 200 条`, async () => { const r = await tb.getRecordsByPage({ pageSize: 200 }); return `${r.records.length} 条，还有更多 ${r.hasMore}`; });
    }
  }
  await t('bridge.getUserId', () => SDK.bitable.bridge.getUserId());
  for (const x of STEPS) res.push(['!', '读表过程', x]);
  return `<div class="card" style="margin-top:12px"><h3>接口诊断 <small>请把这块整体截图发回。「打不开或读不了」通常是数据授权4 少组件，或应用权限配置没给这张表开权限</small></h3><table class="tbl"><tbody>${res.map((r) =>
    `<tr><td style="width:24px">${r[0]}</td><td class="nw">${esc(r[1])}</td><td style="color:var(--sub)">${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>`;
}

function layoutCheck() { $('tallTip').style.display = innerHeight > (screen.availHeight || screen.height || 1080) + 40 ? '' : 'none'; }
window.addEventListener('resize', layoutCheck);
layoutCheck();

async function loadSdk() {
  const errs = [];
  for (const u of sdkUrls()) {
    try { return await withTimeout(import(u), 12000, '加载 SDK'); } catch (e) { errs.push(`${u} → ${e && e.message ? e.message : e}`); }
  }
  throw new Error('飞书 SDK 都没加载上（也就没有「保存到页面」按钮），请截图：' + errs.join(' ｜ '));
}

// ===== 启动：加载 SDK → setupSave → 逐张读表 → 页面显示 → 再认人 =====
renderTabs();
try {
  if (!window.__SNAPSHOT__) { SDK = await loadSdk(); setupSave(); }
  await load();
  if (window.__SNAPSHOT__) { S.me = /[?&]as=member/.test(location.search) ? 'ou_preview_member' : managerIds()[0]; S.identified = true; }
  render();
  if (SDK) {
    try { const id = await withTimeout(SDK.bitable.bridge.getUserId(), 5000, '认人'); if (id) { S.me = id; S.identified = true; } } catch (e) { /* 认不出按组员视角，meta 上有提示 */ }
    render();
  }
} catch (e) {
  const msg = esc(e && e.message ? e.message : e);
  $('meta').textContent = '';
  $('main').innerHTML = `<div class="card err">读取失败：${msg}</div>`;
  if (SDK) { try { $('main').innerHTML = `<div class="card err">读取失败：${msg}</div>` + await diagnose(); } catch (e2) { /* 保留上面的报错 */ } }
}
</script>
</body>
</html>
