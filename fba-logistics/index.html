<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>货件物流跟踪</title>
<!--
  飞书应用自定义插件页「货件物流跟踪」（2026-10-27）。源：tools/fba-logistics-page/index.html → 发布 github-pages/fba-logistics/
  读：货件物流跟踪-灯 tblB78mpJmyfEBHZ（一个 FBA 货件一行：领星字段 + 物流商字段）、货件商品明细-灯 tblW09RSzUtYaCRm（货件号×MSKU）
  写：只在「导入物流商表」时写 货件物流跟踪-灯 的物流商字段（按 FBA ID 匹配）
  规则（用户 10-27 定）：有物流商信息以物流商为准，没有显示领星状态/时间线；领星已完结的货件不进表（sync_fba_logistics.py 删）。
  数据：sync_fba_logistics.py（X33 每日）；硬规矩见 tools/feishu-page-kit/template.html 顶部注释。
-->
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1f2329; --sub:#646a73; --line:#e5e6eb; --head:#f3f4f7; --hover:#f7f8fb;
    --blue:#3370ff; --blue-soft:#e1eaff; --red:#f54a45; --red-soft:#fde2e2; --yellow:#c46a00; --yellow-soft:#fff1d6;
    --green:#2ea121; --green-soft:#e4f6e1; --gray-soft:#eff0f1; --shadow:0 8px 24px rgba(16,24,40,.12); }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { padding: 10px 16px 0; height: 100vh; display: flex; flex-direction: column; }
  #main { flex: 1; min-height: 0; overflow: auto; position: relative; margin: 0 -16px; padding: 0 16px 24px; }
  .tip { flex: none; background: #fff7e8; color: #b25e00; border-radius: 8px; padding: 6px 12px; font-size: 12.5px; margin-bottom: 8px; }
  .savebar { flex: none; display: none; align-items: center; gap: 12px; background: #fff7e8; border: 1px solid #ffd591; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
  .savebar.show { display: flex; }
  .savebar button { height: 32px; padding: 0 16px; border: 0; border-radius: 6px; background: var(--blue); color: #fff; font-size: 14px; cursor: pointer; }
  .sticky { position: relative; flex: none; z-index: 20; background: var(--bg); margin: 0 -16px; padding: 2px 16px 8px; }
  .sticky.stuck { box-shadow: 0 6px 12px -8px rgba(0,0,0,.25); }
  .meta { color: var(--sub); font-size: 12px; }
  .err { color: var(--red); white-space: pre-wrap; }
  .loading { padding: 40px; text-align: center; color: var(--sub); }

  /* 顶栏控件：统一 32px 高 */
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ctl { font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; height: 32px; padding: 0 10px; margin: 0;
         display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; }
  .ctl:hover { border-color: #c9cdd4; }
  input.ctl { cursor: text; flex: 1 1 200px; min-width: 0; }
  input.ctl:focus, select.ctl:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-soft); }
  .btn { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn:hover { opacity: .9; border-color: var(--blue); }
  .btn2 { background: var(--card); color: var(--blue); border-color: var(--blue); }
  .cnt { color: var(--sub); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .sep { width: 1px; height: 20px; background: var(--line); }
  .seg { position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--head); border: 1px solid var(--line); border-radius: 8px; padding: 2px; height: 34px; flex: none; }
  .seg button { position: relative; z-index: 1; font: inherit; font-size: 13px; font-weight: 600; border: 0; background: none; color: var(--sub); padding: 0 14px; cursor: pointer; white-space: nowrap; transition: color .2s; }
  .seg button.on { color: var(--ink); }
  .seg .pill { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px); background: var(--card); border-radius: 6px; box-shadow: 0 1px 3px rgba(16,24,40,.15); transition: transform .25s cubic-bezier(.4,0,.2,1); }
  .seg[data-on="1"] .pill { transform: translateX(100%); }
  .ms { position: relative; display: inline-flex; }
  .ms > summary { list-style: none; user-select: none; max-width: 200px; }
  .ms > summary span { overflow: hidden; text-overflow: ellipsis; }
  .ms > summary::-webkit-details-marker { display: none; }
  .ms > summary::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--sub); border-bottom: 1.5px solid var(--sub); transform: translateY(-2px) rotate(45deg); margin-left: 4px; flex: none; }
  .ms[open] > summary { border-color: var(--blue); }
  .ms.has > summary { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }
  .pop { position: absolute; top: calc(100% + 6px); left: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px; min-width: 210px; box-shadow: var(--shadow); z-index: 30; max-height: 60vh; overflow: auto; }
  .pop .ops { display: flex; gap: 6px; padding: 2px 2px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .pop .ops button { font: inherit; font-size: 12px; color: var(--ink); background: var(--head); border: 1px solid var(--line); border-radius: 5px; height: 24px; padding: 0 8px; cursor: pointer; }
  .pop .grp { font-size: 11.5px; color: var(--sub); padding: 8px 10px 2px; }
  .pop label { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; border-radius: 5px; cursor: pointer; white-space: nowrap; font-size: 13px; }
  .pop label:hover { background: var(--hover); }
  .pop input[type=checkbox] { width: 15px; height: 15px; margin: 0; flex: none; accent-color: var(--blue); cursor: pointer; }
  .pop .c { margin-left: auto; padding-left: 16px; color: var(--sub); font-size: 12px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  .kpi b { display: block; font-size: 20px; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--sub); font-size: 12px; }
  .kpi.g b { color: var(--green); } .kpi.y b { color: var(--yellow); } .kpi.r b { color: var(--red); }
  .note { color: var(--sub); font-size: 12px; margin: 0 0 10px; line-height: 1.7; }
  .note b { color: var(--ink); font-weight: 600; }

  /* 汇总表 */
  .tbl { background: var(--card); border: 1px solid var(--line); border-radius: 8px; width: max-content; min-width: 100%; }
  table.t { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
  .t th, .t td { padding: 8px 7px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; font-size: 12.5px; }
  .t th { background: var(--head); color: var(--sub); font-weight: 600; white-space: nowrap; position: sticky; top: 0; z-index: 2; }
  .t th:first-child { border-top-left-radius: 8px; } .t th:last-child { border-top-right-radius: 8px; }
  .t .n { text-align: right; white-space: nowrap; }
  .t tfoot td { background: var(--head); font-weight: 600; position: sticky; bottom: 0; border-bottom: 0; }
  .mono { font-family: Consolas, Menlo, monospace; font-size: 12px; white-space: nowrap; }
  .msk { font-family: Consolas, Menlo, monospace; font-size: 11.5px; max-width: 150px; word-break: break-all; }
  .name { min-width: 140px; max-width: 170px; }
  .nw { white-space: nowrap; } .sub { color: var(--sub); font-size: 12px; }
  td.zero { color: #b0b4ba; } td.ok { color: var(--green); font-weight: 600; } td.hl { color: var(--yellow); font-weight: 600; } td.bd { color: var(--red); font-weight: 600; }
  .rate { display: inline-flex; align-items: center; gap: 6px; }
  .rate i { display: block; width: 32px; height: 6px; border-radius: 3px; background: var(--gray-soft); overflow: hidden; }
  .rate i s { display: block; height: 100%; background: var(--green); }
  tr.srow { cursor: pointer; } tr.srow:hover > td { background: var(--hover); }
  .car { display: inline-block; width: 14px; color: var(--sub); transition: transform .2s; }
  tr.srow.open .car { transform: rotate(90deg); } tr.srow.open > td { background: var(--blue-soft); }
  tr.det > td { background: var(--bg); padding: 10px 12px 12px 30px; }
  tr.det .grid { width: calc(100vw - 72px); position: sticky; left: 0; }   /* 展开的货件表按屏宽排，不撑宽汇总表 */
  tr.det .tbl { width: 100%; } tr.det .t th { position: static; }

  /* 货件卡片 + 流程图 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 10px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
  .box .t1 { display: flex; align-items: center; gap: 8px; }
  .box .t1 b { font-family: Consolas, Menlo, monospace; font-size: 13.5px; }
  .box .t1 .r { margin-left: auto; display: flex; gap: 6px; }
  .box .s { color: var(--sub); font-size: 12px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl { display: inline-block; padding: 0 8px; border-radius: 99px; font-size: 11.5px; line-height: 20px; white-space: nowrap; background: var(--blue-soft); color: var(--blue); }
  .pl.g { background: var(--green-soft); color: var(--green); } .pl.y { background: var(--yellow-soft); color: var(--yellow); }
  .pl.r { background: var(--red-soft); color: var(--red); } .pl.x { background: var(--gray-soft); color: var(--sub); }
  .steps { display: grid; grid-template-columns: repeat(6, 1fr); margin: 10px 0 4px; }
  .st { position: relative; text-align: center; font-size: 11.5px; color: var(--sub); padding-top: 16px; }
  .st::before { content: ''; position: absolute; top: 5px; left: -50%; width: 100%; height: 2px; background: var(--line); }
  .st:first-child::before { display: none; }
  .st i { position: absolute; top: 0; left: 50%; margin-left: -6px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid #c9cdd4; z-index: 1; }
  .st.done { color: var(--ink); } .st.done i { background: var(--green); border-color: var(--green); } .st.done::before { background: var(--green); }
  .st.cur { color: var(--ink); font-weight: 600; } .st.cur i { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); } .st.cur::before { background: var(--green); }
  .st.late i { background: var(--red); border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
  .st em { display: block; font-style: normal; font-weight: normal; color: var(--sub); font-size: 11px; }
  .trk { font-size: 12px; color: var(--sub); background: var(--bg); border-radius: 6px; padding: 6px 8px; margin-top: 6px; line-height: 1.6; }
  .trk b { color: var(--ink); font-weight: 600; }
  .mini { width: 100%; table-layout: fixed; font-size: 12px; margin-top: 6px; border-collapse: collapse; }
  .mini td, .mini th { padding: 3px 4px; border-bottom: 1px dashed var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .mini th { color: var(--sub); font-weight: normal; }
  .mini .n { text-align: right; width: 64px; }
  /* 货件行 */
  .st2 td { vertical-align: top; }
  .ps { min-width: 150px; }
  .dots { display: flex; align-items: center; height: 14px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #c9cdd4; background: #fff; flex: none; }
  .dots i.done { background: var(--green); border-color: var(--green); }
  .dots i.cur { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .dots i.late { background: var(--red); border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
  .dots s { width: 14px; height: 2px; background: var(--line); flex: none; } .dots s.done { background: var(--green); }
  .pt { font-size: 11.5px; color: var(--sub); margin-top: 3px; white-space: nowrap; } .pt b { color: var(--ink); font-weight: 600; }
  .its { max-width: 260px; } .its > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; line-height: 1.7; }
  .tk { max-width: 260px; min-width: 180px; font-size: 12px; color: var(--sub); }
  .tkc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } .tk .src { display: inline-block; font-size: 11px; color: var(--sub); background: var(--gray-soft); border-radius: 4px; padding: 0 4px; margin-right: 4px; }
  .st2 .pl { margin-right: 3px; }
  .empty { padding: 30px; text-align: center; color: var(--sub); }

  /* 导入弹窗 */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 100; display: flex; align-items: center; justify-content: center; }
  .dlg { background: var(--card); border-radius: 10px; width: min(640px, 92vw); max-height: 86vh; overflow: auto; padding: 18px 20px; box-shadow: var(--shadow); }
  .dlg h3 { margin: 0 0 10px; font-size: 16px; }
  .dlg .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .dlg ul { margin: 6px 0; padding-left: 18px; color: var(--sub); font-size: 12px; max-height: 160px; overflow: auto; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1f2329; color: #fff; padding: 8px 16px; border-radius: 6px; z-index: 200; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tip" id="tallTip" style="display:none">插件框比屏幕还高，往下滑时顶部筛选栏会被滚走。请在应用编辑模式里把这个插件组件的高度拖到一屏以内，页面会改成内部滚动、顶栏固定。</div>
  <div class="savebar" id="savebar">
    <span>这是插件的配置预览。确认没问题后点右边按钮，插件才会保存到应用页面上。</span>
    <button id="saveBtn">保存到页面</button>
    <span class="meta" id="saveMsg"></span>
  </div>
  <div class="sticky" id="sticky">
    <div class="bar">
      <div class="seg" id="seg" data-on="0"><span class="pill"></span><button data-t="0" class="on">ASIN × 国家汇总</button><button data-t="1">货件进度</button></div>
      <input class="ctl" id="q" placeholder="搜索 ASIN / 品名 / MSKU / 货件号">
      <details class="ms" id="fm"><summary class="ctl"></summary><div class="pop"></div></details>
      <details class="ms" id="fs"><summary class="ctl"></summary><div class="pop"></div></details>
      <details class="ms" id="fw"><summary class="ctl"></summary><div class="pop"></div></details>
      <details class="ms" id="fc"><summary class="ctl"></summary><div class="pop"></div></details>
      <details class="ms" id="fst"><summary class="ctl"></summary><div class="pop"></div></details>
      <details class="ms" id="fsrc"><summary class="ctl"></summary><div class="pop"></div></details>
      <span class="sep only0"></span>
      <details class="ms only0" id="fp"><summary class="ctl"></summary><div class="pop"></div></details>
      <select class="ctl" id="so"></select>
      <button class="ctl btn2" id="imp">导入物流商表</button>
      <button class="ctl btn" id="csv">导出 CSV</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <input type="file" id="file" accept=".xlsx,.csv" style="display:none">
  </div>
  <div id="main"><div class="loading">正在读取多维表数据…</div></div>
</div>

<script type="module">
// ===== ① 页面配置 =====
const SDK_URLS = [new URL('./sdk/index.mjs', location.href).href,
  'https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/dist/index.mjs',
  'https://unpkg.com/@lark-base-open/js-sdk@1.0.2/dist/index.mjs'];
const BASE_TOKEN = 'JGvebyaAYapWtOslxc9cuKYXnwd';   // 灯具组-全流程
const CARRIER_FIELDS = ['物流商运单状态', '物流商轨迹', '物流商签收时间', '物流商预计送达', '物流商签收时效', '物流商收货渠道', '物流商箱数', '物流商产品', '物流商申报品名', '物流商更新时间', '物流商导入来源'];
const TABLES = {
  ship: { id: 'tblB78mpJmyfEBHZ', name: '货件物流跟踪-灯', fields: ['货件号', '店铺', '国家', '目的仓', '发货单号', '物流商', '物流渠道', '运输方式', '发货单建单日', '发货日', '预计到仓日',
    '领星状态', 'FBA建单时间', 'FBA已发货时间', 'FBA接收中时间', '发货量', '已收量', ...CARRIER_FIELDS] },
  det: { id: 'tblW09RSzUtYaCRm', name: '货件商品明细-灯', fields: ['货件号', 'MSKU', 'ASIN', '品名', '发货量', '已收量'] },
};
// 物流商导出表 表头 → 字段（同 sync_fba_logistics.py 的 CARRIER_MAP）
const CARRIER_MAP = { '运单状态': '物流商运单状态', '轨迹明细': '物流商轨迹', '签收时间': '物流商签收时间', '预计送达': '物流商预计送达', '签收时效': '物流商签收时效',
  '收货渠道': '物流商收货渠道', '预报件数': '物流商箱数', '产品': '物流商产品', '产品名称': '物流商申报品名' };
const CARRIER_NUM = new Set(['物流商签收时效', '物流商箱数']);

// ===== ② 通用工具 =====
const $ = (id) => document.getElementById(id);
const DAY = 86400000, BJ = 8 * 3600000;
const dn = (ms) => Math.floor((Number(ms) + BJ) / DAY);
const today0 = dn(Date.now());
const ud = (n) => new Date(n * DAY);
const fmtD = (n) => { const d = ud(n); return `${d.getUTCMonth() + 1}-${String(d.getUTCDate()).padStart(2, '0')}`; };
const fmtMD = (n) => { const d = ud(n); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`; };
const fmtFull = (n) => { const d = ud(n); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`; };
const n0 = (v) => (v == null || v === '' || isNaN(v)) ? 0 : Number(v);
const f = (v) => n0(v) ? n0(v).toLocaleString('zh-CN') : '0';
const pc = (a, b) => b ? Math.round(a / b * 100) + '%' : '';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function dayOf(v) {   // 毫秒 / 'YYYY-MM-DD…' → 北京天序号
  if (v == null || v === '') return null;
  if (typeof v === 'number') return dn(v);
  const m = String(v).match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m ? Math.floor(Date.UTC(+m[1], +m[2] - 1, +m[3]) / DAY) : null;
}
const cnDay = (s) => { const m = String(s || '').match(/(\d{4})年(\d{1,2})月(\d{1,2})日/); return m ? Math.floor(Date.UTC(+m[1], +m[2] - 1, +m[3]) / DAY) : null; };
const sunday = (n) => n - ((n + 4) % 7);   // 天序号 → 所在周的周日（1970-01-01 是周四）
function cell(v) {
  if (v == null) return null;
  if (typeof v === 'number' || typeof v === 'string' || typeof v === 'boolean') return v;
  if (Array.isArray(v)) {
    if (!v.length) return null;
    if (v.every((x) => x && typeof x === 'object' && 'text' in x && !('id' in x && 'name' in x && !('type' in x)))) return v.map((x) => x.text ?? '').join('');
    if (v.length === 1) return cell(v[0]);
    return v.map(cell).join('、');
  }
  if (typeof v === 'object') { if ('text' in v) return v.text; if ('name' in v) return v.name; if ('value' in v) return cell(v.value); }
  return String(v);
}
const shortStore = (s) => String(s || '').replace(/^cathy-/, '').replace(/-?林1-?/, '-').replace(/-+$/, '');   // 李楚红-US-林1 → 李楚红-US
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

let SDK = null;
const TBLS = {}, FIDS = {};
async function readTable(key) {
  const cfg = TABLES[key];
  const table = await SDK.bitable.base.getTableById(cfg.id);
  const fields = await table.getFieldMetaList();
  TBLS[key] = table;
  FIDS[key] = Object.fromEntries(fields.map((x) => [x.name, x.id]));
  const missing = cfg.fields.filter((w) => !FIDS[key][w]);
  if (missing.length) console.warn(`表 ${cfg.name} 缺字段：`, missing);
  const rows = [];
  let pageToken;
  for (let guard = 0; guard < 500; guard++) {
    const res = await table.getRecordsByPage({ pageSize: 200, pageToken });
    for (const r of res.records) {
      const o = { _id: r.recordId };
      for (const w of cfg.fields) if (FIDS[key][w]) o[w] = cell(r.fields[FIDS[key][w]]);

// ===== ⑦ 导入物流商表（页面里选 xlsx → 按 FBA ID 匹配 → 写物流商字段） =====
async function unzip(buf) {   // 极简 zip 读取：中央目录 + DecompressionStream('deflate-raw')，不依赖外部库
  const v = new DataView(buf), u8 = new Uint8Array(buf);
  let e = buf.byteLength - 22; while (e >= 0 && v.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('不是有效的 xlsx 文件');
  let p = v.getUint32(e + 16, true); const n = v.getUint16(e + 10, true), out = {};
  const td = new TextDecoder();
  for (let i = 0; i < n; i++) {
    const method = v.getUint16(p + 10, true), size = v.getUint32(p + 20, true), nl = v.getUint16(p + 28, true), xl = v.getUint16(p + 30, true), cl = v.getUint16(p + 32, true), off = v.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nl));
    const start = off + 30 + v.getUint16(off + 26, true) + v.getUint16(off + 28, true);
    out[name] = { method, data: u8.subarray(start, start + size) };
    p += 46 + nl + xl + cl;
  }
  return async (name) => {
    const ent = out[name]; if (!ent) return null;
    if (ent.method === 0) return td.decode(ent.data);
    return td.decode(await new Response(new Blob([ent.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  };
}
async function readXlsx(file) {
  const get = await unzip(await file.arrayBuffer());
  const X = (s) => new DOMParser().parseFromString(s, 'application/xml');
  const ss = []; const sst = await get('xl/sharedStrings.xml');
  if (sst) X(sst).querySelectorAll('si').forEach((si) => ss.push([...si.getElementsByTagName('t')].map((t) => t.textContent).join('')));
  const wb = X(await get('xl/workbook.xml')), rels = X(await get('xl/_rels/workbook.xml.rels'));
  const rid = wb.getElementsByTagName('sheet')[0].getAttribute('r:id') || wb.getElementsByTagName('sheet')[0].getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
  let target = [...rels.getElementsByTagName('Relationship')].find((r) => r.getAttribute('Id') === rid).getAttribute('Target').replace(/^\//, '');
  if (!target.startsWith('xl/')) target = 'xl/' + target;
  const rows = [];
  X(await get(target)).querySelectorAll('row').forEach((r) => {
    const o = {};
    r.querySelectorAll('c').forEach((c) => {
      const col = c.getAttribute('r').match(/[A-Z]+/)[0], t = c.getAttribute('t'), vv = c.getElementsByTagName('v')[0];
      o[col] = t === 's' ? ss[+vv.textContent] : t === 'inlineStr' ? [...c.getElementsByTagName('t')].map((x) => x.textContent).join('') : vv ? vv.textContent : '';
    });
    rows.push(o);
  });
  return rows;
}
function readCsv(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.map((r) => Object.fromEntries(r.map((v, i) => [String(i), v])));
}
function toRecords(rows) {
  const hi = rows.findIndex((r) => Object.values(r).some((v) => String(v || '').trim().toUpperCase() === 'FBA ID'));
  if (hi < 0) throw new Error('表里没找到「FBA ID」表头。需要物流商「物流最新情况」导出格式（至少含 FBA ID、运单状态 两列）');
  const head = Object.fromEntries(Object.entries(rows[hi]).filter(([, v]) => v).map(([k, v]) => [k, String(v).trim()]));
  const cols = Object.values(head);
  return { cols, recs: rows.slice(hi + 1).map((r) => Object.fromEntries(Object.entries(r).filter(([k]) => head[k]).map(([k, v]) => [head[k], String(v ?? '').replace(/ /g, ' ').trim()]))).filter((o) => o['FBA ID']) };
}
let PENDING = null;
$('imp').onclick = () => { $('file').value = ''; $('file').click(); };
$('file').onchange = async () => {
  const file = $('file').files[0]; if (!file) return;
  try {
    const rows = /\.csv$/i.test(file.name) ? readCsv(await file.text()) : await readXlsx(file);
    const { cols, recs } = toRecords(rows);
    const byId = new Map(SHIPS.map((x) => [x.id.toUpperCase(), x]));
    const hit = [], miss = [];
    for (const o of recs) { const x = byId.get(o['FBA ID'].toUpperCase()); (x ? hit : miss).push([o, x]); }
    const used = Object.keys(CARRIER_MAP).filter((k) => cols.includes(k));
    const chg = hit.filter(([o, x]) => used.some((k) => String(o[k] ?? '') !== String(x.s[CARRIER_MAP[k]] ?? ''))).length;

      <div class="meta" style="margin-top:6px">会写入的列：${used.map((k) => `${esc(k)} → ${esc(CARRIER_MAP[k])}`).join('，')}${used.length < Object.keys(CARRIER_MAP).length ? `<br>表里没有的列（保持原值）：${Object.keys(CARRIER_MAP).filter((k) => !used.includes(k)).join('、')}` : ''}</div>
      ${miss.length ? `<ul>${miss.slice(0, 60).map(([o]) => `<li>${esc(o['FBA ID'])}　${esc(o['产品'] || '')}　${esc(o['运单状态'] || '')}</li>`).join('')}${miss.length > 60 ? `<li>… 另 ${miss.length - 60} 个</li>` : ''}</ul>` : ''}
      <div class="row"><button class="ctl" id="dlgNo">取消</button><button class="ctl btn" id="dlgOk" ${hit.length ? '' : 'disabled'}>写入 ${hit.length} 个货件</button></div>`);

};
function dialog(html) { closeDialog(); const m = document.createElement('div'); m.className = 'mask'; m.id = 'mask'; m.innerHTML = `<div class="dlg">${html}</div>`; document.body.appendChild(m); }
function closeDialog() { const m = $('mask'); if (m) m.remove(); }
async function doImport() {

      plain['物流商更新时间'] = now; plain['物流商导入来源'] = file;

  } catch (e) {

    btn.insertAdjacentHTML('beforebegin', `<span class="err" style="margin-right:auto">写入失败：${esc(e && e.message ? e.message : e)}（应用的数据权限要对「货件物流跟踪-灯」开「可编辑」）</span>`);
  }
}

async function diagnose() {
  const res = [];
  const t = async (name, fn) => {
    try { const v = await Promise.race([fn(), new Promise((_, rej) => setTimeout(() => rej(new Error('超时 8s')), 8000))]);
      let shown; try { shown = typeof v === 'string' ? v : JSON.stringify(v); } catch (x) { shown = String(v); } res.push(['✔', name, String(shown).slice(0, 300)]); return v; }
    catch (e) { res.push(['✘', name, e && e.message ? e.message : String(e)]); return undefined; }
  };
  const { bitable, dashboard } = SDK;
  await t('dashboard.state', async () => dashboard.state);
  await t('dashboard.getConfig', () => dashboard.getConfig());
  for (const [k, c] of Object.entries(TABLES)) {
    const tb = await t(`getTableById ${c.name}`, () => bitable.base.getTableById(c.id));
    if (tb) await t(`getRecordsByPage ${c.name}`, () => tb.getRecordsByPage({ pageSize: 2 }));
  }
  return `<div class="box"><b>接口诊断</b> <span class="meta">请把这块整体截图发回</span><table class="mini"><tbody>${res.map((r) =>
    `<tr><td style="width:24px">${r[0]}</td><td style="width:220px">${esc(r[1])}</td><td style="white-space:normal;color:var(--sub)">${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>`;
}
