<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>采购流程</title>
<!--
  飞书应用「灯具组-全流程」插件页：采购流程（2026-10-27）
  ① 发起申请：按 SPU 选 SKU → 填本次采购量/收货地/开票/运费 → 提交（写 实际采购量 + 合并采购复选框，再触发「采购计划申请_运营申请」）
  ② 审批：按「批次标识_采购」一张卡；运营主管（运营主管_采购）通过/驳回；采购主管（采购主管）分配采购员 → 通过/驳回
  ③ 采购进度：读「灯具组-采购计划管理表」（外部服务在领星建单后回流），按 来源申请批次 = 申请表 批次标识_采购 接上
  按钮字段的自动化插件点不了：表里有「页面操作」单选字段（+ 配套自动化）时页面写它来触发；没有时页面先把数据写好，再给出去表里点按钮的链接。
  驳回、分配采购员是页面直接写字段，不依赖自动化。
  页面里只有 base token 和表 ID，没有任何密钥。发布：连同 sdk/ 拷到 github-pages/caigou-flow/。
  本地预览：build_preview.py 注入 window.__SNAPSHOT__ → preview.html（含业务数据，不推送）；预览里的写入只改内存，并模拟自动化的效果。
-->
<style>
  :root {
    --bg: #f5f6f7; --card: #ffffff; --ink: #1f2329; --sub: #646a73; --line: #e5e6eb;
    --blue: #3370ff; --blue-soft: #e1eaff; --red: #f54a45; --red-soft: #fde2e2;
    --yellow: #ff8800; --yellow-soft: #fff1d6; --green: #2ea121; --green-soft: #d9f5d6; --purple: #7f3bf5; --purple-soft: #ece2fe;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { padding: 12px 16px 0; height: 100vh; display: flex; flex-direction: column; }
  .tip { flex: none; background: #fff7e8; color: #b25e00; border-radius: 8px; padding: 6px 12px; font-size: 12.5px; margin-bottom: 8px; }
  .savebar { flex: none; display: none; align-items: center; gap: 12px; background: #fff7e8; border: 1px solid #ffd591; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
  .savebar.show { display: flex; }
  .savebar button { height: 32px; padding: 0 16px; border: 0; border-radius: 6px; background: var(--blue); color: #fff; font-size: 14px; cursor: pointer; }

  /* 顶栏不参与滚动；#main 自己滚（页面硬规矩：筛选栏始终可见） */
  .sticky { flex: none; position: relative; z-index: 20; background: var(--bg); margin: 0 -16px; padding: 2px 16px 8px; }
  .sticky.stuck { box-shadow: 0 6px 12px -8px rgba(0,0,0,.25); }
  .row1 { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .row1 h1 { margin: 0; font-size: 17px; }
  .row2 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  #main { flex: 1; min-height: 0; overflow: auto; margin: 0 -16px; padding: 0 16px 32px; }
  .tabs { display: flex; gap: 4px; background: #eceef1; border-radius: 8px; padding: 3px; }
  .tabs button { border: 0; background: none; padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--sub); }
  .tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .tabs .num { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; line-height: 18px; margin-left: 4px; text-align: center; }
  .tabs .num.gray { background: #bbbfc4; }
  .chips { display: inline-flex; border: 1px solid #d0d3d6; border-radius: 6px; overflow: hidden; }
  .chips button { border: 0; background: #fff; padding: 4px 12px; cursor: pointer; font: inherit; color: var(--ink); }
  .chips button + button { border-left: 1px solid #d0d3d6; }
  .chips button.on { background: var(--blue); color: #fff; }
  .who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sub); }
  .avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--blue); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
  .meta { color: var(--sub); font-size: 12px; }
  .hint { color: var(--sub); font-size: 12px; }
  .err { color: var(--red); white-space: pre-wrap; }
  .loading { padding: 40px; text-align: center; color: var(--sub); }
  input, select, textarea { font: inherit; color: var(--ink); border: 1px solid #d0d3d6; border-radius: 6px; padding: 4px 8px; background: #fff; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-soft); }
  input:disabled, select:disabled { background: var(--bg); color: var(--sub); }
  input.warn { border-color: #ffb54d; background: #fffaf0; }
  .btn { height: 30px; padding: 0 14px; border-radius: 6px; border: 1px solid #d0d3d6; background: #fff; cursor: pointer; font: inherit; white-space: nowrap; }
  .btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.ok { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.danger { color: var(--red); border-color: #f8b7b5; }
  .btn:disabled { opacity: .5; cursor: default; }
  .link { border: 0; background: none; color: var(--blue); cursor: pointer; font: inherit; font-size: 12px; padding: 0; }
  .badge { display: inline-block; border-radius: 4px; padding: 0 7px; font-size: 12px; line-height: 20px; white-space: nowrap; }
  .b-green { background: var(--green-soft); color: var(--green); }
  .b-yellow { background: var(--yellow-soft); color: #b25e00; }
  .b-red { background: var(--red-soft); color: var(--red); }
  .b-blue { background: var(--blue-soft); color: var(--blue); }
  .b-purple { background: var(--purple-soft); color: var(--purple); }
  .b-gray { background: #eff0f1; color: var(--sub); }
  .card { background: var(--card); border-radius: 8px; padding: 14px 16px; border: 1px solid var(--line); margin-bottom: 12px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card h3 small { font-weight: normal; color: var(--sub); font-size: 12px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  .tbl th, .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: middle; }
  .tbl th { color: #fff; font-weight: 500; background: var(--blue); font-size: 12px; position: sticky; top: 0; z-index: 2; border-bottom-color: var(--blue); }
  .tbl td.r, .tbl th.r { text-align: right; }
  .tbl tr.locked td { background: #fafafa; color: var(--sub); }
  .tbl tr.picked td { background: #f3f7ff; }
  .tbl tr.child td { background: #fcfcfd; }
  .tbl tr.child td.sku { padding-left: 26px; }
  .mono { font-family: Consolas, monospace; font-size: 12.5px; }
  .nm { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  .thumb { width: 36px; height: 36px; border-radius: 4px; background: #f0f1f3; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; color: #c0c4c9; font-size: 10px; vertical-align: middle; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .tbl input.qty { width: 70px; text-align: right; font-weight: 600; }
  .tbl input.t { width: 66px; }
  .tbl td, .tbl th { padding-left: 6px; padding-right: 6px; }
  .tbl select.t { width: 64px; }
  .tbl select.store { width: 112px; }
  .tbl select.wh { width: 150px; }
  .colors { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-left: 10px; padding-left: 10px; border-left: 1px solid #d0d3d6; }
  .colors button { border: 1px solid #d0d3d6; background: #fff; border-radius: 12px; padding: 1px 10px; cursor: pointer; font: inherit; font-size: 12px; color: var(--ink); }
  .colors button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .qwrap { display: flex; align-items: center; gap: 6px; }
  .boxq { font-size: 12px; color: var(--sub); white-space: nowrap; }

  /* ① 发起申请：左 SPU 栏 + 右表 */
  .split { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 12px; align-items: start; }
  .side { position: sticky; top: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; max-height: calc(100vh - 150px); overflow: auto; }
  .side .it { display: flex; align-items: center; gap: 6px; padding: 6px 12px; cursor: pointer; border-bottom: 1px solid #f2f3f5; }
  .side .it:hover { background: #f5f8ff; }
  .side .it.on { background: var(--blue-soft); color: var(--blue); font-weight: 500; }
  .side .it .n { margin-left: auto; color: var(--sub); font-size: 12px; }
  .side .it .d { min-width: 16px; padding: 0 4px; border-radius: 8px; font-size: 11px; line-height: 16px; text-align: center; }
  .side .grp { padding: 6px 12px 4px; font-size: 12px; color: var(--sub); background: #fafbfc; border-bottom: 1px solid var(--line); position: sticky; top: 0; }
  .fillbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; background: #fafbfc; border: 1px dashed #d0d3d6; border-radius: 6px; margin-bottom: 8px; font-size: 12px; color: var(--sub); }
  .fillbar input { width: 100px; }
  .cart { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: #eef3ff; border: 1px solid #c3d4ff; border-radius: 8px; padding: 7px 12px; margin-top: 8px; }
  .cart b { color: var(--blue); }

  /* ② 审批：批次卡 */
  .bcard { border-left: 4px solid var(--blue); }
  .bcard.s-ops { border-left-color: var(--blue); }
  .bcard.s-buy { border-left-color: var(--purple); }
  .bcard.s-gen { border-left-color: var(--yellow); }
  .bcard.s-rej { border-left-color: var(--red); }
  .bcard.mine { box-shadow: 0 0 0 2px #ffd591; }
  .steps { display: flex; align-items: center; gap: 0; margin: 4px 0 10px; flex-wrap: wrap; }
  .step { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); }
  .step i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #d0d3d6; display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: 11px; background: #fff; }
  .step.done { color: var(--green); } .step.done i { border-color: var(--green); background: var(--green); color: #fff; }
  .step.cur { color: var(--blue); font-weight: 600; } .step.cur i { border-color: var(--blue); color: var(--blue); }
  .step.bad { color: var(--red); font-weight: 600; } .step.bad i { border-color: var(--red); background: var(--red); color: #fff; }
  .step + .step::before { content: ''; width: 34px; height: 2px; background: #e0e2e6; margin: 0 8px; }
  .step.done + .step::before { background: var(--green); }
  .acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .acts .who-note { color: var(--sub); font-size: 12px; margin-right: auto; }

  /* ③ 进度 */
  .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #eff0f1; width: 220px; }
  .bar span { display: block; height: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
  .kpi.on { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-soft); }
  .kpi .v { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .kpi .l { color: var(--sub); font-size: 12px; }
  .late { color: var(--red); font-weight: 600; }
  details.fold > summary { cursor: pointer; color: var(--sub); font-size: 12px; margin: 6px 0; }

  /* 弹窗 */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: flex-start; justify-content: center; z-index: 50; padding-top: 40px; }
  .mask.show { display: flex; }
  .dlg { background: #fff; border-radius: 10px; width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 80px); display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.2); }
  .dlg header { padding: 14px 18px; font-size: 16px; font-weight: 600; border-bottom: 1px solid var(--line); }
  .dlg .body { padding: 14px 18px; overflow: auto; }
  .dlg footer { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
  .warnbox { background: var(--yellow-soft); color: #8a4b00; border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; font-size: 12.5px; }
  .okbox { background: var(--green-soft); color: #1d6d16; border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; font-size: 12.5px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1f2329; color: #fff; padding: 8px 16px; border-radius: 6px; z-index: 60; display: none; }
  .empty { padding: 30px; text-align: center; color: var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <div class="tip" id="tallTip" style="display:none">插件框比屏幕还高，往下滑时顶部筛选栏会被滚走。请在应用编辑模式里把这个插件组件的高度拖到一屏以内，页面会改成内部滚动、顶栏固定。</div>
  <div class="tip" id="simTip" style="display:none"></div>
  <div class="savebar" id="savebar">
    <span>这是插件的配置预览。确认没问题后点右边按钮，插件才会保存到应用页面上。</span>
    <button id="saveBtn">保存到页面</button>
    <span class="meta" id="saveMsg"></span>
  </div>
  <div class="sticky" id="sticky">
    <div class="row1">
      <h1>采购流程</h1>
      <div class="tabs" id="tabs"></div>
      <span class="meta" id="meta">数据加载中…</span>
      <div class="who" id="who"></div>
    </div>
    <div class="row2" id="filters"></div>
    <div id="cart"></div>
  </div>
  <div id="main"><div class="loading">正在读取多维表数据…</div></div>
</div>
<div class="mask" id="mask"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
// ===== ① 页面配置 =====
const SDK_URLS = (() => { const a = []; try { a.push(new URL('./sdk/index.mjs', location.href).href); } catch (e) { /* data: 网址预览 */ }
  return a.concat(['https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/dist/index.mjs', 'https://unpkg.com/@lark-base-open/js-sdk@1.0.2/dist/index.mjs']); })();
const BASE_TOKEN = 'JGvebyaAYapWtOslxc9cuKYXnwd';   // 灯具组-全流程
const TABLES = {
  // 第一张 = saveConfig 第一条 dataCondition（应用只按这一条给授权）；管理表要在「数据授权（勿删）」页另加组件
  apply: { id: 'tblvt4KuPv7dnduI', name: '采购计划申请表', fields: ['父ASIN/SKU', '品名', 'SPU', '父ASIN', '店铺', '图片', '上次采购量', '实际采购量', '合并采购复选框',
    '采购流程', '采购申请人', '申请时间_采购', '批次标识_采购', '运营主管_采购', '采购主管', '采购员', '收货地', '是否开票', '可开发票类型', '有无运费',
    'SKU仓库_采购', 'SKU备注_采购', '批次备注_采购', '修改人', '更新时间', '页面操作'] },
  // 每箱数量、销售季分类按 领星SKU = 申请表 父ASIN/SKU 取；主表没登记的 SKU 按 SPU 借同 SPU 的分类
  pm: { id: 'tblqksywqgYvywOT', name: '产品主表-灯类+精铺', fields: ['领星SKU', '单箱数量', '销售季分类', 'SPU', '产品线'] },
  mgmt: { id: 'tblTRcHwrEwr0Jmh', name: '采购计划管理表', fields: ['来源申请批次', '创建批次号', '计划编号', '关联产品sku', '品名', 'SPU', '采购量', '父记录', '领星采购单号',
    '供应商', '分配采购员', '采购员', '申请人', '日期', '采购单创建时间', '预计到货时间', '采购单状态', '采购计划状态', '到货状态', '入库量', '待到货量', '采购进度',
    '物流公司', '物流单号', '收货地', '单据备注', '批次备注', '价税合计'] },
};
// 自动化里写死的人（采购计划申请_运营申请 wkf8N64nwIXesGgk 会把这两人写进每行）；行上有值时以行上为准
const OPS_LEAD = { id: 'ou_24e3d484ccc9e17e463774309651251a', name: '林键春' };
const BUY_LEAD = { id: 'ou_9b1d429b0ce616bd7b39542a2fee6299', name: '颜蕾' };
// 「页面操作」单选字段的选项 → 配套自动化（待建）；字段不存在时退回「去表里点按钮」
const ACT = { submit: '提交申请', ops: '运营主管通过', buy: '采购主管通过' };
const TABLE_URL = (view) => `https://zcnt6ibhe9z3.feishu.cn/base/${BASE_TOKEN}?table=${TABLES.apply.id}${view ? '&view=' + view : ''}`;
const VIEW_OF = { submit: 'vewAGjQK13', ops: 'vewhhRJzfT', buy: 'vewRC9XrRU' };   // 表格 / 待运营主管审批 / 待采购主管审批
const BTN_OF = { submit: '申请采购计划', ops: '运营主管审批', buy: '采购主管审批' };
const PENDING = ['待运营主管审批', '待采购主管审批', '生成中'];

// ===== ② 通用工具 =====
const $ = (id) => document.getElementById(id);
const DAY = 86400000, BJ = 8 * 3600000;
const dn = (ms) => Math.floor((Number(ms) + BJ) / DAY);
const today0 = dn(Date.now());
const pad = (n) => String(n).padStart(2, '0');
const bj = (ms) => new Date(Number(ms) + BJ);
const fmtD = (ms) => ms ? `${bj(ms).getUTCMonth() + 1}-${pad(bj(ms).getUTCDate())}` : '—';
const fmtDT = (ms) => ms ? `${fmtD(ms)} ${pad(bj(ms).getUTCHours())}:${pad(bj(ms).getUTCMinutes())}` : '—';
const n0 = (v) => { if (v == null || v === '') return 0; const x = Number(String(v).replace(/[,$¥%\s]/g, '')); return isNaN(x) ? 0 : x; };
const fmtN = (v) => (v == null || v === '' || isNaN(v)) ? '—' : Number(v).toLocaleString('zh-CN', { maximumFractionDigits: 0 });
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uniq = (a) => [...new Set(a.filter((x) => x != null && x !== ''))];
const LS = (() => { try { const s = window.localStorage; s.getItem('x'); return s; } catch (e) { return null; } })();
const lsGet = (k, d) => { try { return JSON.parse(LS.getItem(k)) ?? d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { LS && LS.setItem(k, JSON.stringify(v)); } catch (e) { /* 存不了就算了 */ } };
const toast = (s, ms = 2600) => { const t = $('toast'); t.textContent = s; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => { t.style.display = 'none'; }, ms); };

function cell(v) {
  if (v == null) return null;
  if (typeof v === 'number' || typeof v === 'string' || typeof v === 'boolean') return v;
  if (Array.isArray(v)) {
    if (!v.length) return null;
    if (v.every((x) => x && typeof x === 'object' && 'text' in x && !('id' in x && 'name' in x && !('type' in x)))) return v.map((x) => x.text ?? '').join('');
    if (v.length === 1) return cell(v[0]);
    return v.map(cell).join('、');
  }
  if (typeof v === 'object') { if ('text' in v) return v.text; if ('name' in v) return v.name; if ('value' in v) return cell(v.value); }
  return String(v);
}
function linkIds(v) {
  if (!v) return [];
  if (typeof v === 'string') return v.startsWith('rec') ? [v] : [];
  if (Array.isArray(v)) return v.flatMap(linkIds);

// ===== 导入本地表格：按 SKU 匹配，把数量加到本次采购量 =====
// 支持 .xlsx（浏览器自带解压，不依赖外部库）和 .csv；表头里找「SKU」列和「数量/采购量」列，没表头就当 第1列=SKU、第2列=数量
async function unzipEntries(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);

  const out = {}, dec = new TextDecoder();
  for (let i = 0; i < n; i++) {
    const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true), nl = dv.getUint16(off + 28, true), el = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true), lho = dv.getUint32(off + 42, true);
    const name = dec.decode(u8.subarray(off + 46, off + 46 + nl));
    out[name] = { method, csize, lho };
    off += 46 + nl + el + cl;
  }
  const read = async (name) => {
    const e = out[name]; if (!e) return null;
    const start = e.lho + 30 + dv.getUint16(e.lho + 26, true) + dv.getUint16(e.lho + 28, true);
    const data = u8.subarray(start, start + e.csize);
    if (e.method === 0) return dec.decode(data);
    const ds = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(ds).text();
  };

async function importFile(file) {

  for (const [k, w] of want) {

      能加 <b>${ok.length}</b> 个${lockedRows.length ? ` · 审批中跳过 <b>${lockedRows.length}</b> 个` : ''}${miss.length ? ` · 表里找不到 <b>${miss.length}</b> 个` : ''}${bad.length ? ` · 数量为空/0 忽略 ${bad.length} 行` : ''}</div>
    ${ok.length ? `<table class="tbl"><thead><tr><th>SKU</th><th>品名</th><th>店铺</th><th class="r">已填</th><th class="r">+ 导入</th><th class="r">= 本次采购量</th></tr></thead><tbody>${ok.map((x) => `<tr><td class="mono">${esc(x.r['父ASIN/SKU'])}${x.dup ? ' <span class="badge b-yellow" title="申请表里这个 SKU 有多行，加到第一条未在审批中的">重复行</span>' : ''}</td><td class="nm">${esc(x.r['品名'])}</td><td>${esc(draftVal(x.r, '店铺'))}</td><td class="r">${x.before ? fmtN(x.before) : '—'}</td><td class="r">${fmtN(x.q)}</td><td class="r"><b>${fmtN(x.after)}</b></td></tr>`).join('')}</tbody></table>` : ''}

      if (why == null) return;
      btn.disabled = true;
      const tag = `【驳回 ${ME.name || ''} ${fmtDT(Date.now())}】${why}`;
      await write('apply', b.rows.map((r) => ({ id: r._id, f: { '采购流程': '已驳回', '合并采购复选框': false, '批次备注_采购': [r['批次备注_采购'], tag].filter(Boolean).join(' ') } })));
      toast('已驳回'); render(); return;
    }
    if (act === 'ops') { btn.disabled = true; if (await trigger('ops', b.rows)) toast('已通过，交给采购主管'); render(); return; }
    if (act === 'buy') {
      const sel = document.getElementById('buyer_' + b.key), uid = sel && sel.value;

      if (await trigger('buy', b.rows)) toast('已通过，正在生成采购计划');
      render();
    }
  } catch (e) { btn.disabled = false; alertErr(e); }
}

      <td class="r"><b>${fmtN(r['采购量'])}</b></td><td class="r">${r['入库量'] == null ? '—' : fmtN(r['入库量'])}</td><td class="r">${r['待到货量'] == null ? '—' : fmtN(r['待到货量'])}</td>
      <td><span class="badge ${prog(p)}">${esc(p)}</span></td>
      <td class="mono">${esc(r['领星采购单号'] || '—')}</td><td class="nm" style="max-width:160px" title="${esc(r['供应商'])}">${esc(r['供应商'] || '—')}</td>
      <td>${esc(r['分配采购员'] || (r['采购员'] || []).map((u) => u.name).join('、') || '—')}</td>
      <td>${fmtD(r['预计到货时间'])}${late ? ` <span class="late">逾期 ${late} 天</span>` : ''}</td>
      <td>${esc(r['收货地'] || '—')}</td></tr>`;
  };
  const card = (b) => {
    const total = b.rows.length;
    const seg = Object.entries(b.cnt).map(([p, n]) => `<span style="width:${(n / total) * 100}%;background:${COLORS[p] || '#ccc'}" title="${esc(p)} ${n}"></span>`).join('');
    const rows = (q ? b.rows.filter((r) => hit(r) || (b.kids.get(r._id) || []).some(hit)) : b.rows);
    const note = uniq(b.rows.map((r) => r['批次备注'] || r['单据备注'])).slice(0, 3);
    return `<div class="card"><h3>${esc(b.who || '—')} · ${esc(b.lab.when)} <small>${total} 个计划 · 合计 ${fmtN(b.qty)} 件 · ${esc(b.key)}</small>
      <span class="bar">${seg}</span><small>${Object.entries(b.cnt).map(([p, n]) => `${esc(p)} ${n}`).join(' · ')}</small>${b.late ? `<span class="badge b-red">最长逾期 ${b.late} 天</span>` : ''}</h3>
      ${note.length ? `<div class="hint" style="margin:-4px 0 8px">备注：${esc(note.join(' ｜ ')).slice(0, 300)}</div>` : ''}
      <div style="overflow:auto"><table class="tbl"><thead><tr><th>SKU / 品名</th><th class="r">采购量</th><th class="r">入库</th><th class="r">待到货</th><th>进度</th><th>领星采购单</th><th>供应商</th><th>采购员</th><th>预计到货</th><th>收货地</th></tr></thead>
      <tbody>${rows.map((r) => tr(r, false) + (b.kids.get(r._id) || []).map((c) => tr(c, true)).join('')).join('')}</tbody></table></div></div>`;
  };
  const LIM = 40;
  $('main').innerHTML = `<div class="kpis">${kpi('open', k.open, '未完成批次', 'var(--blue)')}${kpi('late', k.late, '有逾期的批次', 'var(--red)')}${kpi('wait', k.wait, '待下单（计划行）', '#b25e00')}
    ${kpi('part', k.part, '部分到货（计划行）', 'var(--yellow)')}${kpi('done', k.done, '已全部到货批次', 'var(--green)')}${kpi('all', tb.length, '全部批次', 'var(--ink)')}</div>
    ${list.length ? list.slice(0, LIM).map(card).join('') + (list.length > LIM ? `<div class="hint" style="text-align:center">还有 ${list.length - LIM} 个批次，用申请人/搜索缩小范围</div>` : '') : '<div class="card empty">没有符合条件的批次</div>'}`;
  $('main').querySelectorAll('.kpi').forEach((el) => { el.onclick = () => { F.track = el.dataset.k; renderTrack(); }; });
}

// ===== ⑩ 图片（申请表「图片」第一张，懒加载）=====
const IMG = {};
let io = null;
function loadImages() {
  if (io) io.disconnect();
  io = new IntersectionObserver((ents) => ents.forEach(async (en) => {
    if (!en.isIntersecting) return;
    io.unobserve(en.target);
    const rid = en.target.dataset.img, r = (DATA.apply || []).find((x) => x._id === rid);
    if (!r || !(r['图片'] || []).length) return;
    let u = IMG[rid] || r._imgData;
    if (!u && TBL.apply && META.apply['图片']) { try { const a = await TBL.apply.getCellAttachmentUrls([r['图片'][0].token], META.apply['图片'].id, rid); u = a && a[0]; } catch (e) { /* 没图就算了 */ } }
    if (u) { IMG[rid] = u; en.target.innerHTML = `<img src="${esc(u)}" alt="" loading="lazy">`; }
  }), { root: $('main'), rootMargin: '200px' });
  $('main').querySelectorAll('[data-img]').forEach((el) => { if (IMG[el.dataset.img]) el.innerHTML = `<img src="${esc(IMG[el.dataset.img])}" alt="">`; else io.observe(el); });
}

// ===== ⑪ 弹窗 =====
function dialog(title, body, buttons) {
  $('dlg').innerHTML = `<header>${esc(title)}</header><div class="body">${body}</div><footer>${buttons.map(([t, c], i) => `<button class="${c}" data-i="${i}">${t}</button>`).join('')}</footer>`;
  $('dlg').querySelectorAll('footer button').forEach((b) => { b.onclick = () => buttons[+b.dataset.i][2](b); });
  $('mask').classList.add('show');
}
function closeDlg() { $('mask').classList.remove('show'); }
function alertErr(e) {
  const m = e && e.message ? e.message : String(e);
  const hint = /permission|权限|12/.test(m) ? '\n\n多半是应用的数据权限：高级权限 → 应用权限配置 → 你的角色 → 数据权限，把「灯具组-采购计划申请表」开成「可编辑」。' : '';
  dialog('写入失败', `<div class="err">${esc(m + hint)}</div>`, [['关闭', 'btn', closeDlg]]);
}

// ===== ⑫ 渲染入口 =====
function renderMain() { if (VIEW === 'approve') renderApprove(); else if (VIEW === 'track') renderTrack(); else renderApply(); }
function render() { renderTop(); renderMain(); }

// ===== ⑬ 保存 / 诊断 / 布局 =====
function setupSave() {
  const dash = SDK && SDK.dashboard;
  let s = ''; try { s = dash && dash.state; } catch (e) { s = '读取失败'; }
  $('saveMsg').textContent = `（插件状态：${s || '未知'}）`;
  if (dash && typeof dash.saveConfig === 'function' && s !== 'View' && s !== 'FullScreen') {
    $('savebar').classList.add('show');
    $('saveBtn').onclick = async () => {
      $('saveBtn').disabled = true; $('saveMsg').textContent = '保存中…';
      try {
        const ok = await dash.saveConfig({
          // 只登记用户指定的两张：申请表（第一条=授权）、管理表；产品主表由「数据授权（勿删）」页授权（10-28：登记 3 张时保存后宿主一直「加载中」）
          // 10-28 又改：登记 申请表 时保存后宿主一直「加载中」→ 只登记产品主表（和能用的产品主表页一样）；申请表/管理表靠「数据授权3（勿删）」页授权
          dataConditions: [TABLES.pm].map((t) => ({ tableId: t.id, baseToken: BASE_TOKEN, dataRange: { type: 'ALL' }, series: 'COUNTA' })),
          customConfig: { page: document.title, version: 1 },
        });
        $('saveMsg').textContent = ok === false ? '保存失败，请重试' : '已保存 ✔';
      } catch (e) { $('saveMsg').textContent = '保存失败：' + (e && e.message ? e.message : e); }
      finally { $('saveBtn').disabled = false; }
    };
  }
  rendered();
}
// 告诉宿主「插件已渲染」：任何状态都发（编辑态不发时宿主可能一直显示自己的「加载中」）；首屏出来后再发一次
function rendered() { try { const d = SDK && SDK.dashboard; if (d && d.setRendered) d.setRendered().catch(() => {}); } catch (e) { /* 宿主不支持就算了 */ } }
async function diagnose() {
  const res = [];
  const t = async (name, fn) => {
    try {
      const v = await Promise.race([fn(), new Promise((_, rej) => setTimeout(() => rej(new Error('超时 8s')), 8000))]);
      let shown; try { shown = typeof v === 'string' ? v : JSON.stringify(v); } catch (x) { shown = String(v); }
      res.push(['✔', name, String(shown).slice(0, 300)]); return v;
    } catch (e) { res.push(['✘', name, e && e.message ? e.message : String(e)]); return undefined; }
  };
  const { bitable, dashboard } = SDK;
  await t('dashboard.state', async () => dashboard.state);
  await t('dashboard.getConfig（保存下来的配置）', () => dashboard.getConfig());
  await t('bridge.getUserId', () => bitable.bridge.getUserId());
  for (const [k, cfg] of Object.entries(TABLES)) {
    const tb = await t(`打开表 ${cfg.name}`, () => bitable.base.getTableById(cfg.id));
    if (tb) { await t(`${cfg.name} 字段`, async () => (await tb.getFieldMetaList()).length + ' 个'); await t(`${cfg.name} 读记录`, async () => (await tb.getRecordsByPage({ pageSize: 2 })).records.length + ' 行'); }
  }
  res.push(['ℹ', '本页认出的我', `${ME.name || '（未认出）'} · ids=${ME.ids.join(',')}`]);
  return `<div class="card"><h3>接口诊断 <small>请把这块整体截图发回</small></h3><table class="tbl"><tbody>${res.map((r) =>
    `<tr><td style="width:24px">${r[0]}</td><td>${esc(r[1])}</td><td style="white-space:normal;color:var(--sub)">${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>`;
}
function layoutCheck() { $('tallTip').style.display = innerHeight > (screen.availHeight || screen.height || 1080) + 40 ? '' : 'none'; }
window.addEventListener('resize', layoutCheck); layoutCheck();
$('main').addEventListener('scroll', () => $('sticky').classList.toggle('stuck', $('main').scrollTop > 0), { passive: true });
$('mask').addEventListener('click', (e) => { if (e.target === $('mask')) closeDlg(); });

function simSwitch() {
  const opts = [['ou_0eeed8196cfa61af28778d44cb29d9cd', '林谆强（运营）'], ['ou_4cd43bdac45b77e143d81c4ba166f08f', '曾舒婷（运营）'], [OPS_LEAD.id, '林键春（运营主管）'], [BUY_LEAD.id, '颜蕾（采购主管）']];
  return `<label class="badge b-yellow">效果预览 · 模拟换人 <select id="simAs">${opts.map(([id, n]) => `<option value="${id}" ${ME.ids[0] === id ? 'selected' : ''}>${n}</option>`).join('')}</select></label>`;
}

async function loadSdk() {
  const errs = [];
  for (const u of SDK_URLS) {
    try { return await Promise.race([import(u), new Promise((_, rej) => setTimeout(() => rej(new Error('超时 10s')), 10000))]); }
    catch (e) { errs.push(`${u} → ${e && e.message ? e.message : e}`); }
  }
  throw new Error('飞书 SDK 三个来源都没加载上（也就没有「保存到页面」按钮），请截图：' + errs.join(' ｜ '));
}

// ===== 启动 =====
async function boot(again) {
  try {
    if (SNAP) {
      $('simTip').style.display = ''; $('simTip').textContent = `效果预览（${SNAP.at} 快照）：所有按钮都能点，写入只改这个网页的内存，并模拟自动化的效果；刷新网页恢复原样。`;
      if (!again) ME = { ids: ['ou_0eeed8196cfa61af28778d44cb29d9cd'], name: '', known: false };
      if (!again) await Promise.all(Object.keys(TABLES).map(readTable));
      afterLoad(again); return;
    }
    clearInterval(boot.slowTimer);
    const slowTimer = boot.slowTimer = setInterval(async () => {
      if (READY.apply && READY.pm) { clearInterval(slowTimer); return; }
      showProg();
      if (Date.now() - T0 > 20000 && SDK && !boot.diagOnce) { boot.diagOnce = true; try { const d = await diagnose(); const el = document.getElementById('slowDiag'); if (el) el.innerHTML = d; boot.diagHtml = d; } catch (e) { /* 留着进度表 */ } }
    }, 1000);
    if (!SDK) { PROG['飞书开发包'] = '加载中…'; showProg(); const t = Date.now(); SDK = await loadSdk(); PROG['飞书开发包'] = `✔ ${((Date.now() - t) / 1000).toFixed(1)} 秒`; setupSave(); }
    if (!again) {
      ME = { ids: [], name: '', known: false };
      if (loadCache()) afterLoad(false);   // 先用缓存把页面显示出来
    }
    if (again) { REFRESHING = true; READY.apply = READY.pm = READY.mgmt = false; }
    // 启动顺序照能用的插件页（产品主表页）：开发包 → 逐张读表；认人放到页面显示之后（10-28：启动时并发认人+开表，飞书那边全部超时）
    const main = (async () => { await readTable('apply'); await readTable('pm'); })();
    await main;
    const mg = readTable('mgmt').then(() => { if (READY.apply && READY.pm) { renderTop(); if (VIEW === 'track') renderMain(); } })
      .catch((e) => { PROG[TABLES.mgmt.name] = '✘ ' + (e && e.message ? e.message : e); if (READY.apply) toast('采购进度（管理表）没读出来：' + (e && e.message ? e.message : e), 6000); });
    FROM_CACHE = false; clearInterval(slowTimer);
    afterLoad(again); REFRESHING = false;
    if (!again && !ME.ids.length) {   // 页面出来后再认人，只问 getUserId；认不出不影响看数据
      try { const id = await withTimeout(SDK.bitable.bridge.getUserId(), 5000, 'getUserId'); if (id) ME.ids.push(id); } catch (e) { /* 自检里看 */ }
      PROG['识别当前用户'] = ME.ids.length ? '✔' : '没认出（不影响看数据）';
      whoAmI(); renderTop();
    }
    if (/[?&]debug\b/.test(location.search)) $('main').insertAdjacentHTML('afterbegin', `<div class="card"><h3>加载耗时</h3>${Object.entries(PROG).map(([k, v]) => `${esc(k)}：${esc(v)}`).join('<br>')}</div>` + await diagnose());
    await mg;
  } catch (e) {
    clearInterval(boot.slowTimer); FAILED = true;
    const msg = esc(e && e.message ? e.message : e);
    if (FROM_CACHE || REFRESHING) { REFRESHING = false; toast('数据更新失败，页面显示的还是之前的数据：' + msg, 8000); render(); return; }
    $('main').innerHTML = `<div class="card err">加载失败：${msg}${OUTSIDE ? '<br><br>原因：这个网址是直接用浏览器打开的。插件页要在飞书应用「灯具组-全流程」里打开（采购流程页面里的插件），才读得到多维表。' : ''}</div><div class="card">${Object.entries(PROG).map(([k, v]) => `${esc(k)}：${esc(v)}`).join('<br>')}</div>`;
    if (SDK) { try { $('main').insertAdjacentHTML('beforeend', boot.diagHtml || await diagnose()); } catch (e2) { /* 保留报错 */ } }
  }
}
function afterLoad(again) {
  READY.apply = READY.apply || !!FROM_CACHE;
  buildPm(); whoAmI();
  if (!['four', 'season', 'shoe', 'other'].includes(F.line)) F.line = 'four';
  if (!again && VIEW !== 'apply' && VIEW !== 'track' && VIEW !== 'approve') VIEW = 'apply';
  if (!again && !afterLoad.done && batches().some((b) => PENDING.includes(b.status) && myTurn(b))) { VIEW = 'approve'; F.approve = 'todo'; }
  afterLoad.done = true;
  if (!FROM_CACHE) {   // 草稿里已不存在/已锁定的行清掉（只按最新数据清）
    const ok = new Set((DATA.apply || []).filter((r) => !locked(r)).map((r) => r._id));
    for (const k of Object.keys(DRAFT)) if (!ok.has(k)) delete DRAFT[k];
    saveDraft();
  }
  const sc = $('main').scrollTop;
  render();
  $('main').scrollTop = sc;
  rendered();
  $('simTip').style.display = FROM_CACHE || SNAP ? '' : 'none';
  if (FROM_CACHE) $('simTip').textContent = `先显示的是 ${fmtDT(FROM_CACHE)} 的缓存，正在读最新数据…（读完自动刷新；这期间不能提交和审批）`;
}
await boot(false);
</script>
