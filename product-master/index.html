<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>产品主表</title>
<!--
  飞书应用「灯具组-全流程」自定义插件页：产品主表（2026-10-13，方案见 wiki/页面设计/页面清单.md）
  只读写一张表：产品主表-灯类+精铺 tblqksywqgYvywOT（1 行 = 领星SKU × 国家）
  三个视图：
    ① 产品库：按 SPU 分组，同 SKU 的美/加两行合成一张卡；点卡片开详情抽屉，分 5 区查看 / 编辑
    ② 数据体检：缺成本、缺箱规、脏字符、重复行、勾选冲突等，点一条直接打开详情去改
    ③ 下游开关：7 个「进XX」（进四季品追踪 10-13 起不显示，多维表已停用）勾选的矩阵，攒一批改动确认后统一保存
  用户 10-13 定：成本所有人都能改；身份键（领星SKU/ASIN/MSKU/FNSKU）锁定，要解锁才能改；按 SPU 分组；新品登记放二期。
  保存：先弹「旧值 → 新值」清单确认；写前重读这一行，别人刚改过就停下提示，不覆盖。
  只读：图片（在表里上传）、国家文本、Listing审核键（公式）。
  四条硬规矩见 wiki/页面设计/概念/飞书应用自定义插件页.md。
-->
<style>
  :root {
    --bg: #faf6f1; --card: #ffffff; --ink: #2b2118; --sub: #7a6d61; --line: #f0e4d7; --line2: #e8d9c8;
    --or: #f07a12; --or-d: #c95f05; --or-soft: #fff1e2; --or-soft2: #ffe3c4;
    --red: #d9363e; --red-soft: #fdeced; --yel: #b7791f; --yel-soft: #fff7e0; --green: #2a9d4b; --green-soft: #e6f6eb;
    --grey: #9a9089; --grey-soft: #f3efea; --blue: #2f6fd0; --blue-soft: #eaf1fc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  /* 布局（页面硬规矩，10-14）：页面高度 = 插件框高度，顶栏不动，#main 自己滚。别让飞书外层页面滚动 */
  html, body { height: 100%; overflow: hidden; }
  .wrap { padding: 14px 16px 0; max-width: 1600px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
  #main { flex: 1; min-height: 0; overflow: auto; position: relative; margin: 0 -16px; padding: 0 16px 80px; }
  .tip { flex: none; background: var(--yel-soft); color: var(--yel); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; margin-bottom: 8px; }
  .meta { color: var(--sub); font-size: 12px; }
  .err { color: var(--red); white-space: pre-wrap; }
  .loading, .empty { padding: 48px 16px; text-align: center; color: var(--sub); background: #fff; border-radius: 12px; border: 1px dashed var(--line2); }
  .card0 { background: var(--card); border-radius: 10px; padding: 14px 16px; border: 1px solid var(--line); margin-bottom: 12px; }
  .tbl { border-collapse: collapse; width: 100%; }
  .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .mono { font-family: Consolas, monospace; font-size: 12px; }

  /* 顶栏 */
  .sticky { position: relative; flex: none; z-index: 20; background: var(--bg); margin: 0 -16px; padding: 0 16px 2px; }
  .sticky.stuck { box-shadow: 0 6px 12px -8px rgba(80,50,20,.35); }
  .hero { background: linear-gradient(120deg, #f07a12 0%, #f59a3c 60%, #f8b35f 100%); color: #fff; border-radius: 12px 12px 0 0;
          padding: 12px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .hero h2 { margin: 0; font-size: 18px; letter-spacing: .5px; }
  .hero .meta { color: rgba(255,255,255,.92); margin-left: auto; }
  .seg { display: inline-flex; background: rgba(255,255,255,.22); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { height: 28px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: #fff; font-size: 13.5px; cursor: pointer; }
  .seg button.on { background: #fff; color: var(--or-d); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg button i { font-style: normal; font-size: 11px; margin-left: 4px; background: var(--red); color: #fff; border-radius: 8px; padding: 0 5px; }
  .hero-f { background: linear-gradient(120deg, #f38a2a 0%, #f7a650 100%); border-radius: 0 0 12px 12px; padding: 8px 18px 10px; margin-bottom: 12px;
            border-top: 1px solid rgba(255,255,255,.3); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .hero-f select, .hero-f input { height: 28px; border: 0; border-radius: 14px; padding: 0 10px; font-size: 12.5px; color: var(--ink); background: #fff; max-width: 100%; }
  .hero-f select.on { box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(201,95,5,.45); color: var(--or-d); font-weight: 700; }
  .hero-f input { width: 240px; }
  .chip { height: 26px; padding: 0 11px; border-radius: 13px; border: 1px solid rgba(255,255,255,.55); background: rgba(255,255,255,.12); color: #fff; font-size: 12px; cursor: pointer; }
  .chip.on { background: #fff; border-color: #fff; color: var(--or-d); font-weight: 700; }
  .hero-f .clr { margin-left: auto; }

  /* 通用小件 */
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--grey-soft); color: var(--sub); white-space: nowrap; }
  .tag.or { background: var(--or-soft); color: var(--or-d); }
  .tag.ok { background: var(--green-soft); color: var(--green); }
  .tag.bad { background: var(--red-soft); color: var(--red); }
  .tag.warn { background: var(--yel-soft); color: var(--yel); }
  .tag.us { background: var(--blue-soft); color: var(--blue); }
  .tag.ca { background: var(--red-soft); color: var(--red); }
  .btn { height: 28px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line2); background: #fff; color: var(--ink); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--or); color: var(--or-d); }
  .btn.pri { background: var(--or); border-color: var(--or); color: #fff; }
  .btn.pri:hover { background: var(--or-d); color: #fff; }
  .btn.sm { height: 24px; padding: 0 9px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .img { width: 64px; height: 64px; border-radius: 8px; background: var(--grey-soft); display: flex; align-items: center; justify-content: center;
         color: var(--grey); font-size: 11px; overflow: hidden; border: 1px solid var(--line); flex: none; }
  .img img { width: 100%; height: 100%; object-fit: cover; }
  .img.s { width: 36px; height: 36px; border-radius: 6px; font-size: 10px; }
  .img.l { width: 96px; height: 96px; }

  /* ① 产品库 */
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 14px; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; }
  .kpi .k { color: var(--sub); font-size: 12px; }
  .kpi .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 12px; color: var(--sub); font-weight: normal; }
  .kpi .v.bad { color: var(--red); }
  .lib { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 14px; align-items: start; }
  .side { position: sticky; top: 8px; max-height: calc(100vh - var(--stickyH, 0px) - 44px); overflow-y: auto;
          background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
  .kseg { display: flex; background: var(--grey-soft); border-radius: 9px; padding: 3px; gap: 2px; margin-bottom: 6px; position: sticky; top: -6px; z-index: 1; box-shadow: 0 -6px 0 #fff; }
  .kseg button { flex: 1; height: 30px; border: 0; border-radius: 7px; background: transparent; color: var(--sub); font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .kseg button small { font-size: 11px; margin-left: 3px; opacity: .8; }
  .kseg button.on { background: #fff; color: var(--or-d); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .side-h { font-size: 12px; color: var(--sub); padding: 4px 8px 6px; display: flex; justify-content: space-between; }
  .si { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; border-radius: 8px; padding: 6px 8px; cursor: pointer; text-align: left; color: var(--ink); font: inherit; }
  .si:hover { background: var(--or-soft); }
  .si.on { background: var(--or); color: #fff; }
  .si .sn { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .si .sn small { display: block; font-size: 11px; font-weight: 400; color: var(--sub); }
  .si.on .sn small { color: rgba(255,255,255,.85); }
  .si i { font-style: normal; font-size: 11px; background: var(--red); color: #fff; border-radius: 8px; padding: 0 6px; flex: none; }
  .si.on i { background: #fff; color: var(--red); }
  .spu { min-width: 0; }
  .spu-h { display: flex; align-items: baseline; gap: 10px; padding: 4px 2px 8px; flex-wrap: wrap; }
  .spu-h b { font-size: 15px; padding-left: 8px; border-left: 4px solid var(--or); }
  .grid { display: flex; flex-direction: column; gap: 12px; }
  /* ASIN 大横卡 */
  .pc { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; transition: border-color .12s, box-shadow .12s; min-width: 0; }
  .pc:hover { border-color: var(--or-soft2); box-shadow: 0 2px 10px rgba(240,122,18,.12); }
  .pc.sel { border-color: var(--or); box-shadow: 0 0 0 3px rgba(240,122,18,.15); }
  .pc-top { display: grid; grid-template-columns: 96px minmax(220px, 1.1fr) minmax(0, 1.6fr) auto; gap: 16px; align-items: center; padding: 12px 14px; cursor: pointer; }
  .pc-id { min-width: 0; }
  .pc-id .nm { font-size: 15px; font-weight: 700; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .pc-id .ids { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-top: 5px; }
  .pc-id .asin { font-family: Consolas, monospace; font-size: 13px; font-weight: 700; color: var(--or-d); margin-right: 2px; }
  .pc-sub { margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-kv { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 10px; background: #fcf6ef; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .kv { min-width: 0; }
  .kv.w2 { grid-column: span 2; }
  .kv .k { font-size: 11px; color: var(--sub); }
  .kv .v { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kv.w2 .v { font-size: 12.5px; font-weight: 600; }
  .kv .v.nil { color: #c9bfb5; font-weight: 400; }
  .kv.miss .v.nil { color: var(--red); font-weight: 600; }
  .kv.miss .v.nil::after { content: ' 缺'; font-size: 11px; }
  .pc-act { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .lns { border-top: 1px solid var(--line); }
  .ln { display: grid; grid-template-columns: 44px minmax(150px, 1.3fr) minmax(110px, 1fr) minmax(150px, 1.2fr) 64px 70px 86px 110px minmax(120px, 1.2fr); gap: 10px;
        align-items: center; padding: 7px 14px; border-top: 1px solid var(--line); font-size: 12.5px; cursor: pointer; }
  .ln:first-child { border-top: 0; }
  .ln:hover { background: var(--or-soft); }
  .ln.sel { background: var(--or-soft); box-shadow: inset 3px 0 0 var(--or); }
  .ln.hd { background: #fcf6ef; color: var(--sub); font-size: 11.5px; padding-top: 5px; padding-bottom: 5px; cursor: default; }
  .ln.hd:hover { background: #fcf6ef; }
  .ln > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ln .c4 { line-height: 1.3; font-size: 11.5px; }
  .ln .c4 small { color: var(--sub); }
  .ln .c5, .ln .c5b, .ln .c6 { text-align: right; font-variant-numeric: tabular-nums; }
  .ln em.nil { color: #c9bfb5; }
  .ln em { font-style: normal; color: var(--red); font-size: 11.5px; }
  .ln .c6 b { color: var(--or-d); }
  .ln .c7 { display: flex; gap: 3px; align-items: center; }
  .ln .c7 i { width: 9px; height: 9px; border-radius: 50%; background: #e7ded5; display: inline-block; }
  .ln .c7 i.on { background: var(--green); }
  .ln .c7 i.on.a { background: var(--or); }
  .ln .c7 small { color: var(--sub); margin-left: 4px; font-size: 11px; }
  .ln .c8 { display: flex; gap: 4px; flex-wrap: wrap; white-space: normal; }

  /* 抽屉 */
  .mask { position: fixed; left: 0; right: 0; top: var(--vt, 0px); height: var(--vh, 100vh); background: rgba(43,33,24,.28); z-index: 40; display: none; }
  .mask.show { display: block; }
  .drawer { position: fixed; top: var(--vt, 0px); right: 0; height: var(--vh, 100vh); width: min(640px, 100vw); background: var(--bg); z-index: 41; box-shadow: -8px 0 24px rgba(43,33,24,.18);
            transform: translateX(105%); transition: transform .18s ease-out; display: flex; flex-direction: column; }
  .drawer.show { transform: none; }
  .dh { background: #fff; border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 12px; align-items: flex-start; }
  .dh .nm { font-size: 15px; font-weight: 700; line-height: 1.35; }
  .dh .x { margin-left: auto; border: 0; background: none; font-size: 20px; color: var(--sub); cursor: pointer; line-height: 1; padding: 2px 4px; }
  .dtabs { display: flex; gap: 6px; padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
  .dtabs button { height: 26px; padding: 0 12px; border-radius: 13px; border: 1px solid var(--line2); background: #fff; font-size: 12.5px; cursor: pointer; color: var(--ink); }
  .dtabs button.on { background: var(--or); border-color: var(--or); color: #fff; font-weight: 700; }
  .dtabs .sp { margin-left: auto; display: flex; gap: 6px; }
  .db { flex: 1; overflow-y: auto; padding: 12px 16px 16px; }
  .sec { background: #fff; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
  .sec-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .sec-h b { font-size: 13px; color: var(--or-d); }
  .sec-h b::before { content: ''; display: inline-block; width: 4px; height: 12px; border-radius: 2px; background: var(--or); margin-right: 6px; vertical-align: -1px; }
  .sec-h .meta { margin-left: auto; }
  .sec.lock .sec-h b { color: var(--sub); }
  .sec.lock .sec-h b::before { background: var(--grey); }
  .fg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; padding: 10px 12px 12px; }
  .fg .f { min-width: 0; }
  .fg .f.w { grid-column: 1 / -1; }
  .fg .k { font-size: 11.5px; color: var(--sub); display: flex; gap: 4px; align-items: baseline; }
  .fg .k .u { font-size: 10.5px; padding: 0 5px; border-radius: 6px; background: var(--grey-soft); }
  .fg .k .u.cny { background: #fdf0e6; color: #b8560a; }
  .fg .k .u.usd { background: var(--blue-soft); color: var(--blue); }
  .fg .v { font-size: 13px; word-break: break-word; white-space: pre-wrap; min-height: 20px; }
  .fg .v.nil { color: #c9bfb5; }
  .fg .v.mono { font-size: 12.5px; }
  .fg .v.miss { color: var(--red); }
  .calc { margin: 0 12px 12px; padding: 8px 10px; border-radius: 8px; background: var(--or-soft); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
  .calc b { font-size: 16px; color: var(--or-d); font-variant-numeric: tabular-nums; }
  .calc .meta { font-size: 11.5px; }
  .hint { margin: 0 12px 10px; font-size: 11.5px; color: var(--yel); background: var(--yel-soft); border-radius: 6px; padding: 5px 8px; }
  .hint.red { color: var(--red); background: var(--red-soft); }
  .syncop { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); margin: -4px 12px 10px; }
  .df { padding: 10px 16px; background: #fff; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  .df .meta { flex: 1; }
  .issues { display: flex; gap: 5px; flex-wrap: wrap; padding: 0 0 10px; }

  /* 编辑控件 */
  .in { width: 100%; font: inherit; font-size: 13px; border: 1px solid var(--line2); border-radius: 6px; padding: 3px 7px; background: #fff; color: var(--ink); height: 28px; }
  textarea.in { height: auto; min-height: 54px; resize: vertical; line-height: 1.5; }
  .in:focus { outline: none; border-color: var(--or); box-shadow: 0 0 0 2px rgba(240,122,18,.15); }
  .in.dirty { border-color: #f2b705; background: #fffbea; }
  .in.mono { font-family: Consolas, monospace; font-size: 12.5px; }
  .multi { display: flex; gap: 4px; flex-wrap: wrap; padding: 2px 0; border-radius: 6px; }
  .multi.dirty { background: #fffbea; box-shadow: 0 0 0 1px #f2b705; }
  .multi label { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line2); cursor: pointer; background: #fff; }
  .multi label.on { background: var(--or-soft); border-color: var(--or); color: var(--or-d); }
  .multi input { display: none; }

  /* ② 体检 */
  .chk { background: #fff; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .chk-h { display: flex; gap: 10px; align-items: center; padding: 10px 14px; cursor: pointer; user-select: none; }
  .chk-h:hover { background: #fcf6ef; }
  .chk-h .n { min-width: 36px; height: 24px; border-radius: 12px; text-align: center; font-weight: 700; line-height: 24px; font-variant-numeric: tabular-nums; background: var(--red-soft); color: var(--red); }
  .chk-h .n.z { background: var(--green-soft); color: var(--green); }
  .chk-h .n.w { background: var(--yel-soft); color: var(--yel); }
  .chk-h b { font-size: 13.5px; }
  .chk-h .meta { flex: 1; }
  .chk-h .ar { color: var(--or); }
  .chk.fold .chk-b { display: none; }
  .chk.fold .chk-h .ar { transform: rotate(-90deg); display: inline-block; }
  .itbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .itbl td, .itbl th { padding: 6px 10px; border-top: 1px solid var(--line); text-align: left; vertical-align: middle; }
  .itbl th { background: #fcf6ef; color: var(--sub); font-weight: 600; font-size: 12px; }
  .itbl tr.rw { cursor: pointer; }
  .itbl tr.rw:hover td { background: var(--or-soft); }
  .itbl .why { color: var(--red); }
  .vis { font-family: Consolas, monospace; font-size: 12px; background: var(--red-soft); border-radius: 4px; padding: 0 4px; }

  /* ③ 下游开关 */
  .sw-note { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .sw-note div { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 12px; color: var(--sub); }
  .sw-note b { color: var(--ink); }
  .swt { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border: 1px solid var(--line); border-radius: 10px; font-size: 12.5px; }
  .swt th { background: var(--or-soft); color: var(--or-d); font-weight: 600; padding: 8px 6px; text-align: center; position: sticky; top: 0; z-index: 5;
            border-bottom: 1px solid var(--or-soft2); font-size: 12px; line-height: 1.3; }
  .swt th.l { text-align: left; padding-left: 10px; }
  .swt th small { display: block; font-weight: 400; color: var(--sub); font-size: 10.5px; }
  .swt th.auto small { color: var(--or-d); }
  .swt td { padding: 5px 6px; border-top: 1px solid var(--line); text-align: center; vertical-align: middle; }
  .swt td.l { text-align: left; padding-left: 10px; }
  .swt tr.g td { background: #fcf6ef; font-weight: 700; text-align: left; padding: 7px 10px; }
  .swt tr.conf td.l { box-shadow: inset 3px 0 0 var(--red); }
  .swt .pn { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .swt .pn .t { min-width: 0; }
  .swt .pn .t div:first-child { font-weight: 600; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .swt .pn .t div:last-child { font-size: 11px; color: var(--sub); }
  .tg { width: 34px; height: 20px; border-radius: 10px; background: #e3dad1; position: relative; cursor: pointer; display: inline-block; border: 0; padding: 0; transition: background .12s; }

  $('drawer').querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => {
    if (editMode && $('drawer').querySelector('.dirty') && !confirm('切换国家会丢掉未保存的修改，继续？')) return;
    openRid = b.dataset.tab; unlocked = false; renderDrawer();
  });
  if ($('d-edit')) $('d-edit').onclick = () => { editMode = true; renderDrawer(); };
  if ($('d-cancel')) $('d-cancel').onclick = () => { if ($('drawer').querySelector('.dirty') && !confirm('放弃修改？')) return; editMode = false; unlocked = false; renderDrawer(); };
  if ($('d-save')) $('d-save').onclick = () => prepareSave();
  const ub = $('drawer').querySelector('[data-unlock]');
  if (ub) ub.onclick = () => {
    if (!unlocked && !confirm('身份键是下游所有表的匹配键，确定要解锁修改？')) return;
    unlocked = !unlocked; renderDrawer();
  };
  $('drawer').querySelectorAll('.in, .multi').forEach((el) => {
    const mark = () => {
      el.dataset.touched = '1';
      let d = true; try { const v = readEditor(el); d = v !== undefined && !sameV(v, r[el.dataset.f]); } catch (e) {}
      el.classList.toggle('dirty', d);
      if (el.classList.contains('multi')) el.querySelectorAll('label').forEach((l) => l.classList.toggle('on', l.querySelector('input').checked));
    };
    el.addEventListener('input', mark); el.addEventListener('change', mark);
  });
  loadImages([r]);
}
// 收集改动 → 清单弹窗 → 写回
function prepareSave() {
  const r = byId(openRid), msg = $('d-msg');
  const own = {}, sync = {};
  try {
    $('drawer').querySelectorAll('.in[data-touched], .multi[data-touched]').forEach((el) => {
      const f = el.dataset.f, v = readEditor(el);
      if (v === undefined || sameV(v, r[f])) return;
      own[f] = v;
      const secK = el.closest('[data-sec]').dataset.sec, cb = $('drawer').querySelector(`[data-sync="${secK}"]`);
      if (cb && cb.checked) sync[f] = v;
    });
  } catch (e) { msg.textContent = e.message; msg.style.color = 'var(--red)'; return; }
  if (!Object.keys(own).length) { editMode = false; renderDrawer(); toast('没有改动'); return; }
  const changes = [{ r, fs: own }];
  if (Object.keys(sync).length) for (const s of siblings(r)) {
    const fs = {}; for (const [f, v] of Object.entries(sync)) if (!sameV(v, s[f])) fs[f] = v;
    if (Object.keys(fs).length) changes.push({ r: s, fs });
  }
  const idChanged = Object.keys(own).some((f) => SECTIONS[0].fields.includes(f));
  const costChanged = Object.keys(own).some((f) => SECTIONS[2].fields.includes(f));
  confirmChanges(changes, [
    idChanged ? '<div class="warnbox red">改了身份键：追踪表、备货表、利润表等按旧值匹配的行会断开，需要去下游核对。</div>' : '',
    costChanged ? '<div class="warnbox">改了成本参数：每日数据、经营表、利润表、备货页的毛利会跟着变（下次重算生效）。</div>' : '',
  ].join(''), async () => { await writeChanges(changes); editMode = false; unlocked = false; renderDrawer(); renderMain(); });
}
function diffRows(changes) {
  return changes.map(({ r, fs }) => `<tr class="h"><td colspan="3">${ctryTag(r)} ${esc(r['领星SKU'] || '')} · ${esc(r['店铺'] || '')}</td></tr>` +
    Object.entries(fs).map(([f, v]) => `<tr><td>${esc(LABEL[f] || f)}</td><td class="o">${SECTIONS[0].fields.includes(f) && r[f] ? visible(r[f]) : esc(showV(f, r[f], r) ?? '（空）')}</td><td class="n">${esc(showV(f, v, r) ?? '（清空）')}</td></tr>`).join('')).join('');
}
function confirmChanges(changes, warn, onOk) {
  const n = changes.reduce((s, c) => s + Object.keys(c.fs).length, 0);
  $('mbox').innerHTML = `<div class="mh">确认改动：${changes.length} 行 · ${n} 个格子</div>
    <div class="mb">${warn}<table class="dif"><thead><tr><th style="width:30%">字段</th><th>旧值</th><th>新值</th></tr></thead><tbody>${diffRows(changes)}</tbody></table></div>
    <div class="mf"><span class="meta" id="m-msg">${SNAP ? '本地预览：只改页面，不写回多维表' : '写前会重读这几行，别人刚改过会停下'}</span><button class="btn" id="m-no">返回修改</button><button class="btn pri" id="m-ok">确认保存</button></div>`;
  $('modal').classList.add('show');
  $('m-no').onclick = () => $('modal').classList.remove('show');
  $('m-ok').onclick = async () => {
    $('m-ok').disabled = true; $('m-msg').textContent = '保存中…'; $('m-msg').style.color = '';
    try { await onOk(); $('modal').classList.remove('show'); }
    catch (e) { $('m-ok').disabled = false; $('m-msg').style.color = 'var(--red)'; $('m-msg').innerHTML = esc(e && e.message ? e.message : e); }
  };
}
async function writeChanges(changes) {
  if (!SNAP) {
    // 冲突检查：重读每行，被改动的字段如果和打开时不一样就停
    const conflicts = [];
    for (const { r, fs } of changes) {
      const rec = await TBL.getRecordById(r._id);
      const fresh = rowFromSdk(r._id, rec.fields || {});
      for (const f of Object.keys(fs)) if (!sameV(fresh[f], r[f])) conflicts.push(`${r['领星SKU']} ${ctryShort(r)}「${LABEL[f] || f}」已被改成「${showV(f, fresh[f], fresh) ?? '空'}」`);
      r._fresh = fresh;
    }
    if (conflicts.length) {
      for (const { r } of changes) { Object.assign(r, r._fresh); delete r._fresh; }
      throw new Error('别人刚改过，已停下没写：\n' + conflicts.join('\n') + '\n页面已刷新成最新值，请重新编辑。');
    }
    for (const { r, fs } of changes) {
      const fields = {};
      for (const [f, v] of Object.entries(fs)) { if (!META[f]) throw new Error(`产品主表缺字段「${f}」`); fields[META[f].id] = toSdk(f, v); }
      await TBL.setRecord(r._id, { fields });
      delete r._fresh;
    }
  }
  for (const { r, fs } of changes) Object.assign(r, fs);
  toast(SNAP ? `本地预览：已改 ${changes.length} 行（未写回）` : `已写回产品主表 ${changes.length} 行`);
}

// ===== ⑦ 视图② 数据体检 =====
function renderChk(rows) {
  const res = runChecks(rows);
  return `<div class="meta" style="margin-bottom:10px">按当前筛选检查 ${rows.length} 行。点一行打开详情去改；脏字符可以直接一键清理。</div>` + CHECKS.map(([k, t, d, lv]) => {
    const list = res[k];
    const n = list.length;
    return `<div class="chk${foldChk.has(k) ? ' fold' : ''}" data-chk="${k}">
      <div class="chk-h"><span class="n ${n ? (lv === 'warn' ? 'w' : '') : 'z'}">${n}</span><b>${esc(t)}</b><span class="meta">${esc(d)}</span>
        ${k === 'dirty' && n ? `<button class="btn sm" data-cleanall>一键清理 ${n} 行</button>` : ''}<span class="ar">▾</span></div>
      <div class="chk-b">${n ? `<table class="itbl"><thead><tr><th style="width:48px"></th><th>产品</th><th style="width:70px">国家</th><th>店铺</th><th>原因</th></tr></thead><tbody>${
        list.map(({ r, why }) => `<tr class="rw" data-open="${r._id}"><td>${imgBox(r, 's')}</td><td><b>${esc(r['品名'] || '（无品名）')}</b><div class="meta mono">${esc(r['领星SKU'] || '')}</div></td><td>${ctryTag(r)}</td><td>${esc(r['店铺'] || '—')}</td><td class="why">${k === 'dirty' ? why : esc(why)}</td></tr>`).join('')
      }</tbody></table>` : '<div class="meta" style="padding:8px 14px 12px">✔ 没有问题</div>'}</div></div>`;
  }).join('');
}
function cleanDirty(rows) {
  const changes = rows.map((r) => {
    const fs = {}; for (const f of SECTIONS[0].fields) if (r[f] && DIRTY_RE.test(r[f])) fs[f] = clean(r[f]);
    return Object.keys(fs).length ? { r, fs } : null;
  }).filter(Boolean);
  confirmChanges(changes, '<div class="warnbox">只去掉首尾空格、换行和零宽字符，内容本身不变。清理后下游按这个值匹配会恢复正常。</div>', async () => { await writeChanges(changes); renderMain(); });
}

// ===== ⑧ 视图③ 下游开关 =====
const pend = new Map();   // rid → {字段: 新值}
function renderSw(rows) {
  const groups = groupSpu(rows);
  const head = `<tr><th class="l">产品（SKU × 国家）</th>${SWITCHES.map(([f, t, how, auto]) => `<th class="${auto ? 'auto' : ''}">${esc(t)}<small>${how}</small></th>`).join('')}</tr>`;
  const conf = runChecks(rows).conf, confIds = new Map(conf.map((x) => [x.r._id, x.why]));
  const body = groups.map(([spu, m]) => `<tr class="g"><td colspan="${SWITCHES.length + 1}">${esc(spu)} <span class="meta">${[...m.values()].flat().length} 行</span></td></tr>` +
    [...m.values()].flat().map((r) => `<tr class="${confIds.has(r._id) ? 'conf' : ''}"><td class="l"><div class="pn">${imgBox(r, 's')}<div class="t"><div title="${esc(r['品名'])}">${esc(r['品名'] || '（无品名）')}</div><div>${ctryShort(r)} · ${esc(r['领星SKU'] || '')} · ${esc(r['销售季分类'] || '无分类')}${confIds.has(r._id) ? ` · <span style="color:var(--red)">${esc(confIds.get(r._id))}</span>` : ''}</div></div></div></td>${
      SWITCHES.map(([f]) => { const p = pend.get(r._id) || {}; const on = f in p ? p[f] : !!r[f]; return `<td><button class="tg${on ? ' on' : ''}${f in p ? ' pend' : ''}" data-rid="${r._id}" data-sw="${esc(f)}" title="${esc(f)}"></button></td>`; }).join('')}</tr>`).join('')).join('');
  return `<div class="sw-note">
      <div><b>自动建行（橙色表头）</b>：勾上后自动化去下游查重，没有这一行就新建；<b>取消勾选不删行</b>，有「启用XX」的表会把行隐藏。</div>
      <div><b>脚本读取</b>：每日数据表 / 产品表现 / 四季品经营表 的行由拉数脚本生成，勾选只决定拉不拉这个产品，当晚生效。</div>
      <div><b>拨开关不会立刻写</b>：改动先标黄，底部点「保存」看清单确认后统一写回。左侧红条 = 勾选和销售季分类冲突。</div></div>
    ${groups.length ? `<table class="swt"><thead>${head}</thead><tbody>${body}</tbody></table>` : '<div class="empty">没有符合筛选的产品</div>'}`;
}
function renderSwBar() {
  const n = [...pend.values()].reduce((s, p) => s + Object.keys(p).length, 0);
  $('swbar').classList.toggle('show', state.mode === 'sw' && n > 0);
  $('swbar').innerHTML = `<span>${n} 处开关改动未保存</span><button class="btn sm" id="sw-undo">撤销</button><button class="btn pri sm" id="sw-save">保存</button>`;
  if (!n) return;
  $('sw-undo').onclick = () => { pend.clear(); renderMain(); };
  $('sw-save').onclick = () => {
    const changes = [...pend.entries()].map(([rid, fs]) => ({ r: byId(rid), fs }));
    const ons = changes.flatMap((c) => Object.entries(c.fs).filter(([f, v]) => v && SWITCHES.find((s) => s[0] === f)[3]).map(([f]) => f));
    confirmChanges(changes, ons.length ? `<div class="warnbox">有 ${ons.length} 个「自动建行」开关被勾上：保存后自动化会去下游建行（已有的跳过）。取消勾选的只隐藏不删行。</div>` : '',
      async () => { await writeChanges(changes); pend.clear(); renderMain(); });
  };
}

// ===== ⑨ 渲染 =====
function setStickyH() { document.documentElement.style.setProperty('--stickyH', $('sticky').offsetHeight + 'px'); }
function render() {
  store.set('pmp.mode', state.mode);
  const nIss = ROWS.filter(pass).filter((r) => issuesOf(r).some((i) => i.lv === 'bad')).length;
  document.querySelectorAll('#mode button').forEach((b) => {
    b.classList.toggle('on', b.dataset.m === state.mode);
    if (b.dataset.m === 'chk') b.innerHTML = '数据体检' + (nIss ? `<i>${nIss}</i>` : '');
  });
  renderFilters();
  renderMain();
}
function renderMain() {
  const rows = ROWS.filter(pass);
  $('main').innerHTML = state.mode === 'lib' ? renderLib(rows) : state.mode === 'chk' ? renderChk(rows) : renderSw(rows);
  bindMain();
  renderSwBar();
  setStickyH();
  observeImages();
}
function bindMain() {
  const m = $('main');
  m.querySelectorAll('[data-open]').forEach((e) => e.onclick = (ev) => { ev.stopPropagation(); openDrawer(e.dataset.open, !!e.dataset.edit); });
  m.querySelectorAll('.kseg button').forEach((e) => e.onclick = () => { state.kind = e.dataset.kind; store.set('pmp.kind', state.kind); renderMain(); });
  m.querySelectorAll('.si').forEach((e) => e.onclick = () => {
    state.spu = e.dataset.spu; store.set('pmp.spu', state.spu);
    const st = $('side').scrollTop; renderMain(); $('side').scrollTop = st;
    const top = m.querySelector('.lib').offsetTop - 8;
    if (m.scrollTop > top) m.scrollTop = top;
  });
  m.querySelectorAll('.chk-h').forEach((e) => e.onclick = (ev) => { if (ev.target.closest('[data-cleanall]')) return; const k = e.parentElement.dataset.chk; foldChk.has(k) ? foldChk.delete(k) : foldChk.add(k); e.parentElement.classList.toggle('fold'); });
  const ca = m.querySelector('[data-cleanall]');
  if (ca) ca.onclick = () => cleanDirty(runChecks(ROWS.filter(pass)).dirty.map((x) => x.r));
  m.querySelectorAll('.tg').forEach((b) => b.onclick = () => {
    const r = byId(b.dataset.rid), f = b.dataset.sw, p = pend.get(r._id) || {};
    const now = f in p ? p[f] : !!r[f];
    if (!now === !!r[f]) delete p[f]; else p[f] = !now;
    Object.keys(p).length ? pend.set(r._id, p) : pend.delete(r._id);
    b.classList.toggle('on', !now); b.classList.toggle('pend', f in p);
    renderSwBar();
  });
}

// 图片：快照自带缩略图；插件里按需取附件临时地址（进入视口才取）
const imgUrl = {};
let io = null;
function paint(box, url) { box.innerHTML = `<img src="${esc(url)}" alt="" loading="lazy">`; }
async function fetchImg(rid) {
  const r = byId(rid);
  if (!r || !(r['图片'] || []).length) return null;
  if (imgUrl[rid]) return imgUrl[rid];
  if (r._imgData) return (imgUrl[rid] = r._imgData);
  if (!TBL || !META['图片']) return null;
  try { const u = await TBL.getCellAttachmentUrls([r['图片'][0].token], META['图片'].id, rid); return (imgUrl[rid] = u && u[0]); }
  catch (e) { return null; }
}
function observeImages() {
  if (io) io.disconnect();
  io = new IntersectionObserver((ents) => ents.forEach(async (en) => {
    if (!en.isIntersecting) return;
    io.unobserve(en.target);
    const u = await fetchImg(en.target.dataset.img);
    if (u) paint(en.target, u); else if (en.target.textContent === '…') en.target.textContent = '图未取到';
  }), { rootMargin: '300px' });
  document.querySelectorAll('#main [data-img]').forEach((b) => io.observe(b));
}
async function loadImages(list) {
  for (const r of list) { const u = await fetchImg(r._id); if (u) document.querySelectorAll(`#drawer [data-img="${r._id}"]`).forEach((b) => paint(b, u)); }
}

// ===== ⑩ 保存插件配置（硬规矩①②）=====
function setupSave() {
  const dash = SDK && SDK.dashboard;
  let st = '';
  try { st = dash && dash.state; } catch (e) { st = '读取失败'; }
  $('saveMsg').textContent = `（插件状态：${st || '未知'}）`;
  if (dash && typeof dash.saveConfig === 'function' && st !== 'View' && st !== 'FullScreen') {
    $('savebar').classList.add('show');
    $('saveBtn').onclick = async () => {
      $('saveBtn').disabled = true; $('saveMsg').textContent = '保存中…';
      try {
        const ok = await dash.saveConfig({
          dataConditions: Object.values(TABLES).map((t) => ({ tableId: t.id, baseToken: BASE_TOKEN, dataRange: { type: 'ALL' }, series: 'COUNTA' })),
          customConfig: { page: document.title, version: 1 },
        });
        $('saveMsg').textContent = ok === false ? '保存失败，请重试' : '已保存 ✔';
      } catch (e) { $('saveMsg').textContent = '保存失败：' + (e && e.message ? e.message : e); }
      finally { $('saveBtn').disabled = false; }
    };
  } else if (dash && dash.setRendered) {
    dash.setRendered().catch(() => {});
  }
}
async function diagnose() {
  const res = [];
  const t = async (name, fn) => {
    try {
      const v = await Promise.race([fn(), new Promise((_, rej) => setTimeout(() => rej(new Error('超时 8s')), 8000))]);
      let shown; try { shown = typeof v === 'string' ? v : JSON.stringify(v); } catch (x) { shown = String(v); }
      res.push(['✔', name, String(shown).slice(0, 300)]); return v;
    } catch (e) { res.push(['✘', name, e && e.message ? e.message : String(e)]); return undefined; }
  };
  const { bitable, dashboard } = SDK;
  await t('dashboard.state', async () => dashboard.state);
  await t('dashboard.getConfig', () => dashboard.getConfig());
  const tb = await t(`getTableById ${TABLES.pm.name}`, () => bitable.base.getTableById(TABLES.pm.id));
  if (tb) await t(`getRecordsByPage ${TABLES.pm.name}`, () => tb.getRecordsByPage({ pageSize: 2 }));
  return `<div class="card0"><b>接口诊断</b> <span class="meta">请把这块整体截图发回</span><table class="tbl"><tbody>${res.map((r) =>
    `<tr><td style="width:24px">${r[0]}</td><td>${esc(r[1])}</td><td style="color:var(--sub)">${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>`;
}

// ===== ⑪ 布局：顶栏固定、#main 内部滚动（页面硬规矩，照 Listing审核页 10-14）=====
// 飞书若把插件框拉得比屏幕还高，滚的是外层页面、顶栏会被滚走 → 顶部提示用户把组件高度拖到一屏内。
// （10-14 试过 IntersectionObserver 算可见段再平移顶栏：总慢一拍、一直跳动，已弃用）
function layoutCheck() {
  setStickyH();
  const tall = innerHeight > (screen.availHeight || screen.height || 1080) + 40;
  $('tallTip').style.display = tall ? '' : 'none';
}
window.addEventListener('resize', layoutCheck);
new ResizeObserver(setStickyH).observe($('sticky'));
$('main').addEventListener('scroll', () => $('sticky').classList.toggle('stuck', $('main').scrollTop > 0), { passive: true });
document.querySelectorAll('#mode button').forEach((b) => b.onclick = () => { state.mode = b.dataset.m; render(); });
$('mask').onclick = () => closeDrawer();
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('modal').classList.contains('show')) $('modal').classList.remove('show'); else if (openRid) closeDrawer(); } });
window.addEventListener('beforeunload', (e) => { if (pend.size || (editMode && $('drawer').querySelector('.dirty'))) { e.preventDefault(); e.returnValue = ''; } });

// ===== 启动 =====
function finish(rows, src) {
  ROWS = rows;
  layoutCheck();
  const u = new Map();
  for (const r of ROWS) for (const x of r[OWNER] || []) u.set(x.id, x);
  USERS = [...u.values()].sort((a, b) => a.name.localeCompare(b.name, 'zh'));
  $('meta').textContent = `${ROWS.length} 行 · ${src}`;
  render();
  if (!ROWS.length || DIAG.missing.length) $('main').insertAdjacentHTML('afterbegin', `<div class="card0"><b>${ROWS.length ? '有字段没读到' : '没有读到数据'}</b> <span class="meta">读取 ${DIAG.read} 行；缺失字段 ${esc(DIAG.missing.join('、') || '无')}</span></div>`);
}
try {
  if (window.__SNAPSHOT__) {
    SNAP = true;
    META = window.__SNAPSHOT__.meta;
    DIAG.missing = ALL_FIELDS.filter((w) => !META[w]); DIAG.read = window.__SNAPSHOT__.rows.length;
    finish(window.__SNAPSHOT__.rows, `本地快照 ${window.__SNAPSHOT__.at}（预览，编辑不写回）`);
  } else {
    SDK = await loadSdk();
    setupSave();
    finish(await readTable(), '取数：产品主表-灯类+精铺');
  }
} catch (e) {
  const msg = esc(e && e.message ? e.message : e);
  $('meta').textContent = '';
  $('main').innerHTML = `<div class="card0 err">加载失败：${msg}</div>` + (SDK ? '<div class="card0">正在诊断…</div>' :
    `<div class="card0"><b>没拿到飞书 SDK，所以也没有「保存到页面」按钮。</b><div class="meta" style="margin-top:6px">
      请把这块截图发回。可以先试：插件 ⋮ → 刷新；或把网址末尾的 ?v=数字 加 1 再保存。</div></div>`);
  if (SDK) { try { $('main').innerHTML = `<div class="card0 err">加载失败：${msg}</div>` + await diagnose(); } catch (e2) { /* 保留报错 */ } }
}
</script>
