<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四季品经营复盘</title>
<!--
  飞书应用「灯具组-全流程」自定义插件页：四季品经营复盘（2026-10-13，结构沿用 seasonal-track-page）
  读三张表：
    · 四季品经营表 tblbSnNiUOOLlZwu：一行 = (SPU 或 ASIN) × 国家 × 周；SPU 行 = 一张卡片，ASIN 行进卡片的「ASIN 明细」
        8 个手填字段可在卡片上改，保存写回「所选那一周」的行（用户 10-13 定：复盘写在被复盘的那一周）
        建议操作 = 主管填（用户 10-13 定）
    · 每日数据表-灯 tblKAoK9pN3cWI9t：产品表现页近 30 天趋势。一行 = 日期×店铺×ASIN
        聚合口径（同 X24 周报）：ASIN×国家×日 Sessions 取 MAX、其余求和；库存各店铺相加；广告订单 = ROUND(广告CVR×点击)
    · 产品主表-灯类+精铺 tblqksywqgYvywOT：图片（按 主图ASIN + 国家文本）
  默认周 = 最近一个「完整」周。四条硬规矩见 wiki/页面设计/概念/飞书应用自定义插件页.md。
-->
<style>
  :root {
    --bg: #faf6f1; --card: #ffffff; --ink: #2b2118; --sub: #7a6d61; --line: #f0e4d7; --line2: #e8d9c8;
    --or: #f07a12; --or-d: #c95f05; --or-soft: #fff1e2; --or-soft2: #ffe3c4; --blue: #2f6fd0;
    --red: #d9363e; --red-soft: #fdebec; --yellow: #b7860b; --yellow-soft: #fff7d9;
    --green: #2a9d4b; --green-soft: #e6f6eb; --grey: #9a9089; --grey-soft: #f3efea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { padding: 14px 16px 28px; max-width: 1600px; margin: 0 auto; }
  .meta { color: var(--sub); font-size: 12px; }
  .err { color: var(--red); white-space: pre-wrap; }
  .loading, .empty { padding: 48px 16px; text-align: center; color: var(--sub); background: #fff; border-radius: 12px; border: 1px dashed var(--line2); }
  .card0 { background: var(--card); border-radius: 12px; padding: 14px 16px; border: 1px solid var(--line); margin-bottom: 12px; }
  table { border-collapse: collapse; width: 100%; }
  .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); }

  /* 顶栏 */
  .hero { background: linear-gradient(120deg, #f07a12 0%, #f59a3c 60%, #f8b35f 100%); color: #fff; border-radius: 12px;
          padding: 14px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; box-shadow: 0 4px 14px rgba(240,122,18,.18); }
  .hero h2 { margin: 0; font-size: 18px; letter-spacing: .5px; }
  .hero .desc { margin: 4px 0 0; font-size: 12.5px; line-height: 1.6; color: rgba(255,255,255,.95); max-width: 1150px; }
  .hero.hero-top { border-radius: 12px 12px 0 0; box-shadow: none; }
  .sticky { position: sticky; top: 0; z-index: 20; background: var(--bg); margin: 0 -16px; padding: 0 16px 2px; }
  .hero.hero-f { padding: 10px 18px; border-radius: 0 0 12px 12px; border-top: 1px solid rgba(255,255,255,.3); margin-bottom: 12px; }
  .sticky.stuck { box-shadow: 0 6px 12px -8px rgba(80,50,20,.35); }
  .sticky.stuck .hero.hero-f { border-radius: 0 0 10px 10px; border-top: 0; }
  .seg { display: inline-flex; background: rgba(255,255,255,.22); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { height: 28px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: #fff; font-size: 13.5px; cursor: pointer; }
  .seg button.on { background: #fff; color: var(--or-d); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .hero select { height: 32px; padding: 0 10px; border: 0; border-radius: 8px; font-size: 13.5px; color: var(--ink); background: #fff; }
  .hero select { cursor: pointer; }
  .hero select.pick { min-width: 220px; max-width: 320px; }
  .hero .meta { color: rgba(255,255,255,.92); margin-left: auto; }

  /* 筛选片 */
  .bar1 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .lchip { display: flex; align-items: center; gap: 8px; min-width: 92px; padding: 6px 12px; background: #fff; border: 1.5px solid var(--line);
           border-radius: 10px; cursor: pointer; font-size: 13px; color: var(--ink); }
  .lchip:hover { border-color: var(--or-soft2); }
  .lchip b { font-size: 16px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .lchip .dot { width: 11px; height: 11px; border-radius: 50%; }
  .lchip.on { border-color: var(--or); background: var(--or-soft); box-shadow: 0 0 0 3px rgba(240,122,18,.12); }
  .lchip.zero { opacity: .45; }
  .lchip.todo { border-style: dashed; border-color: var(--or); color: var(--or-d); }
  .lchip.todo.on { border-style: solid; }
  .vsep { width: 1px; align-self: stretch; background: var(--line2); margin: 0 4px; }

  /* 汇总 */
  .sumt { width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .sumt th { color: var(--sub); font-weight: normal; text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .sumt td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .sumt th:first-child, .sumt td:first-child { text-align: left; }
  .sumt td b { font-size: 15px; }
  .sumbox { display: flex; gap: 12px; flex-wrap: wrap; align-items: stretch; }
  .sumbox .card0 { margin-bottom: 0; }

  /* 分组 */
  .grp { margin: 18px 0 8px; display: flex; align-items: center; gap: 10px; }
  .grp b { font-size: 15px; padding-left: 8px; border-left: 4px solid var(--or); }
  .lbar { width: 160px; height: 8px; border-radius: 4px; overflow: hidden; display: flex; gap: 2px; }
  .lbar i { display: block; height: 100%; }

  /* 卡片 */
  .grid { display: flex; flex-direction: column; gap: 14px; }
  .pc { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 16px 22px; display: flex; flex-direction: column; gap: 12px;
        position: relative; overflow: hidden; box-shadow: 0 1px 3px rgba(80,50,20,.05); min-width: 0; }
  .pc::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--grey); }
  .pc.red::before { background: var(--red); } .pc.yellow::before { background: #f2b705; } .pc.green::before { background: var(--green); }
  .pc.flash { box-shadow: 0 0 0 3px rgba(240,122,18,.45); }
  .pc-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .pc-head .reason { flex: 1 1 260px; min-width: 0; }
  .pc-act { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .pc-act [data-msg] { font-size: 11.5px; color: var(--sub); white-space: nowrap; }
  .pc-body { display: grid; grid-template-columns: minmax(300px, .95fr) minmax(300px, 1.05fr) minmax(340px, 1.35fr); gap: 18px; align-items: start; }
  .pc-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .pc-col.fill { border-left: 1px dashed var(--line2); padding-left: 18px; }
  .col-t { font-size: 12px; color: var(--sub); margin-bottom: -4px; }
  @media (max-width: 1240px) { .pc-body { grid-template-columns: 1fr 1fr; } .pc-col.fill { grid-column: 1 / -1; border-left: 0; padding-left: 0; border-top: 1px dashed var(--line2); padding-top: 10px; } }
  @media (max-width: 700px) { .pc-body { grid-template-columns: 1fr; } }
  .pc-img { width: 76px; height: 76px; border-radius: 10px; background: var(--grey-soft); flex: none; overflow: hidden;
            display: flex; align-items: center; justify-content: center; color: var(--grey); font-size: 11px; border: 1px solid var(--line); }
  .pc-img img { width: 100%; height: 100%; object-fit: cover; }
  .pc-title { flex: 0 1 auto; min-width: 160px; max-width: 360px; }
  .pc-title b { font-size: 17px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .tag { font-size: 11px; padding: 0 7px; border-radius: 4px; background: var(--or-soft); color: var(--or-d); line-height: 19px; white-space: nowrap; }
  .tag.g { background: var(--grey-soft); color: var(--sub); }
  .tag.ok { background: var(--green-soft); color: var(--green); }
  .tag.part { background: var(--yellow-soft); color: var(--yellow); }
  .light { flex: none; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; background: var(--grey-soft); color: var(--sub); white-space: nowrap; }
  .light.red { background: var(--red-soft); color: var(--red); } .light.yellow { background: var(--yellow-soft); color: var(--yellow); } .light.green { background: var(--green-soft); color: var(--green); }
  .reason { border-radius: 8px; padding: 7px 10px; font-size: 12.5px; line-height: 1.55; background: var(--grey-soft); color: var(--sub); }
  .reason.red { background: var(--red-soft); color: #a8262d; } .reason.yellow { background: var(--yellow-soft); color: #7d5a00; } .reason.green { background: var(--green-soft); color: #1d6e35; }
  .tgt { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--sub); }
  .tgt b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .pbar { flex: 1; height: 6px; border-radius: 3px; background: #efe6dc; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: var(--or); border-radius: 3px; }

  .mt { width: 100%; table-layout: fixed; font-size: 12.5px; font-variant-numeric: tabular-nums; background: #fcfaf7; border: 1px solid var(--line); border-radius: 10px; border-collapse: separate; border-spacing: 0; overflow: hidden; }
  .mt th, .mt td { padding: 4px 6px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mt th { color: var(--sub); font-weight: normal; font-size: 11.5px; border-bottom: 1px solid var(--line); }
  .mt th:first-child, .mt td:first-child { text-align: left; width: 26%; color: var(--sub); }
  .mt td:nth-child(2) { font-weight: 700; }
  .mt td:nth-child(3) { color: var(--sub); }
  .up { color: var(--green); } .down { color: var(--red); } .flat { color: var(--sub); }

  .inv4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .inv4 > div { border: 1px solid var(--line); border-radius: 8px; background: #fcfaf7; padding: 5px 8px; min-width: 0; }
  .inv4 span, .inv4 i { display: block; font-size: 11px; color: var(--sub); font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .inv4 b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .inv4 .warn { background: var(--yellow-soft); border-color: #f3dc8a; } .inv4 .warn b { color: var(--yellow); }
  .inv4 .bad { background: var(--red-soft); border-color: #f4c0c3; } .inv4 .bad b { color: var(--red); }
  .w8 { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 6px; background: #fcfaf7; }
  .w8-t { font-size: 11.5px; color: var(--sub); display: flex; justify-content: space-between; }
  .w8-bars { position: relative; display: flex; align-items: flex-end; gap: 6px; height: 96px; padding-top: 14px; }
  .w8-b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .w8-b .n { font-size: 10.5px; font-variant-numeric: tabular-nums; color: var(--sub); }
  .w8-b i { display: block; width: 100%; max-width: 34px; border-radius: 4px 4px 0 0; min-height: 2px; background: #f6c597; }
  .w8-b.cur i { background: var(--or); } .w8-b.cur .n { color: var(--or-d); font-weight: 700; }
  .w8-b.run i { background: repeating-linear-gradient(45deg, #f6c597 0 4px, #fbe3cc 4px 8px); }
  .w8-x { display: flex; gap: 5px; margin-top: 3px; }
  .w8-x span { flex: 1; text-align: center; font-size: 10px; color: var(--sub); }

  .sec { padding-top: 2px; }
  .sec + .sec { border-top: 1px dashed var(--line2); padding-top: 8px; }
  .sec-t { font-size: 12.5px; font-weight: 700; color: var(--or-d); margin-bottom: 4px; display: flex; gap: 8px; align-items: baseline; }
  .sec-t .meta { font-weight: normal; }
  .sec.boss { background: #f6f3ff; border: 1px solid #e3dcfa; border-radius: 8px; padding: 6px 8px 4px; }
  .sec.boss .sec-t { color: #5b3fc4; }
  details.sec > summary { list-style: none; cursor: pointer; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary .sec-t::before { content: '▸'; color: var(--or); }
  details.sec[open] > summary .sec-t::before { content: '▾'; }
  .fld { display: flex; gap: 8px; align-items: flex-start; margin-top: 2px; }
  .fld label { flex: none; width: 64px; font-size: 12px; color: var(--sub); padding-top: 5px; }
  .fld textarea, .fld input { flex: 1; min-width: 0; min-height: 28px; resize: none; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px;
                  font: 12.5px/1.45 inherit; font-family: inherit; color: var(--ink); background: #fffdfa; }
  .fld input { max-width: 110px; height: 28px; font-variant-numeric: tabular-nums; }
  .fld textarea:focus, .fld input:focus { outline: none; border-color: var(--or); background: #fff; box-shadow: 0 0 0 2px rgba(240,122,18,.12); }
  .fld .dirty { border-color: #f2b705 !important; background: #fffbea !important; }
  .fld textarea::placeholder, .fld input::placeholder { color: #cdc3b8; }
  .fld .hint { font-size: 11.5px; color: var(--sub); padding-top: 5px; }

  .btn { height: 28px; padding: 0 12px; border: 1px solid var(--or); border-radius: 7px; background: #fff; color: var(--or-d); cursor: pointer; font-size: 12.5px; white-space: nowrap; }
  .btn.primary { background: var(--or); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { border-color: var(--line2); color: var(--sub); }
  .foot { display: flex; align-items: center; gap: 6px; margin-top: auto; padding-top: 4px; }
  .foot [data-msg] { font-size: 11.5px; color: var(--sub); margin-left: auto; text-align: right; }

  .at { width: 100%; table-layout: fixed; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .at th, .at td { padding: 3px 2px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .at th { color: var(--sub); font-weight: normal; }
  .at th:first-child, .at td:first-child { text-align: left; width: 29%; }
  .at th:last-child, .at td:last-child { width: 9%; text-align: center; }
  .at td:first-child a { color: var(--or-d); cursor: pointer; text-decoration: none; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
  .at td:first-child a:hover { text-decoration: underline; }
  .at tr.hl td { background: var(--or-soft); }

  /* 填写进度 */
  .pt { width: 100%; font-size: 12.5px; }
  .pt th { color: var(--sub); font-weight: normal; padding: 6px 6px; border-bottom: 1px solid var(--line2); text-align: center; white-space: nowrap; }
  .pt td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
  .pt th:nth-child(-n+3), .pt td:nth-child(-n+3) { text-align: left; }
  .pt tr.go { cursor: pointer; } .pt tr.go:hover td { background: var(--or-soft); }
  .pt .y { color: var(--green); font-weight: 700; } .pt .n { color: #d5cbc0; }
  .pt th.boss { color: #5b3fc4; }
  .pt tr.own td { background: #fcfaf7; font-weight: 700; color: var(--or-d); cursor: default; }

  /* 产品表现 */
  .pick { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .pick select { height: 36px; min-width: 320px; padding: 0 10px; border: 1.5px solid var(--or); border-radius: 8px; font-size: 14px; background: #fff; color: var(--ink); cursor: pointer; }
  .mod-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .mod-h b { font-size: 15px; padding-left: 8px; border-left: 4px solid var(--or); }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .mchip { text-align: left; background: #fcfaf7; border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 10px; cursor: pointer; font: inherit; color: var(--ink); min-width: 0; overflow: hidden; position: relative; }
  .mchip .k, .mchip .v, .mchip .c { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mchip .no { position: absolute; top: 6px; right: 7px; width: 16px; height: 16px; border-radius: 50%; background: var(--or); color: #fff; font-size: 10.5px; line-height: 16px; text-align: center; font-weight: 700; }
  .rseg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; margin-left: auto; }
  .rseg button { height: 26px; padding: 0 12px; border: 0; background: #fff; color: var(--sub); font-size: 12.5px; cursor: pointer; }
  .rseg button + button { border-left: 1px solid var(--line2); }
  .rseg button.on { background: var(--or); color: #fff; font-weight: 700; }
  .panel + .panel { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line2); }
  .panel-h { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; font-size: 12px; color: var(--sub); margin-bottom: 2px; }
  .panel-h b { font-size: 13px; color: var(--ink); }
  .panel-h i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; margin-right: 5px; vertical-align: 3px; }
  .mchip:hover { border-color: var(--or-soft2); }
  .mchip.on { border-color: var(--or); background: var(--or-soft); box-shadow: 0 0 0 3px rgba(240,122,18,.12); }
  .mchip .k { font-size: 11.5px; color: var(--sub); }
  .mchip .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mchip .c { font-size: 11px; white-space: nowrap; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; }
  .chart .tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--line2); border-radius: 8px; padding: 6px 9px; font-size: 12px;
                box-shadow: 0 4px 12px rgba(80,50,20,.12); white-space: nowrap; display: none; font-variant-numeric: tabular-nums; z-index: 5; }
  .chart .tip b { display: block; color: var(--sub); font-weight: normal; font-size: 11.5px; }
  .chart .tip .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--sub); margin-bottom: 6px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: 3px; }
  .note { font-size: 11.5px; color: var(--sub); margin-top: 6px; }

  .savebar { display: none; align-items: center; gap: 12px; background: #fff7e8; border: 1px solid #ffd591; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
  .savebar.show { display: flex; }
  .savebar button { height: 32px; padding: 0 16px; border: 0; border-radius: 6px; background: var(--or); color: #fff; font-size: 14px; cursor: pointer; }
  @media (max-width: 520px) { .pick select, .hero select.pick { min-width: 0; width: 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="savebar" id="savebar">
    <span>这是插件的配置预览。确认没问题后点右边按钮，插件才会保存到应用页面上。</span>
    <button id="saveBtn">保存到页面</button>
    <span class="meta" id="saveMsg"></span>
  </div>
  <div class="hero hero-top">
    <div>
      <h2>四季品经营复盘</h2>
      <p class="desc">每张卡 = 一个 SPU × 国家在所选那一周的经营数据，红灯排前。数字和红黄绿灯由系统每天按「四季品经营表」算好；
        卡片下半部分直接填：目标与策略（新周自动沿用上周，有变化再改）、本周复盘（竞品动态 / 问题和归因 / 计划操作）、主管建议，点「保存」写回多维表的这一周。
        「产品表现」看单个 SPU 或 ASIN 的每日趋势（产品、广告可切近 7/14/30 天并对比上一周期，库存看未来 120 天预测）。</p>
    </div>
  </div>
  <div class="sticky" id="sticky">
    <div class="hero hero-f">
      <div class="seg" id="mode"><button data-mode="review">经营复盘</button><button data-mode="progress">填写进度</button><button data-mode="perf">📈 产品表现</button></div>
      <select id="owner"></select>
      <select id="week"></select>
      <select id="country"></select>
      <select id="pick" class="pick"></select>
      <span class="meta" id="meta">数据加载中…</span>

    ${chip('fill', 'todo', '复盘未填', fc.todo, '', 'todo')}${chip('fill', 'part', '部分填写', fc.part)}${chip('fill', 'done', '已填', fc.done)}
  </div>`;
  $('filters').querySelectorAll('.lchip').forEach((el) => el.onclick = () => {
    const g = el.dataset.g, k = el.dataset.k;
    state[g] = state[g] === k && k !== 'all' ? 'all' : k; render();
  });
}

function sortCards(list) {
  return list.sort((a, b) => LORDER[a.light] - LORDER[b.light] || (b.r['销量'] || 0) - (a.r['销量'] || 0));
}

function summaryHtml(list) {
  const by = {};
  for (const x of list) {
    const s = (by[x.e.country] = by[x.e.country] || { n: 0, sales: 0, psales: 0, rev: 0, spend: 0, gp: 0, gpRev: 0 });
    s.n++; s.sales += x.r['销量'] || 0; s.psales += (x.prev && x.prev['销量']) || 0; s.rev += x.r['销售额'] || 0; s.spend += x.r['广告花费'] || 0;
    if (x.r['毛利'] != null) { s.gp += x.r['毛利']; s.gpRev += x.r['销售额'] || 0; }
  }
  const rows = Object.entries(by).map(([c, s]) => {
    const chg = s.psales ? s.sales / s.psales - 1 : null;
    return `<tr><td>${esc(c)}</td><td>${s.n}</td><td><b>${fmtN(s.sales)}</b></td><td class="${chg == null ? 'flat' : chg >= 0 ? 'up' : 'down'}">${chg == null ? '—' : (chg >= 0 ? '+' : '') + pct(chg, 0)}</td>
      <td>${cur(c)}${fmtN(s.rev)}</td><td>${cur(c)}${fmtN(s.spend)}</td><td>${pct(div(s.spend, s.rev))}</td><td>${pct(div(s.gp, s.gpRev))}</td></tr>`;
  }).join('');
  return `<div class="card0"><table class="sumt"><thead><tr><th>国家</th><th>SPU</th><th>本周销量</th><th>环比</th><th>销售额</th><th>广告花费</th><th>TACOS</th><th>毛利率</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// 指标表：本周 / 上周 / 变化；dir=+1 越大越好，-1 越小越好，0 中性；chg='rel' 相对变化，'pp' 百分点
const METRICS = [
  { k: '销量', f: '销量', fmt: (v) => fmtN(v), dir: 1, chg: 'rel' },
  { k: '销售额', f: '销售额', fmt: (v, c) => v == null ? '—' : cur(c) + fmtN(v), dir: 1, chg: 'rel' },
  { k: 'CVR', f: 'CVR', fmt: (v) => pct(v), dir: 1, chg: 'pp' },
  { k: '销售均价', f: '销售均价', fmt: (v, c) => v == null ? '—' : cur(c) + fmtN(v, 2), dir: 0, chg: 'rel' },
  { k: 'CPC', f: 'CPC', fmt: (v, c) => v == null ? '—' : cur(c) + fmtN(v, 2), dir: -1, chg: 'rel' },
  { k: 'ACOS', f: 'ACOS', fmt: (v) => pct(v), dir: -1, chg: 'pp' },
  { k: 'TACOS', f: 'TACOS', fmt: (v) => pct(v), dir: -1, chg: 'pp' },
  { k: '广告单占比', f: '广告单占比', fmt: (v) => pct(v, 0), dir: 0, chg: 'pp' },
  { k: '毛利率', f: '毛利率', fmt: (v) => pct(v), dir: 1, chg: 'pp' },
];
function chgHtml(m, a, b, noArrow) {
  if (a == null || b == null) return '<span class="flat">—</span>';
  let d, txt;
  if (m.chg === 'pp') { d = a - b; txt = (d >= 0 ? '+' : '') + (d * 100).toFixed(1) + '%'; }   // 比率类：本周 − 上周（如 20.6%→28.7% 记 +8.1%）
  else { if (!b) return '<span class="flat">—</span>'; d = a / b - 1; txt = d > 9.99 ? '>+999%' : (d >= 0 ? '+' : '') + (d * 100).toFixed(0) + '%'; }
  const cls = Math.abs(d) < 1e-9 || !m.dir ? 'flat' : (d > 0) === (m.dir > 0) ? 'up' : 'down';
  return `<span class="${cls}">${noArrow ? '' : d > 0 ? '▲' : d < 0 ? '▼' : ''}${txt}</span>`;
}

function w8Html(e) {
  const ws = Array.from({ length: 7 }, (_, i) => state.week - 7 * (6 - i)).concat([state.week + 7]);   // 所选周及往前 6 周 + 下一周（若有）
  const pts = ws.map((w) => ({ w, r: e.weeks.get(w) })).filter((p) => p.r);
  const max = Math.max(1, ...pts.map((p) => p.r['销量'] || 0));
  return `<div class="w8"><div class="w8-t"><span>近 8 周销量</span><span>${pts.some((p) => p.r['周状态'] === '进行中') ? '斜纹 = 本周进行中' : ''}</span></div>
    <div class="w8-bars">${pts.map((p) => { const v = p.r['销量'] || 0;
      return `<div class="w8-b${p.w === state.week ? ' cur' : ''}${p.r['周状态'] === '进行中' ? ' run' : ''}" title="${fmtD(p.w)}~${fmtD(p.w + 6)}　销量 ${fmtN(v)}"><span class="n">${fmtN(v)}</span><i style="height:${Math.max(2, v / max * 100)}%"></i></div>`; }).join('')}</div>
    <div class="w8-x">${pts.map((p) => `<span>${fmtD(p.w)}</span>`).join('')}</div></div>`;
}

const val = (r, f) => { const k = `${r._id}|${f}`; return k in DRAFT ? DRAFT[k] : (r[f] ?? ''); };
function fldHtml(r, f, ph, isNum) {

  return `<div class="fld"><label>${f}</label><textarea rows="1" data-f="${f}" class="${dirty}" placeholder="${esc(ph)}">${esc(v)}</textarea></div>`;
}

        <table class="mt"><thead><tr><th>指标</th><th>本周</th><th>上周</th><th>变化</th></tr></thead><tbody>

            return `<tr><td>${m.k}</td><td>${m.fmt(a, c)}</td><td>${prev ? m.fmt(b, c) : '—'}</td><td>${chgHtml(m, a, b)}</td></tr>`; }).join('')}
        </tbody></table>

        ${asins.length ? `<div class="col-t">ASIN 明细（${asins.length} 个，点 ASIN 看趋势）</div>${asinTblHtml(asins, c)}` : ''}
      </div>
      <div class="pc-col fill">
        <div class="sec"><div class="sec-t">目标与策略 <span class="meta">新周自动沿用上周，有变化再改</span></div>
          ${fldHtml(r, '周目标销量', '', true)}
          ${fldHtml(r, '产品目标', '如：月销 2K+，毛利 20%')}${fldHtml(r, '经营策略', '如：拓展变体、拓展泛词')}${fldHtml(r, '关键指标', '如：销量、利润率')}
        </div>
        <div class="sec"><div class="sec-t">本周复盘 <span class="meta">3 项都填 = 已填</span></div>
          ${fldHtml(r, '竞品动态', '竞品降价/上新/排名变化…')}${fldHtml(r, '问题和归因', '本周哪里不对、为什么')}${fldHtml(r, '计划操作', '下周具体做什么')}
        </div>
        <div class="sec boss"><div class="sec-t">主管建议</div>${fldHtml(r, '建议操作', '主管填写')}</div>
      </div>
    </div>
  </div>`;
}

// 复盘卡片的库存条：口径同产品表现页的 120 天预测
function invStripHtml(e) {
  const cal = invFor(e), ds = cal.days;
  const avg = ds.slice(0, 30).reduce((a, d) => a + d.sales, 0) / 30;   // 未来30天预估日均（备货计划方案 / 备货表月日均）
  const days = avg > 0 ? cal.start / avg : null;
  const cls = days == null ? '' : days < 42 ? 'bad' : days < 72 ? 'warn' : '';   // <头程35+上架7 = 补不上；<72 = 低于安全线（同 ASIN库存页标红口径）
  const firstShort = ds.find((d) => d.short > 0.5);
  const early = cal.multi && firstShort ? `最先卖空：${[...new Set(firstShort.byAsin)].join('、')} 约 ${fmtD(firstShort.d)}（已算上到货）` : '';
  const nxt = ds.find((d) => d.inn.length);
  const nxtQty = nxt ? nxt.inn.reduce((a, b) => a + b.qty, 0) : 0;
  const overdue = nxt && nxt.inn.every((a) => a.kind === '逾期未收');
  return `<div class="inv4">
    <div title="FBA 可售 + 预留"><span>可售库存</span><b>${fmtN(cal.start)}</b><i>含预留</i></div>
    <div title="FBA 货件已发未收（发货量 − 已收量）"><span>在途库存</span><b>${fmtN(cal.transit)}</b><i>已发未收</i></div>
    <div class="${cls}" title="${esc(`可售库存 ÷ 未来30天预估日均 ${fmtN(avg, 1)}` + (early ? '\n' + early : ''))}"><span>可售天数${early ? ' ⚠' : ''}</span><b>${days == null ? '—' : fmtN(days)}</b><i>日均 ${fmtN(avg, 1)}</i></div>
    <div title="${esc(nxt ? nxt.inn.map((a) => `${a.kind} ${a.ref || ''} +${a.qty}`).join('\n') : '')}"><span>下一批到货</span><b>${nxt ? fmtD(nxt.d) : '—'}</b><i>${nxt ? '+' + fmtN(nxtQty) + (overdue ? ' 逾期' : '') : '120天内无'}</i></div>
  </div>`;
}

function asinTblHtml(asins, c) {
  return `<table class="at"><thead><tr><th>ASIN</th><th>销量</th><th>环比</th><th>CVR</th><th>ACOS</th><th>TACOS</th><th>灯</th></tr></thead><tbody>
    ${asins.map(({ e, r, prev }) => `<tr class="${e.key === state.pick ? 'hl' : ''}"><td><a data-goent="${esc(e.key)}" title="${esc(pname(e) || e.asin)}（点击看趋势）">${esc(e.asin)}</a></td><td>${fmtN(r['销量'])}</td>
      <td>${chgHtml(METRICS[0], r['销量'], prev && prev['销量'], true)}</td><td>${pctS(r['CVR'])}</td><td>${pctS(r['ACOS'])}</td><td>${pctS(r['TACOS'])}</td>
      <td title="${esc(r['亮灯原因'] || '')}">${esc(String(r['红绿灯'] || '').slice(0, 2) || '⚪')}</td></tr>`).join('')}

function renderReview(main) {
  const all = cards();
  renderFilters(all);
  let list = all.filter((x) => (state.light === 'all' || x.light === state.light) && (state.fill === 'all' || x.fill === state.fill));
  if (!list.length) { main.innerHTML = summaryHtml(all) + `<div class="empty">这一周没有符合条件的 SPU</div>`; return; }
  sortCards(list);
  let html = summaryHtml(list);
  if (state.owner) html += `<div class="grid">${list.map(cardHtml).join('')}</div>`;
  else {
    const g = {};
    list.forEach((x) => { const o = owners(x.r)[0] || '（未填负责人）'; (g[o] = g[o] || []).push(x); });
    for (const [o, xs] of Object.entries(g).sort((a, b) => b[1].length - a[1].length)) {
      const n = (k) => xs.filter((x) => x.light === k).length;
      html += `<div class="grp"><b>${esc(o)}</b><span class="meta">${xs.length} 个 SPU · 🔴${n('red')} 🟡${n('yellow')} 🟢${n('green')} · 复盘已填 ${xs.filter((x) => x.fill === 'done').length}/${xs.length}</span>
        <div class="lbar">${LIGHTS.map((l) => n(l.key) ? `<i style="flex:${n(l.key)};background:${l.color}"></i>` : '').join('')}</div></div>
        <div class="grid">${xs.map(cardHtml).join('')}</div>`;
    }
  }
  main.innerHTML = html;
  list.forEach(bindCard);
  loadImages(list.map((x) => x.e));
}

function bindCard(x) {
  const el = document.querySelector(`.pc[data-id="${x.r._id}"]`);
  if (!el) return;
  const r = x.r, msg = el.querySelector('[data-msg]'), saveBtn = el.querySelector('[data-save]');
  const refresh = () => {
    const n = [...el.querySelectorAll('[data-f]')].filter((i) => `${r._id}|${i.dataset.f}` in DRAFT).length;
    saveBtn.disabled = !n; msg.textContent = n ? `${n} 项未保存` : '';
  };
  el.querySelectorAll('textarea').forEach(grow);
  el.querySelectorAll('[data-f]').forEach((inp) => inp.oninput = () => {
    const f = inp.dataset.f, k = `${r._id}|${f}`;
    const orig = r[f] == null ? '' : String(r[f]);
    if (inp.value === orig) delete DRAFT[k]; else DRAFT[k] = inp.value;
    inp.classList.toggle('dirty', k in DRAFT);
    if (inp.tagName === 'TEXTAREA') grow(inp);
    refresh();
  });
  el.querySelector('[data-trend]').onclick = () => gotoPerf(x.e.key);
  el.querySelectorAll('[data-goent]').forEach((a) => a.onclick = () => gotoPerf(a.dataset.goent));
  saveBtn.onclick = async () => {
    const changed = [...el.querySelectorAll('[data-f]')].filter((i) => `${r._id}|${i.dataset.f}` in DRAFT);
    if (!changed.length) return;
    const bad = changed.find((i) => i.type === 'number' && i.value !== '' && !(Number(i.value) >= 0));
    if (bad) { msg.textContent = '周目标销量要填非负数字'; return; }
    saveBtn.disabled = true; msg.textContent = '保存中…';
    try {
      if (TBLS.wk) {
        const fields = {};
        for (const i of changed) {
          const fid = FIDS.wk[i.dataset.f];
          if (!fid) throw new Error(`表里找不到字段「${i.dataset.f}」`);
          fields[fid] = i.type === 'number' ? (i.value === '' ? null : Number(i.value)) : (i.value.trim() ? [{ type: 'text', text: i.value }] : null);
        }
        await TBLS.wk.setRecord(r._id, { fields });
      }
      for (const i of changed) { r[i.dataset.f] = i.type === 'number' ? num(i.value) : i.value; delete DRAFT[`${r._id}|${i.dataset.f}`]; }
      render();
      const m = document.querySelector(`.pc[data-id="${r._id}"] [data-msg]`);
      if (m) m.textContent = TBLS.wk ? `已保存 ${changed.length} 项 ✔` : `预览：已模拟保存 ${changed.length} 项（插件版才写回）`;
    } catch (e) {
      msg.textContent = '保存失败：' + (e && e.message ? e.message : e) + '（应用数据权限要对四季品经营表开「可编辑」）';
      saveBtn.disabled = false;
    }
  };
}
function grow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }

// ===== ⑥ 填写进度 =====
function renderProgress(main) {
  const all = cards();
  renderFilters(all);
  const list = sortCards(all.filter((x) => (state.light === 'all' || x.light === state.light) && (state.fill === 'all' || x.fill === state.fill)));
  const cols = [...NUM_EDIT, ...GOAL_FIELDS, ...REVIEW_FIELDS, ...BOSS_FIELDS];
  const g = {};
  list.forEach((x) => { const o = owners(x.r)[0] || '（未填负责人）'; (g[o] = g[o] || []).push(x); });
  let body = '';
  for (const [o, xs] of Object.entries(g).sort((a, b) => a[0].localeCompare(b[0], 'zh'))) {
    body += `<tr class="own"><td colspan="${3 + cols.length}">${esc(o)}　复盘已填 ${xs.filter((x) => x.fill === 'done').length} / ${xs.length}　部分 ${xs.filter((x) => x.fill === 'part').length}</td></tr>`;
    body += xs.map((x) => `<tr class="go" data-go="${esc(x.e.key)}"><td>${esc(x.e.spu)}</td><td>${esc(x.e.country)}</td><td>${esc(x.r['红绿灯'] || '⚪')}</td>
      ${cols.map((f) => filled(val(x.r, f)) ? `<td class="y" title="${esc(String(val(x.r, f)).slice(0, 80))}">✓</td>` : '<td class="n">·</td>').join('')}</tr>`).join('');
  }
  main.innerHTML = list.length ? `<div class="card0" style="overflow-x:auto"><div class="meta" style="margin-bottom:6px">${fmtD(state.week)} ~ ${fmtD(state.week + 6)} 这一周各 SPU 的填写情况（✓ = 已填，鼠标停留看内容），点一行跳到它的卡片。</div>
    <table class="pt"><thead><tr><th>SPU</th><th>国家</th><th>灯</th>${cols.map((f) => `<th class="${BOSS_FIELDS.includes(f) ? 'boss' : ''}">${f}${BOSS_FIELDS.includes(f) ? '（主管）' : ''}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`
    : `<div class="empty">这一周没有符合条件的 SPU</div>`;
  main.querySelectorAll('[data-go]').forEach((tr) => tr.onclick = () => {
    state.mode = 'review'; store.set('swp.mode', 'review'); state.light = 'all'; state.fill = 'all'; renderTop(); render();
    const el = document.querySelector(`.pc[data-key="${CSS.escape(tr.dataset.go)}"]`);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); }
  });
}

// ===== ⑦ 产品表现 =====
function gotoPerf(key) { state.ent = key; store.set('swp.ent', key); state.mode = 'perf'; store.set('swp.mode', 'perf'); renderTop(); render(); window.scrollTo(0, 0); }

function perfEntities() {
  const spus = Object.values(ENT).filter((e) => e.layer === 'SPU' && (!state.country || e.country === state.country)
    && (!state.owner || owners({ 负责人: e.owner }).includes(state.owner)));
  spus.sort((a, b) => a.spu.localeCompare(b.spu, 'zh') || a.country.localeCompare(b.country, 'zh'));
  return spus.map((s) => ({ s, asins: Object.values(ENT).filter((e) => e.layer === 'ASIN' && e.spu === s.spu && e.country === s.country).sort((a, b) => a.asin.localeCompare(b.asin)) }));
}
function seriesFor(e) {
  const keys = e.layer === 'SPU' ? Object.values(ENT).filter((a) => a.layer === 'ASIN' && a.spu === e.spu && a.country === e.country).map((a) => `${a.asin}|${a.country}`) : [`${e.asin}|${e.country}`];
  return DAYS.map((d) => {
    const t = { d, sales: 0, orders: 0, rev: 0, sess: 0, imp: 0, clk: 0, spend: 0, adrev: 0, adord: 0, fba: 0, inb: 0, recv: 0, xfer: 0, has: false, inv: false,
      ret: 0, comm: 0, fbaFee: 0, cogs: 0, miss: 0, rank: null, missAsins: [] };
    for (const k of keys) { const a = DAYAGG[k] && DAYAGG[k][d]; if (!a) continue; t.has = true; if (a.inv) t.inv = true;
      for (const f of ['sales', 'orders', 'rev', 'sess', 'imp', 'clk', 'spend', 'adrev', 'adord', 'fba', 'inb', 'recv', 'xfer', 'ret', 'comm', 'fbaFee', 'cogs', 'miss']) t[f] += a[f];

    s.vals.forEach((v, i) => { if (v == null) { if (curSeg.length) segs.push(curSeg); curSeg = []; } else curSeg.push([x(i), y(v)]); });
    if (curSeg.length) segs.push(curSeg);
    const first = si === series.length - 1;
    for (const sg of segs) {
      const d = sg.map((q, i) => `${i ? 'L' : 'M'}${q[0].toFixed(1)},${q[1].toFixed(1)}`).join('');
      if (opts.avg && first && sg.length > 1) marks += `<path d="${d}L${sg[sg.length - 1][0]},${y(Math.max(ymin, 0))}L${sg[0][0]},${y(Math.max(ymin, 0))}Z" fill="${s.color}" opacity=".10"/>`;
      marks += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (sg.length === 1) marks += `<circle cx="${sg[0][0]}" cy="${sg[0][1]}" r="3" fill="${s.color}"/>`;
    }
  });
  if (opts.marks) for (const mk of opts.marks) { const v = series[0].vals[mk.i]; if (v == null) continue; const cx = x(mk.i), cy = y(v);
    marks += `<path d="M${cx},${cy - 6}L${cx + 5},${cy}L${cx},${cy + 6}L${cx - 5},${cy}Z" fill="var(--blue)" stroke="#fff" stroke-width="1.5"/>
      <text x="${cx}" y="${Math.max(T + 9, cy - 10)}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2f6fd0">${esc(mk.label)}</text>`; }
  let avgTxt = '';
  if (opts.avg) {
    const vs = series[0].vals.filter((v) => v != null);
    if (vs.length) { const av = vs.reduce((a, b) => a + b, 0) / vs.length, yy = y(av); avgTxt = fmt(av);
      marks += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#7a6d61" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
        <text x="${W - R}" y="${yy - 5}" text-anchor="end" font-size="11" fill="#7a6d61">${opts.avg} ${esc(avgTxt)}</text>`; }
  }
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(series.map((s) => s.name).join('、'))} 趋势">${g}${marks}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${T + ih}" stroke="#c9b9a8" stroke-width="1" style="display:none"/>
    <g class="dots"></g><rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair"/></svg><div class="tip"></div>`;
  if (!all.length) box.insertAdjacentHTML('beforeend', `<div class="note" style="position:absolute;left:${L}px;top:${T + ih / 2 - 10}px">这段时间没有数据</div>`);
  const svg = box.querySelector('svg'), xh = svg.querySelector('.xh'), dots = svg.querySelector('.dots'), tip = box.querySelector('.tip');
  const hit = svg.querySelector('rect');
  hit.onmousemove = (ev) => {
    const rc = svg.getBoundingClientRect(), mx = (ev.clientX - rc.left) * W / rc.width;
    const i = Math.max(0, Math.min(n - 1, Math.round((mx - L) / (n <= 1 ? 1 : iw / (n - 1)))));
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.style.display = '';
    dots.innerHTML = series.map((s) => s.vals[i] == null ? '' : `<circle cx="${x(i)}" cy="${y(s.vals[i])}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="2"/>`).join('');
    const p = pts[i];
    const dayTxt = (d) => d == null ? '' : `${fmtD(d)} 周${WKD[ud(d).getUTCDay()]}`;
    const multiDate = series.some((s) => s.dates);
    tip.innerHTML = (multiDate ? '' : `<b>${dayTxt(p.d)}</b>`) + series.map((s) => `<div><span class="sw" style="background:${s.color}"></span>${esc(s.name)}${s.dates ? ` <span class="flat">${dayTxt(s.dates[i])}</span>` : ''}　<strong>${s.vals[i] == null ? esc((s.nulls && s.nulls[i]) || '无数据') : esc(fmt(s.vals[i]))}</strong></div>`).join('')
      + (opts.extra ? opts.extra(i) : '') + (avgTxt ? `<div class="flat">本期${opts.avg} ${esc(avgTxt)}</div>` : '');
    tip.style.display = 'block';
    const px = x(i) * rc.width / W, tw = tip.offsetWidth;
    tip.style.left = (px + 12 + tw > rc.width ? px - tw - 12 : px + 12) + 'px'; tip.style.top = '8px';
  };
  hit.onmouseleave = () => { xh.style.display = 'none'; dots.innerHTML = ''; tip.style.display = 'none'; };
}

// ===== ⑧ 图片 =====
const pname = (a) => { const p = PM[`${a.asin}|${a.country}`]; return p && p['品名'] ? String(p['品名']) : ''; };
const asinLabel = (a) => { const n = pname(a); return `　└ ${a.asin}${n ? ' · ' + (n.length > 28 ? n.slice(0, 28) + '…' : n) : ''}`; };
function imgTag(e) {
  const p = PM[`${e.imgAsin || e.asin}|${e.country}`];
  const u = p && (p._imgData || IMG[e.key]);
  return u ? `<img src="${esc(u)}" alt="">` : '无图';
}
async function loadImages(ents) {
  if (!TBLS.pm || !FIDS.pm['图片']) return;
  for (const e of ents) {
    const p = PM[`${e.imgAsin || e.asin}|${e.country}`];
    const box = document.querySelector(`[data-img="${CSS.escape(e.key)}"]`);
    if (!box || !p || !(p['图片'] || []).length) continue;
    try {
      if (!IMG[e.key]) { const urls = await TBLS.pm.getCellAttachmentUrls([p['图片'][0].token], FIDS.pm['图片'], p._id); IMG[e.key] = urls && urls[0]; }
      if (IMG[e.key]) box.innerHTML = `<img src="${esc(IMG[e.key])}" alt="">`;
    } catch (err) { box.textContent = '图未取到'; }
  }
}

// ===== ⑨ 渲染入口 =====
function render() {
  const main = $('main');
  CHARTS = [];
  if (state.mode === 'perf') renderPerf(main);
  else if (state.mode === 'progress') renderProgress(main);
  else renderReview(main);
}

// ===== ⑩ 保存插件配置 =====
function setupSave() {
  const dash = SDK && SDK.dashboard;
  let st = '';
  try { st = dash && dash.state; } catch (e) { st = '读取失败'; }
  $('saveMsg').textContent = `（插件状态：${st || '未知'}）`;
  if (dash && typeof dash.saveConfig === 'function' && st !== 'View' && st !== 'FullScreen') {
    $('savebar').classList.add('show');
    $('saveBtn').onclick = async () => {
      $('saveBtn').disabled = true; $('saveMsg').textContent = '保存中…';
      try {
        const ok = await dash.saveConfig({
          dataConditions: Object.values(TABLES).map((t) => ({ tableId: t.id, baseToken: BASE_TOKEN, dataRange: { type: 'ALL' }, series: 'COUNTA' })),
          customConfig: { page: document.title, version: 1 },
        });
        $('saveMsg').textContent = ok === false ? '保存失败，请重试' : '已保存 ✔';
      } catch (e) { $('saveMsg').textContent = '保存失败：' + (e && e.message ? e.message : e); }
      finally { $('saveBtn').disabled = false; }
    };
  } else if (dash && dash.setRendered) dash.setRendered().catch(() => {});
}

async function diagnose() {
  const res = [];
  const t = async (name, fn) => {
    try { const v = await Promise.race([fn(), new Promise((_, rej) => setTimeout(() => rej(new Error('超时 8s')), 8000))]);
      let shown; try { shown = typeof v === 'string' ? v : JSON.stringify(v); } catch (x) { shown = String(v); }
      res.push(['✔', name, String(shown).slice(0, 300)]); return v;
    } catch (e) { res.push(['✘', name, e && e.message ? e.message : String(e)]); return undefined; }
  };
  const { bitable, dashboard } = SDK;
  await t('dashboard.state', async () => dashboard.state);
  for (const cfg of Object.values(TABLES)) {
    const tb = await t(`getTableById ${cfg.name}`, () => bitable.base.getTableById(cfg.id));
    if (tb) await t(`getRecordsByPage ${cfg.name}`, () => tb.getRecordsByPage({ pageSize: 2 }));
  }
  return `<div class="card0"><b>接口诊断</b> <span class="meta">请把这块整体截图发回</span><table class="tbl"><tbody>${res.map((r) =>
    `<tr><td style="width:24px">${r[0]}</td><td>${esc(r[1])}</td><td style="color:var(--sub)">${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>`;
}

{ const st = $('sticky'); window.addEventListener('scroll', () => st.classList.toggle('stuck', st.getBoundingClientRect().top <= 0 && window.scrollY > 0), { passive: true }); }

// ===== 启动 =====
function finish(wk, day, pm, src, inv = {}) {
  build(wk.map((r) => normRow('wk', r)), day.map((r) => normRow('day', r)), pm);
  buildInv(inv.ov || [], inv.ship || [], inv.bh || [], inv.sv || [], inv.ch || []);
  state.week = DEFAULT_WEEK;
  const nSpu = Object.values(ENT).filter((e) => e.layer === 'SPU').length;
  $('meta').textContent = `${nSpu} 个 SPU×国家 · ${src}`;
  renderTop(); render();
  if (/debug/.test(location.search)) $('main').insertAdjacentHTML('afterbegin', `<div class="card0"><b>自查（?debug）</b><pre style="white-space:pre-wrap;font-size:11px;margin:6px 0 0">${esc(JSON.stringify({ read: DIAG.read, missing: DIAG.missing, raw: DIAG.raw }, null, 1))}</pre></div>`);
  if (!nSpu) $('main').insertAdjacentHTML('afterbegin', `<div class="card0"><b>没有读到可显示的 SPU —— 自查信息</b> <span class="meta">请截图发回</span>
    <pre style="white-space:pre-wrap;font-size:11px">${esc(JSON.stringify({ read: DIAG.read, missing: DIAG.missing, sample: wk.slice(0, 2) }, null, 1))}</pre></div>`);
}
try {
  if (window.__SNAPSHOT__) {
    const S = window.__SNAPSHOT__;
    finish(S.wk, S.day, S.pm, `本地快照 ${S.at}（预览：保存只是模拟，不写回）`, S);
  } else {
    SDK = await import(SDK_URL);
    setupSave();
    const wk = await readTable('wk');
    let pm = [];
    try { pm = await readTable('pm'); } catch (e) { console.warn('产品主表读不到，卡片不显示图片和毛利', e); }
    const inv = {};
    for (const k of ['ov', 'ship', 'bh', 'sv', 'ch']) { try { inv[k] = await readTable(k); } catch (e) { inv[k] = []; console.warn(`${TABLES[k].name} 读不到，库存预测不完整`, e); } }
    DAY_LOADING = true;
    finish(wk, [], pm, '取数：四季品经营表 + 产品主表 + 备货计划五表', inv);
    const meta0 = $('meta').textContent;
    // 日表最大，放最后后台读：复盘页先能用，产品表现页读完再出
    readTable('day').then((day) => { buildDay(day.map((r) => normRow('day', r))); DAY_LOADING = false; $('meta').textContent = meta0 + ' + 每日数据表';
      if (state.mode === 'perf') render(); })
      .catch((e) => { DAY_LOADING = false; DAY_ERR = e && e.message ? e.message : String(e); console.warn('每日数据表读不到', e); $('meta').textContent = meta0; if (state.mode === 'perf') render(); });
  }
} catch (e) {
  const msg = esc(e && e.message ? e.message : e);
  $('meta').textContent = '';
  $('main').innerHTML = `<div class="card0 err">加载失败：${msg}</div>`;
  if (SDK) { try { $('main').innerHTML += await diagnose(); } catch (e2) { /* 保留报错 */ } }
}
