  读三张表：
    · 四季品经营表 tblbSnNiUOOLlZwu：一行 = (SPU 或 ASIN) × 国家 × 周；SPU 行 = 一张卡片，ASIN 行进卡片的「ASIN 明细」
        8 个手填字段可在卡片上改，保存写回「所选那一周」的行（用户 10-13 定：复盘写在被复盘的那一周）
        建议操作 = 主管填（用户 10-13 定）
    · 每日数据表-灯 tblKAoK9pN3cWI9t：产品表现页近 30 天趋势。一行 = 日期×店铺×ASIN
        聚合口径（同 X24 周报）：ASIN×国家×日 Sessions 取 MAX、其余求和；库存各店铺相加；广告订单 = ROUND(广告CVR×点击)
    · 产品主表-灯类+精铺 tblqksywqgYvywOT：图片（按 主图ASIN + 国家文本）
  默认周 = 最近一个「完整」周。四条硬规矩见 wiki/页面设计/概念/飞书应用自定义插件页.md。

<body>
<div class="wrap">

        「产品表现」看单个 SPU 或 ASIN 的每日趋势（产品、广告可切近 7/14/30 天并对比上一周期，库存看未来 120 天预测）。</template>

<script type="module">
// ===== ① 页面配置 =====
const SDK_URL = 'https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/dist/index.mjs';
const BASE_TOKEN = 'JGvebyaAYapWtOslxc9cuKYXnwd';   // 灯具组-全流程
const GOAL_FIELDS = ['产品目标', '经营策略', '关键指标'];          // 沿用上周，可改
const REVIEW_FIELDS = ['竞品动态', '问题和归因', '计划操作'];       // 本周复盘（3 项都填 = 已填）
const BOSS_FIELDS = ['建议操作'];                                   // 主管填
const TEXT_FIELDS = [...GOAL_FIELDS, ...REVIEW_FIELDS, ...BOSS_FIELDS];
const NUM_EDIT = [];   // 周目标销量 2026-10-16 起是公式（产品目标总表 月目标 / ASIN 预估按天拆到周），页面只读
// 只读数字（存储）字段；CVR/ACOS 等比率是经营表的公式字段，插件里读到的是带格式的值（如「8.8%」），改在页面按同一公式算（见 normRow）
const WK_NUM = ['有效天数', '启用', '销量', '订单量', '销售额', '总点击数', '广告展示数', '广告点击', '广告花费', '广告销售额', '广告订单量', '直接广告订单',
  '毛利', '毛利率', '退货量', '周目标销量'];
const WK_RATIO = {   // 同四季品经营表的公式；分母为 0 → 空
  CVR: ['订单量', '总点击数'], 销售均价: ['销售额', '销量'], 广告CTR: ['广告点击', '广告展示数'], 广告单占比: ['广告订单量', '订单量'],
  广告CVR: ['广告订单量', '广告点击'], CPC: ['广告花费', '广告点击'], ACOS: ['广告花费', '广告销售额'], TACOS: ['广告花费', '销售额'], 退货率: ['退货量', '销量'] };
const DAY_NUM = ['销量', '订单量', '销售额', 'Sessions', '广告曝光量', '点击', '广告花费', '广告销售额', '广告CVR', '直接广告订单', '退货量', '小类排名',
  'FBA可售-领星', 'FBA在途入库-领星', 'FBA接收中-领星', 'FBA调拨处理中-领星'];
const TABLES = {
  // view：「插件-近9周（经营表页面用，勿删）」= 启用=1 且 距今周数<=8（约 700 行）；视图被删时自动退回读全表
  wk: { id: 'tblbSnNiUOOLlZwu', name: '四季品经营表', view: 'vewL1VwST4', fields: [
    '周报键', '层级', 'ASIN', '国家文本', '周起始日', '周状态', '_SPU键', '负责人', '主图ASIN', ...WK_NUM,
    '红绿灯', '亮灯原因', ...NUM_EDIT, ...TEXT_FIELDS] },
  // view：「插件-近66天（经营表页面用，勿删）」= 公式字段 _经营表页面=1（近66天 且 产品主表勾了「进四季品经营表」，约 5000 行；全表 1.8 万行太慢）
  day: { id: 'tblKAoK9pN3cWI9t', name: '每日数据表-灯', view: 'vew7B6MlLH', fields: ['日期', 'ASIN', '国家', '店铺', '维度', ...DAY_NUM] },
  pm: { id: 'tblqksywqgYvywOT', name: '产品主表-灯类+精铺', fields: ['ASIN', '国家文本', '国家', '领星SKU', '品名', '图片', '采购成本不含税', '头程费用', 'FBA配送费', 'FBA配送费（旺季）', '佣金比例', '汇率'] },
  // 库存预测：口径与「四季品备货计划」页一致（model() 由 sync_bh_model.py 原样复制）
  ov: { id: 'tbl23j9fj1autV9a', name: 'ASIN库存概况-灯', fields: ['记录键', 'ASIN', '国家', 'FBA可售', 'FBA预留', '近30天日均', '数据更新日'] },
  ship: { id: 'tblDvoc2YSab7TMr', name: 'FBA在途货件明细-灯', fields: ['ASIN', '国家', '货件号', '发货量', '已收量', '预计到仓日'] },
  bh: { id: 'tblBymnJvmClZQdy', name: '销量预估-备货表', fields: ['领星SKU', '国家', 'ASIN', '本地仓可用', '采购在途', '生产天数', '头程天数', '安全天数', '发货备货天数', '采购备货天数',
    '单箱数量', '头程渠道'] },
  sv: { id: 'tblXt1ki1ZvR2o8U', name: '备货计划-页面存档', fields: ['记录键', '方案数据', '更新时间'] },
  // 月销量目标：四季品-月度行，目标键 = SPU|国家|YYYYMM，「当月销量」= 子 ASIN 预估月销量之和（公式）
  // ASIN 预估：四季品-ASIN预估行，目标键 = ASIN|国家|YYYYMM，「预估日均」= 库存趋势的日销（2026-10-16 起取代备货表 X月日均）
  tg: { id: 'tblE3XbKD8PUEX7Y', name: '产品目标总表-灯', fields: ['目标键', '目标类型', 'ASIN', '国家文本', '销售年月', '当月销量', '预估日均'] },
  ch: { id: 'tblxl08WV9pLwxdi', name: '头程渠道时效', fields: ['物流渠道', '国家', '运输方式', '标准时效天数', '历史样本数', '启用'] },
};
const CAL_DAYS = 120;   // 库存趋势看未来 120 天
const PERF_DAYS = 60;   // 最长 30 天 + 上一周期 30 天

// ===== ② 通用工具 =====
const $ = (id) => document.getElementById(id);
const DAY = 86400000, BJ = 8 * 3600000;
const dn = (ms) => Math.floor((Number(ms) + BJ) / DAY);   // 北京时间天序号
const ud = (n) => new Date(n * DAY);
const fmtD = (n) => { const d = ud(n); return `${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`; };
const WKD = '日一二三四五六';
// 周数：自然周 周日~周六（同 X24 建周行的锚点 2025-12-28 周日），含 1 月 1 日的那一周 = 第 1 周（亚马逊美国后台同口径）
function weekNo(w) {
  const y = ud(w + 6).getUTCFullYear(), j1 = Math.floor(Date.UTC(y, 0, 1) / DAY), a = j1 - ud(j1).getUTCDay();
  return { y, n: Math.floor((w - a) / 7) + 1 };
}
const wkLabel = (w) => `W${weekNo(w).n}`;
// 数字：兼容 SDK 返回的格式化文本（「8.8%」「1,234」「$21.78」「C$5」）
function num(v) {
  if (v == null || v === '' || typeof v === 'boolean') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  const t = String(v).trim(), pc = t.endsWith('%'), x = Number(t.replace(/[^0-9.\-eE]/g, ''));
  return t === '' || !/[0-9]/.test(t) || isNaN(x) ? null : pc ? x / 100 : x;
}
const fmtN = (v, p = 0) => v == null || !isFinite(v) ? '—' : Number(v).toLocaleString('zh-CN', { maximumFractionDigits: p, minimumFractionDigits: p });
const pct = (v, p = 1) => v == null || !isFinite(v) ? '—' : (v * 100).toFixed(p) + '%';
const pctS = (v) => pct(v, v != null && Math.abs(v) >= 0.995 ? 0 : 1);   // 窄列：≥100% 不带小数
const cur = (country) => country === '加拿大' ? 'C$' : '$';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const div = (a, b) => (b ? a / b : null);

function cell(v) {
  if (v == null) return null;
  if (typeof v === 'number' || typeof v === 'string' || typeof v === 'boolean') return v;
  if (Array.isArray(v)) {
    if (!v.length) return null;
    if (v.every((x) => x && typeof x === 'object' && 'text' in x && !('id' in x && 'name' in x && !('type' in x)))) return v.map((x) => x.text ?? '').join('');
    if (v.length === 1) return cell(v[0]);
    return v.map(cell).join('、');
  }
  if (typeof v === 'object') {
    if ('text' in v) return v.text;
    if ('name' in v) return v.name;
    if ('value' in v) return cell(v.value);
  }
  return String(v);
}
function normRow(key, r) {
  const o = { ...r };
  for (const f of ['周起始日', '日期']) if (f in o && o[f] != null && typeof o[f] !== 'number') o[f] = Date.parse(o[f]);
  for (const f of (key === 'wk' ? WK_NUM : key === 'day' ? DAY_NUM : [])) if (f in o) o[f] = num(o[f]);
  for (const f of ['层级', '店铺', '维度', '负责人', '国家', '国家文本', '红绿灯', '周状态']) if (f in o && typeof o[f] !== 'string') o[f] = cell(o[f]);
  for (const f of TEXT_FIELDS) if (f in o && o[f] != null && typeof o[f] !== 'string') o[f] = cell(o[f]);
  if (key === 'wk') for (const [f, [a, b]] of Object.entries(WK_RATIO)) o[f] = o[a] != null && o[b] ? o[a] / o[b] : null;
  // 广告单占比：ASIN 行用「直接广告订单」（广告订单量含溢出到其他 ASIN 的单，单 ASIN 会 >100%；10-15 起表里有这列，之前的周为空 → 显示 —）
  if (key === 'wk' && o['层级'] === 'ASIN') o['广告单占比'] = o['直接广告订单'] != null && o['订单量'] ? o['直接广告订单'] / o['订单量'] : null;
  return o;
}

let SDK = null;
const TBLS = {}, FIDS = {}, DIAG = { missing: {}, read: {} };
async function readTable(key) {
  const cfg = TABLES[key];
  const table = await SDK.bitable.base.getTableById(cfg.id);
  const fields = await table.getFieldMetaList();
  const idByName = Object.fromEntries(fields.map((f) => [f.name, f.id]));
  DIAG.missing[cfg.name] = cfg.fields.filter((w) => !idByName[w]);
  TBLS[key] = table; FIDS[key] = idByName;
  const rows = [];
  let pageToken, useView = !!cfg.view;
  for (let guard = 0; guard < 500; guard++) {
    const q = { pageSize: 200, pageToken };
    if (useView) q.viewId = cfg.view;
    let res;
    try { res = await table.getRecordsByPage(q); } catch (e) {
      if (!useView) throw e;
      console.warn('按视图读取失败，改读全表', e); useView = false; rows.length = 0; pageToken = undefined; continue;
    }
    if (key === 'wk' && !DIAG.raw && res.records.length) {
      const r0 = res.records[0].fields;
      DIAG.raw = Object.fromEntries(['CVR', '销售均价', 'CPC', '启用', '销量', '毛利率', '红绿灯'].filter((n) => idByName[n]).map((n) => [n, r0[idByName[n]]]));
      console.log('[经营表原始值样本]', DIAG.raw);
    }
    for (const r of res.records) {
      const o = { _id: r.recordId };
      for (const w of cfg.fields) if (idByName[w]) o[w] = key === 'pm' && w === '图片' ? (r.fields[idByName[w]] || []) : cell(r.fields[idByName[w]]);   // 日期字段 cell() 保留毫秒数
      rows.push(o);
    }
    DIAG.read[cfg.name] = rows.length;
    $('meta').textContent = `正在读取 ${cfg.name}… 已读 ${rows.length} 行`;
    if (!res.hasMore) break;
    pageToken = res.pageToken;
  }
  return rows;
}

// ===== ③ 数据整理 =====
const LIGHTS = [
  { key: 'red', label: '异常', color: '#e5483f', match: (s) => s.includes('🔴') || s.includes('异常') },
  { key: 'yellow', label: '关注', color: '#f5c518', match: (s) => s.includes('🟡') || s.includes('关注') },
  { key: 'green', label: '正常', color: '#34c759', match: (s) => s.includes('🟢') || s.includes('正常') },
  { key: 'none', label: '未判', color: '#d5cbc0', match: () => true },   // ⚪ 未判 / 样本少 / 空
];
const LORDER = { red: 0, yellow: 1, green: 2, none: 3 };
const lightOf = (s) => LIGHTS.find((l) => l.match(String(s || ''))).key;
const filled = (v) => v != null && String(v).trim() !== '';
const fillState = (r) => { const n = REVIEW_FIELDS.filter((f) => filled(r[f])).length; return n === REVIEW_FIELDS.length ? 'done' : n ? 'part' : 'todo'; };

  // ASIN 归属 SPU：取该 ASIN 最新一周的 _SPU键
  for (const e of Object.values(ENT)) if (e.layer === 'ASIN') {
    const last = [...e.weeks.entries()].sort((a, b) => b[0] - a[0])[0][1];
    e.spu = last['_SPU键'] || e.spu;
  }
  PM = {}; COST = {};
  for (const p of pm) {
    const k = `${p['ASIN']}|${p['国家文本']}`;
    if (!PM[k] || (!PM[k]['图片'] && p['图片'])) PM[k] = p;
    // 成本口径同 X24 周报脚本：单件货成 =（采购成本不含税+头程费用）÷汇率；同 ASIN+国家多行时取成本填齐的那行
    const ok = ['采购成本不含税', '头程费用', 'FBA配送费', '佣金比例', '汇率'].every((f) => p[f] != null && p[f] !== '') && n0(p['汇率']) > 0;
    const c = { ok, comm: n0(p['佣金比例']), fba: n0(p['FBA配送费']), fbaPeak: n0(p['FBA配送费（旺季）']) || null,
      cogs: n0(p['汇率']) > 0 ? (n0(p['采购成本不含税']) + n0(p['头程费用'])) / n0(p['汇率']) : 0 };

// 日数据：只留经营表里的 ASIN×国家；ASIN×国家×日 Sessions 取 MAX、其余求和（插件里日表最后读，读完单独调用）
let DAY_READY = false, DAY_LOADING = false, DAY_ERR = '';
function buildDay(day) {
  const need = new Set(Object.values(ENT).filter((e) => e.layer === 'ASIN').map((e) => `${e.asin}|${e.country}`));
  DAYAGG = {};
  const dset = new Set();
  for (const r of day) {
    if (String(r['维度'] || '').includes('父体') || !r['日期']) continue;
    const k = `${r['ASIN']}|${r['国家']}`;
    if (!need.has(k)) continue;
    const d = dn(r['日期']); dset.add(d);
    const m = (DAYAGG[k] = DAYAGG[k] || {});
    const a = (m[d] = m[d] || { sales: 0, orders: 0, rev: 0, sess: 0, imp: 0, clk: 0, spend: 0, adrev: 0, adord: 0, dad: 0, dadMiss: false, fba: 0, inb: 0, recv: 0, xfer: 0, inv: false,
      ret: 0, comm: 0, fbaFee: 0, cogs: 0, miss: 0, rank: null });
    a.sales += r['销量'] || 0; a.orders += r['订单量'] || 0; a.rev += r['销售额'] || 0;
    a.sess = Math.max(a.sess, r['Sessions'] || 0);
    a.imp += r['广告曝光量'] || 0; a.clk += r['点击'] || 0; a.spend += r['广告花费'] || 0; a.adrev += r['广告销售额'] || 0;
    a.adord += Math.round((r['广告CVR'] || 0) * (r['点击'] || 0));
    if (r['直接广告订单'] == null) a.dadMiss = true; else a.dad += r['直接广告订单'];
    if (r['FBA可售-领星'] != null || r['FBA在途入库-领星'] != null) a.inv = true;
    a.fba += r['FBA可售-领星'] || 0; a.inb += r['FBA在途入库-领星'] || 0; a.recv += r['FBA接收中-领星'] || 0; a.xfer += r['FBA调拨处理中-领星'] || 0;
    a.ret += r['退货量'] || 0;
    if (r['小类排名'] > 0) a.rank = a.rank == null ? r['小类排名'] : Math.min(a.rank, r['小类排名']);   // 同 ASIN 各店铺取最好的
    const c = COST[k], qty = r['销量'] || 0, amt = r['销售额'] || 0;
    if (c && c.ok) {
      const md = ud(d), mo = md.getUTCMonth() + 1, dd = md.getUTCDate();
      const peak = (mo === 10 && dd >= 15) || mo === 11 || mo === 12 || (mo === 1 && dd <= 14);   // 10/15~1/14 用旺季配送费，没填用普通
      a.comm += amt * c.comm; a.fbaFee += qty * (peak && c.fbaPeak ? c.fbaPeak : c.fba); a.cogs += qty * c.cogs;
    } else if (qty > 0) a.miss += qty;
  }
  const maxD = Math.max(...dset);
  DAYS = isFinite(maxD) ? Array.from({ length: PERF_DAYS }, (_, i) => maxD - PERF_DAYS + 1 + i) : [];
  DAY_READY = day.length > 0;
}

// 判灯依据：与四季品经营表的公式一致（_判定 / _销量灯 / _广告灯 / _转化灯）
function basisOf(e, r) {
  const prev = e.weeks.get(state.week - 7) || null;
  let o4 = 0, c4 = 0;
  for (let k = 1; k <= 4; k++) { const w = e.weeks.get(state.week - 7 * k); if (w) { o4 += w['订单量'] || 0; c4 += w['总点击数'] || 0; } }
  const cvr4 = c4 > 0 ? o4 / c4 : 0, cvr = r['CVR'];
  const sales = r['销量'] || 0, tgt = num(r['周目标销量']), last = prev ? prev['销量'] || 0 : 0;
  const lv = (x) => ['green', 'yellow', 'red'][x];
  const items = [];
  if (tgt > 0) { const q = sales / tgt; items.push({ k: '销量', c: lv(q >= 1 ? 0 : q >= 0.8 ? 1 : 2), v: `达成 ${pct(q, 0)}`, rule: '周目标达成 ≥100% 绿 · ≥80% 黄 · 否则红' }); }
  else if (last > 0) { const q = sales / last; items.push({ k: '销量', c: lv(q >= 0.9 ? 0 : q >= 0.7 ? 1 : 2), v: `环比 ${q >= 1 ? '+' : ''}${pct(q - 1, 0)}`, rule: '没有周目标（该月没有月目标）时比上周：≥-10% 绿 · ≥-30% 黄 · 否则红' }); }
  else items.push({ k: '销量', c: 'green', v: '无参照', rule: '没有周目标也没有上周销量，不判' });
  const tac = r['TACOS'];
  items.push({ k: '广告', c: lv(!(r['广告花费'] > 0) || tac == null ? 0 : tac <= 0.15 ? 0 : tac <= 0.2 ? 1 : 2), v: `TACOS ${pct(tac)}`, rule: 'TACOS ≤15% 绿 · ≤20% 黄 · 否则红' });
  if (cvr4 > 0 && cvr != null) { const q = cvr / cvr4; items.push({ k: '转化', c: lv(q >= 0.9 ? 0 : q >= 0.75 ? 1 : 2), v: `CVR ${pct(cvr)} · 较前4周 ${q >= 1 ? '+' : ''}${pct(q - 1, 0)}`, rule: 'CVR 对比前 4 周平均：≥-10% 绿 · ≥-25% 黄 · 否则红' }); }
  else items.push({ k: '转化', c: 'green', v: '前4周无数据', rule: '前 4 周没有点击，不判' });

  else if (sales < 10 || (r['总点击数'] || 0) < 100) note = '样本少（销量<10 或 点击<100），不判灯';
  return { items, note };
}

  if (tgt == null) return `<div class="mbar" data-mbar="${esc(e.key)}"><div class="mbar-h"><b>${label}</b><span class="meta">未填（产品目标总表：各 ASIN 预估日均都空）</span></div></div>`;

  const latest = DAYS[DAYS.length - 1], upto = Math.min(mo.last, latest);
  const keys = Object.values(ENT).filter((a) => a.layer === 'ASIN' && a.spu === e.spu && a.country === e.country).map((a) => `${a.asin}|${a.country}`);
  let sold = 0;
  for (const k of keys) for (let d = mo.first; d <= upto; d++) sold += (DAYAGG[k] && DAYAGG[k][d] && DAYAGG[k][d].sales) || 0;
  const days = mo.last - mo.first + 1, gone = Math.max(0, Math.min(days, upto - mo.first + 1));
  const q = sold / tgt, tq = gone / days, behind = q < tq - 0.05;
  return `<div class="mbar" data-mbar="${esc(e.key)}"><div class="mbar-h"><b>${label} ${fmtN(tgt)}</b>
      <span>已卖 <b class="${behind ? 'down' : 'up'}">${fmtN(sold)}</b>（${pct(q, 0)}）</span></div>
    <div class="pbar big"><i style="width:${Math.min(100, q * 100)}%" class="${behind ? 'behind' : ''}"></i><s style="left:${tq * 100}%" title="时间进度 ${pct(tq, 0)}（截至 ${fmtD(upto)}）"></s></div>
    <div class="mbar-f"><span>时间进度 ${pct(tq, 0)}（${fmtD(upto)}）</span><span>${q >= 1 ? '已达成' : `还差 ${fmtN(tgt - sold)} · 剩 ${days - gone} 天需日均 ${days - gone > 0 ? fmtN((tgt - sold) / (days - gone), 1) : '—'}`}</span></div></div>`;
}

// 复盘卡片的库存条：口径同产品表现页的 120 天预测
function invStripHtml(e) {
  const cal = invFor(e), ds = cal.days;
  const avg = ds.slice(0, 30).reduce((a, d) => a + d.sales, 0) / 30;   // 未来30天预估日均（备货计划方案 / 目标总表 ASIN 预估日均）
  const days = avg > 0 ? cal.start / avg : null;
  const cls = days == null ? '' : days < 42 ? 'bad' : days < 72 ? 'warn' : '';   // <头程35+上架7 = 补不上；<72 = 低于安全线（同 ASIN库存页标红口径）
  const firstShort = ds.find((d) => d.short > 0.5);
  const early = cal.multi && firstShort ? `最先卖空：${[...new Set(firstShort.byAsin)].join('、')} 约 ${fmtD(firstShort.d)}（已算上到货）` : '';
  const nxt = ds.find((d) => d.inn.length);
  const nxtQty = nxt ? nxt.inn.reduce((a, b) => a + b.qty, 0) : 0;
  const overdue = nxt && nxt.inn.every((a) => a.kind === '逾期未收');
  return `<div class="inv4">
    <div title="FBA 可售 + 预留"><span>可售库存</span><b>${fmtN(cal.start)}</b><i>含预留</i></div>
    <div title="FBA 货件已发未收（发货量 − 已收量）"><span>在途库存</span><b>${fmtN(cal.transit)}</b><i>已发未收</i></div>
    <div class="${cls}" title="${esc(`可售库存 ÷ 未来30天预估日均 ${fmtN(avg, 1)}` + (early ? '\n' + early : ''))}"><span>可售天数${early ? ' ⚠' : ''}</span><b>${days == null ? '—' : fmtN(days)}</b><i>日均 ${fmtN(avg, 1)}</i></div>
    <div title="${esc(nxt ? nxt.inn.map((a) => `${a.kind} ${a.ref || ''} +${a.qty}`).join('\n') : '')}"><span>下一批到货</span><b>${nxt ? fmtD(nxt.d) : '—'}</b><i>${nxt ? '+' + fmtN(nxtQty) + (overdue ? ' 逾期' : '') : '120天内无'}</i></div>
  </div>`;
}

// 品名只留同 SPU 各 ASIN 不一样的部分：先去掉大家共有的前缀（截到分隔符），否则去掉 SPU 名前缀；全名和 ASIN 放提示里
const SEP = /[\s\-—_·:：/、，,]/;
function nameLabels(ents, spu) {
  const names = ents.map((a) => pname(a) || '');
  let pre = '';
  if (names.length > 1 && names.every(Boolean)) {
    pre = names.reduce((a, b) => { let k = 0; while (k < a.length && k < b.length && a[k] === b[k]) k++; return a.slice(0, k); });
    let cut = -1; for (let k = pre.length - 1; k >= 0; k--) if (SEP.test(pre[k])) { cut = k; break; }
    pre = cut >= 0 ? pre.slice(0, cut + 1) : '';
  }
  return ents.map((a, i) => {
    const n = names[i]; if (!n) return a.asin;
    let t = pre && n.length > pre.length ? n.slice(pre.length) : n;
    if (t === n && spu && n.startsWith(spu)) t = n.slice(spu.length);
    t = t.replace(/^[\s\-—_·:：/]+/, '');
    return t || n;
  });
}
function asinTblHtml(asins, c, spu) {
  const labels = nameLabels(asins.map((x) => x.e), spu);
  return `<table class="at"><thead><tr><th>品名</th><th>销量</th><th>环比</th><th>CVR</th><th>ACOS</th><th>TACOS</th><th>灯</th></tr></thead><tbody>

        ${r['亮灯原因'] ? `<small class="why ${lightOf(r['红绿灯'])}">${esc(String(r['亮灯原因']).replace(/；$/, '').replace(/；/g, ' · '))}</small>` : ''}</td>
      <td>${fmtN(r['销量'])}</td><td>${chgHtml(METRICS[0], r['销量'], prev && prev['销量'], true)}</td><td>${pctS(r['CVR'])}</td><td>${pctS(r['ACOS'])}</td><td>${pctS(r['TACOS'])}</td>
      <td title="${esc(r['亮灯原因'] || r['红绿灯'] || '')}"><span class="ldot ${lightOf(r['红绿灯'])}"></span></td></tr>`).join('')}

}

function renderReview(main) {
  const all = cards();
  renderFilters(all);
  let list = all.filter((x) => (state.light === 'all' || x.light === state.light) && (state.fill === 'all' || x.fill === state.fill));
  if (!list.length) { main.innerHTML = summaryHtml(all) + `<div class="empty">这一周没有符合条件的 SPU</div>`; return; }
  sortCards(list);
  // 负责人分组（选了负责人就只有一组）；组内红灯排前
  const g = {};
  list.forEach((x) => { const o = owners(x.r)[0] || '（未填负责人）'; (g[o] = g[o] || []).push(x); });
  const groups = Object.entries(g).sort((a, b) => b[1].length - a[1].length);
  const flat = groups.flatMap(([, xs]) => xs);
  const pk = ENT[state.pick];
  if (pk) { const hit = flat.find((x) => x.e.spu === pk.spu && x.e.country === pk.country); if (hit) state.sel = hit.e.key; }
  if (!flat.some((x) => x.e.key === state.sel)) state.sel = flat[0].e.key;
  const selX = flat.find((x) => x.e.key === state.sel);
  const side = groups.map(([o, xs]) => {
    const n = (k) => xs.filter((x) => x.light === k).length;
    return `<div class="side-h"><span>${esc(o)}</span><span>🔴${n('red')} 🟡${n('yellow')} · 已填 ${xs.filter((x) => x.fill === 'done').length}/${xs.length}</span></div>`
      + xs.map((x) => `<button class="si${x.e.key === state.sel ? ' on' : ''}" data-sel="${esc(x.e.key)}" title="${esc(x.e.spu + ' · ' + x.e.country)}">
          <span class="si-img" data-img="${esc(x.e.key)}">${imgTag(x.e)}</span>
          <span class="sn">${esc(x.e.spu)}<small>${esc(x.e.country)} · 复盘${FILL_LABEL[x.fill]}${Object.keys(DRAFT).some((k) => k.startsWith(x.r._id + '|')) ? ' · 未保存' : ''}</small></span>
          <span class="ldot ${x.light}"></span></button>`).join('');
  }).join('');
  main.innerHTML = summaryHtml(list) + `<div class="lib"><nav class="side" id="side"><div class="side-h"><span>SPU</span><span>${flat.length}</span></div>${side}</nav>
    <section class="one">${cardHtml(selX)}</section></div>`;
  bindCard(selX);
  main.querySelectorAll('.si').forEach((b) => b.onclick = () => {
    state.sel = b.dataset.sel; state.pick = '';
    const st = $('side').scrollTop; render(); $('side').scrollTop = st;
    const lib = main.querySelector('.lib'); if (lib && main.scrollTop > lib.offsetTop - 8) main.scrollTop = lib.offsetTop - 8;
  });
  loadImages(flat.map((x) => x.e));
}

function bindCard(x) {
  const el = document.querySelector(`.pc[data-id="${x.r._id}"]`);
  if (!el) return;
  const r = x.r, msg = el.querySelector('[data-msg]'), saveBtn = el.querySelector('[data-save]');
  const refresh = () => {
    const n = [...el.querySelectorAll('[data-f]')].filter((i) => `${r._id}|${i.dataset.f}` in DRAFT).length;
    saveBtn.disabled = !n; msg.textContent = n ? `${n} 项未保存` : '';
  };
  requestAnimationFrame(() => el.querySelectorAll('.fld textarea').forEach((t) => { if (!t.closest('.pc-col.fill .sec:not(.boss)')) grow(t); }));   // 等排版完再量；右栏复盘框靠 flex 撑满
  el.querySelectorAll('[data-f]').forEach((inp) => inp.oninput = () => {
    if (inp.closest('.pc-col.fill .sec:not(.boss)')) inp.dataset.nogrow = '1';
    const f = inp.dataset.f, k = `${r._id}|${f}`;
    const orig = r[f] == null ? '' : String(r[f]);
    if (inp.value === orig) delete DRAFT[k]; else DRAFT[k] = inp.value;
    inp.classList.toggle('dirty', k in DRAFT);
    if (inp.tagName === 'TEXTAREA' && !inp.dataset.nogrow) grow(inp);
    refresh();
    const si = document.querySelector(`.si[data-sel="${CSS.escape(x.e.key)}"] small`);
    if (si && !/未保存/.test(si.textContent) && dirtyCount()) si.textContent += ' · 未保存';
  });
  el.querySelectorAll('.goal').forEach((g) => {
    const inp = g.querySelector('[data-f]'), f = g.dataset.goal;
    if (!inp) return;   // 只读目标（周目标销量）
    const open = () => { el.querySelectorAll('.goal.editing').forEach((o) => o !== g && o.querySelector('[data-gok]').click()); g.classList.add('editing'); if (inp.tagName === 'TEXTAREA') grow(inp); inp.focus(); };
    g.querySelector('[data-gedit]').onclick = open;
    g.querySelector('.goal-v').ondblclick = open;
    g.querySelector('[data-gok]').onclick = () => {   // 完成：只收起，改动留在 DRAFT 等「保存」
      g.classList.remove('editing');
      const def = GOALS.find((x2) => x2.f === f), v = inp.value, shown = def.num ? (num(v) != null ? fmtN(num(v)) : '') : v.trim();
      const vEl = g.querySelector('.goal-v'), keep = vEl.querySelector('.grate');
      vEl.textContent = shown || def.ph; vEl.classList.toggle('none', !shown);
      if (keep && !(`${r._id}|${f}` in DRAFT)) vEl.appendChild(keep);
      g.classList.toggle('dirty', `${r._id}|${f}` in DRAFT);
    };
    g.querySelector('[data-gcancel]').onclick = () => {   // 取消：退回到打开前（已保存的值）
      inp.value = r[f] == null ? '' : String(r[f]); delete DRAFT[`${r._id}|${f}`];
      g.querySelector('[data-gok]').click(); refresh();
    };
    inp.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') g.querySelector('[data-gcancel]').click(); if (ev.key === 'Enter' && (ev.ctrlKey || inp.tagName === 'INPUT')) g.querySelector('[data-gok]').click(); });
  });
  el.querySelector('[data-trend]').onclick = () => gotoPerf(x.e.key);
  el.querySelectorAll('[data-goent]').forEach((a) => a.onclick = () => gotoPerf(a.dataset.goent));
  saveBtn.onclick = async () => {
    const changed = [...el.querySelectorAll('[data-f]')].filter((i) => `${r._id}|${i.dataset.f}` in DRAFT);
    if (!changed.length) return;
    const bad = changed.find((i) => i.type === 'number' && i.value !== '' && !(Number(i.value) >= 0));
    if (bad) { msg.textContent = '周目标销量要填非负数字'; return; }
    saveBtn.disabled = true; msg.textContent = '保存中…';
    try {
      if (TBLS.wk) {
        const fields = {};
        for (const i of changed) {
          const fid = FIDS.wk[i.dataset.f];
          if (!fid) throw new Error(`表里找不到字段「${i.dataset.f}」`);
          fields[fid] = i.type === 'number' ? (i.value === '' ? null : Number(i.value)) : (i.value.trim() ? [{ type: 'text', text: i.value }] : null);
        }
        await TBLS.wk.setRecord(r._id, { fields });
      }
      for (const i of changed) { r[i.dataset.f] = i.type === 'number' ? num(i.value) : i.value; delete DRAFT[`${r._id}|${i.dataset.f}`]; }
      render();
      const m = document.querySelector(`.pc[data-id="${r._id}"] [data-msg]`);
      if (m) m.textContent = TBLS.wk ? `已保存 ${changed.length} 项 ✔` : `预览：已模拟保存 ${changed.length} 项（插件版才写回）`;
    } catch (e) {
      msg.textContent = '保存失败：' + (e && e.message ? e.message : e) + '（应用数据权限要对四季品经营表开「可编辑」）';
      saveBtn.disabled = false;
    }
  };
}
function grow(t) { if (!t.offsetWidth) return; t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }   // 看不见（宽 0）时不量，免得量出巨高
// 宽度变了（窗口/插件框缩放）要重新量输入框高度

// 侧栏高度 = 屏高 − 顶栏高

// ===== ⑥ 填写进度 =====
function renderProgress(main) {
  const all = cards();
  renderFilters(all);
  const list = sortCards(all.filter((x) => (state.light === 'all' || x.light === state.light) && (state.fill === 'all' || x.fill === state.fill)));
  const cols = [...NUM_EDIT, ...GOAL_FIELDS, ...REVIEW_FIELDS, ...BOSS_FIELDS];
  const g = {};
  list.forEach((x) => { const o = owners(x.r)[0] || '（未填负责人）'; (g[o] = g[o] || []).push(x); });
  let body = '';
  for (const [o, xs] of Object.entries(g).sort((a, b) => a[0].localeCompare(b[0], 'zh'))) {
    body += `<tr class="own"><td colspan="${3 + cols.length}">${esc(o)}　复盘已填 ${xs.filter((x) => x.fill === 'done').length} / ${xs.length}　部分 ${xs.filter((x) => x.fill === 'part').length}</td></tr>`;
    body += xs.map((x) => `<tr class="go" data-go="${esc(x.e.key)}"><td>${esc(x.e.spu)}</td><td>${esc(x.e.country)}</td><td>${esc(x.r['红绿灯'] || '⚪')}</td>

function perfEntities() {

      ret: 0, comm: 0, fbaFee: 0, cogs: 0, miss: 0, rank: null, missAsins: [], dad: 0, dadMiss: false };
    for (const k of keys) { const a = DAYAGG[k] && DAYAGG[k][d]; if (!a) continue; t.has = true; if (a.inv) t.inv = true;
      for (const f of ['sales', 'orders', 'rev', 'sess', 'imp', 'clk', 'spend', 'adrev', 'adord', 'fba', 'inb', 'recv', 'xfer', 'ret', 'comm', 'fbaFee', 'cogs', 'miss']) t[f] += a[f];

    <div class="panel"><div class="panel-h"><b>预估日销量（件/天）</b><span><i style="border-color:var(--blue)"></i>备货计划方案的预估日均${cal.multi ? '（各 ASIN 相加）' : ''}</span></div><div class="chart" data-p="v"></div></div>`;
  const tipInn = (i) => { const d = ds[i]; return (d.inn.length ? d.inn.map((a) => `<div>◆ ${esc(a.kind)} +${fmtN(a.qty)} <span class="flat">${esc(a.ref || '')}${cal.multi ? ' · ' + esc(a.asin) : ''}</span></div>`).join('') : '')
    + `<div class="flat">预估销量 ${fmtN(d.sales, 1)}</div>` + (d.short > 0.5 ? `<div class="down">缺货 ${fmtN(d.short, 1)} 件${cal.multi ? '（' + esc(d.byAsin.join('、')) + '）' : ''}</div>` : ''); };
  lineChart(box.querySelector('[data-p="s"]'), ds, [{ name: '预计库存', color: 'var(--or)', vals: ds.map((d) => d.stock) }], (v) => fmtN(v),
    { intOnly: true, height: 230, marks: ds.map((d, i) => d.inn.length ? { i, label: '+' + fmtN(d.inn.reduce((a, b) => a + b.qty, 0)) } : null).filter(Boolean),
      shade: ds.map((d, i) => d.short > 0.5 ? i : null).filter((i) => i != null), extra: tipInn });
  lineChart(box.querySelector('[data-p="v"]'), ds, [{ name: '预估日销量', color: 'var(--blue)', vals: ds.map((d) => d.sales) }], (v) => fmtN(v, 1),
    { height: 150, extra: (i) => ds[i].short > 0.5 ? `<div class="down">缺货 ${fmtN(ds[i].short, 1)} 件</div>` : '' });
}

// 折线图：单 y 轴；opts.avg = 第一条序列的均值虚线标签；悬停十字线 + 提示（各序列可带自己的日期）
function niceStep(v, intOnly) { if (!(v > 0)) return intOnly ? 1 : 0.01; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p;
  const st = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; return intOnly ? Math.max(1, Math.ceil(st)) : st; }
function lineChart(box, pts, series, fmt, opts = {}) {
  if (!box || !box.isConnected) return;
  const W = Math.max(300, box.clientWidth), H = opts.height || 230, L = 58, R = 14, T = 14, B = 26;
  const iw = W - L - R, ih = H - T - B, n = pts.length;
  const all = series.flatMap((s) => s.vals).filter((v) => v != null);
  const lo = Math.min(0, ...all), stp = niceStep((Math.max(0, ...all) - lo) * 1.04 / 4, opts.intOnly);
  const ymin = lo < 0 ? -Math.ceil(-lo / stp) * stp : 0, ymax = ymin + stp * 4;
  const x = (i) => L + (n <= 1 ? iw / 2 : i * iw / (n - 1)), y = (v) => T + ih - (v - ymin) / (ymax - ymin) * ih;
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = ymin + stp * k, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#efe6dc" stroke-width="1"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end" font-size="11" fill="#9a8f84">${esc(fmt(v))}</text>`; }
  const step = Math.ceil(n / 8);
  pts.forEach((p, i) => { if ((n - 1 - i) % step === 0) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#9a8f84">${fmtD(p.d)}</text>`; });
  let marks = '';
  if (opts.shade && opts.shade.length) { const bw = n > 1 ? iw / (n - 1) : iw;
    marks += opts.shade.map((i) => `<rect x="${Math.max(L, x(i) - bw / 2)}" y="${T}" width="${bw}" height="${ih}" fill="#d9363e" opacity=".10"/>`).join(''); }
  [...series].reverse().forEach((s, si) => {   // 倒序画：第一条（本期）在最上层
    const segs = []; let curSeg = [];
    s.vals.forEach((v, i) => { if (v == null) { if (curSeg.length) segs.push(curSeg); curSeg = []; } else curSeg.push([x(i), y(v)]); });
    if (curSeg.length) segs.push(curSeg);
    const first = si === series.length - 1;
    for (const sg of segs) {
      const d = sg.map((q, i) => `${i ? 'L' : 'M'}${q[0].toFixed(1)},${q[1].toFixed(1)}`).join('');
      if (opts.avg && first && sg.length > 1) marks += `<path d="${d}L${sg[sg.length - 1][0]},${y(Math.max(ymin, 0))}L${sg[0][0]},${y(Math.max(ymin, 0))}Z" fill="${s.color}" opacity=".10"/>`;
      marks += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (sg.length === 1) marks += `<circle cx="${sg[0][0]}" cy="${sg[0][1]}" r="3" fill="${s.color}"/>`;
    }
  });
  if (opts.marks) for (const mk of opts.marks) { const v = series[0].vals[mk.i]; if (v == null) continue; const cx = x(mk.i), cy = y(v);
    marks += `<path d="M${cx},${cy - 6}L${cx + 5},${cy}L${cx},${cy + 6}L${cx - 5},${cy}Z" fill="var(--blue)" stroke="#fff" stroke-width="1.5"/>
      <text x="${cx}" y="${Math.max(T + 9, cy - 10)}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2f6fd0">${esc(mk.label)}</text>`; }
  let avgTxt = '';
  if (opts.avg) {
    const vs = series[0].vals.filter((v) => v != null);
    if (vs.length) { const av = vs.reduce((a, b) => a + b, 0) / vs.length, yy = y(av); avgTxt = fmt(av);
      marks += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#7a6d61" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
        <text x="${W - R}" y="${yy - 5}" text-anchor="end" font-size="11" fill="#7a6d61">${opts.avg} ${esc(avgTxt)}</text>`; }
  }
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(series.map((s) => s.name).join('、'))} 趋势">${g}${marks}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${T + ih}" stroke="#c9b9a8" stroke-width="1" style="display:none"/>
    <g class="dots"></g><rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair"/></svg><div class="tip"></div>`;
  if (!all.length) box.insertAdjacentHTML('beforeend', `<div class="note" style="position:absolute;left:${L}px;top:${T + ih / 2 - 10}px">这段时间没有数据</div>`);
  const svg = box.querySelector('svg'), xh = svg.querySelector('.xh'), dots = svg.querySelector('.dots'), tip = box.querySelector('.tip');
  const hit = svg.querySelector('rect');
  hit.onmousemove = (ev) => {
    const rc = svg.getBoundingClientRect(), mx = (ev.clientX - rc.left) * W / rc.width;
    const i = Math.max(0, Math.min(n - 1, Math.round((mx - L) / (n <= 1 ? 1 : iw / (n - 1)))));
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.style.display = '';
    dots.innerHTML = series.map((s) => s.vals[i] == null ? '' : `<circle cx="${x(i)}" cy="${y(s.vals[i])}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="2"/>`).join('');
    const p = pts[i];
    const dayTxt = (d) => d == null ? '' : `${fmtD(d)} 周${WKD[ud(d).getUTCDay()]}`;
    const multiDate = series.some((s) => s.dates);
    tip.innerHTML = (multiDate ? '' : `<b>${dayTxt(p.d)}</b>`) + series.map((s) => `<div><span class="sw" style="background:${s.color}"></span>${esc(s.name)}${s.dates ? ` <span class="flat">${dayTxt(s.dates[i])}</span>` : ''}　<strong>${s.vals[i] == null ? esc((s.nulls && s.nulls[i]) || '无数据') : esc(fmt(s.vals[i]))}</strong></div>`).join('')
      + (opts.extra ? opts.extra(i) : '') + (avgTxt ? `<div class="flat">本期${opts.avg} ${esc(avgTxt)}</div>` : '');
    tip.style.display = 'block';
    const px = x(i) * rc.width / W, tw = tip.offsetWidth;
    tip.style.left = (px + 12 + tw > rc.width ? px - tw - 12 : px + 12) + 'px'; tip.style.top = '8px';
  };
  hit.onmouseleave = () => { xh.style.display = 'none'; dots.innerHTML = ''; tip.style.display = 'none'; };
}

// ===== ⑧ 图片 =====
const pname = (a) => { const p = PM[`${a.asin}|${a.country}`]; return p && p['品名'] ? String(p['品名']) : ''; };
const asinLabel = (a) => { const n = pname(a); return `　└ ${a.asin}${n ? ' · ' + (n.length > 28 ? n.slice(0, 28) + '…' : n) : ''}`; };
function imgTag(e) {
  const p = PM[`${e.imgAsin || e.asin}|${e.country}`];
  const u = p && (p._imgData || IMG[e.key]);
  return u ? `<img src="${esc(u)}" alt="">` : '无图';
}
async function loadImages(ents) {
  if (!TBLS.pm || !FIDS.pm['图片']) return;
  for (const e of ents) {
    const p = PM[`${e.imgAsin || e.asin}|${e.country}`];
    const boxes = document.querySelectorAll(`[data-img="${CSS.escape(e.key)}"]`);
    if (!boxes.length || !p || !(p['图片'] || []).length) continue;
    try {
      if (!IMG[e.key]) { const urls = await TBLS.pm.getCellAttachmentUrls([p['图片'][0].token], FIDS.pm['图片'], p._id); IMG[e.key] = urls && urls[0]; }
      if (IMG[e.key]) boxes.forEach((box) => { box.innerHTML = `<img src="${esc(IMG[e.key])}" alt="">`; });
    } catch (err) { boxes.forEach((box) => { box.textContent = '无图'; }); }
  }
}

// ===== ⑨ 渲染入口 =====
function render() {
  const main = $('main');
  CHARTS = [];
  if (state.mode === 'perf') renderPerf(main);
  else if (state.mode === 'progress') renderProgress(main);
  else renderReview(main);
}

// ===== ⑩ 保存插件配置 =====
function setupSave() {
  const dash = SDK && SDK.dashboard;
  let st = '';
  try { st = dash && dash.state; } catch (e) { st = '读取失败'; }
  $('saveMsg').textContent = `（插件状态：${st || '未知'}）`;
  if (dash && typeof dash.saveConfig === 'function' && st !== 'View' && st !== 'FullScreen') {
    $('savebar').classList.add('show');
    $('saveBtn').onclick = async () => {
      $('saveBtn').disabled = true; $('saveMsg').textContent = '保存中…';
      try {
        const ok = await dash.saveConfig({
          dataConditions: Object.values(TABLES).map((t) => ({ tableId: t.id, baseToken: BASE_TOKEN, dataRange: { type: 'ALL' }, series: 'COUNTA' })),
          customConfig: { page: document.title, version: 1 },
        });
        $('saveMsg').textContent = ok === false ? '保存失败，请重试' : '已保存 ✔';
      } catch (e) { $('saveMsg').textContent = '保存失败：' + (e && e.message ? e.message : e); }
      finally { $('saveBtn').disabled = false; }
    };
  } else if (dash && dash.setRendered) dash.setRendered().catch(() => {});
}

async function diagnose() {
  const res = [];
  const t = async (name, fn) => {
    try { const v = await Promise.race([fn(), new Promise((_, rej) => setTimeout(() => rej(new Error('超时 8s')), 8000))]);
      let shown; try { shown = typeof v === 'string' ? v : JSON.stringify(v); } catch (x) { shown = String(v); }
      res.push(['✔', name, String(shown).slice(0, 300)]); return v;
    } catch (e) { res.push(['✘', name, e && e.message ? e.message : String(e)]); return undefined; }
  };
  const { bitable, dashboard } = SDK;
  await t('dashboard.state', async () => dashboard.state);
  for (const cfg of Object.values(TABLES)) {
    const tb = await t(`getTableById ${cfg.name}`, () => bitable.base.getTableById(cfg.id));
    if (tb) await t(`getRecordsByPage ${cfg.name}`, () => tb.getRecordsByPage({ pageSize: 2 }));
  }
  return `<div class="card0"><b>接口诊断</b> <span class="meta">请把这块整体截图发回</span><table class="tbl"><tbody>${res.map((r) =>
    `<tr><td style="width:24px">${r[0]}</td><td>${esc(r[1])}</td><td style="color:var(--sub)">${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>`;
}

$('main').addEventListener('scroll', () => $('sticky').classList.toggle('stuck', $('main').scrollTop > 0), { passive: true });
$('help').title = $('helpText').innerHTML.replace(/\s+/g, ' ').trim();
// 插件框比屏幕还高时外层会滚、顶栏跟着走 → 提示把组件高度拖到一屏内（同 feishu-page-kit 模板）
function layoutCheck() { $('tallTip').style.display = innerHeight > (screen.availHeight || screen.height || 1080) + 40 ? '' : 'none'; }
window.addEventListener('resize', layoutCheck); layoutCheck();

// ===== 启动 =====
function finish(wk, day, pm, src, inv = {}) {
  build(wk.map((r) => normRow('wk', r)), day.map((r) => normRow('day', r)), pm);
  buildInv(inv.ov || [], inv.ship || [], inv.bh || [], inv.sv || [], inv.ch || [], inv.tg || []);
  MTG = {}; for (const t of inv.tg || []) { const v = num(cell(t['当月销量'])); if (t['目标键'] && v > 0 && first(t['目标类型']) === '四季品-月度') MTG[cell(t['目标键'])] = v; }
  state.week = DEFAULT_WEEK;
  const nSpu = Object.values(ENT).filter((e) => e.layer === 'SPU').length;
  $('meta').textContent = `${nSpu} 个 SPU×国家 · ${src}`;
  renderTop(); render(); setStickyH();
  if (/debug/.test(location.search)) $('main').insertAdjacentHTML('afterbegin', `<div class="card0"><b>自查（?debug）</b><pre style="white-space:pre-wrap;font-size:11px;margin:6px 0 0">${esc(JSON.stringify({ read: DIAG.read, missing: DIAG.missing, raw: DIAG.raw }, null, 1))}</pre></div>`);
  if (!nSpu) $('main').insertAdjacentHTML('afterbegin', `<div class="card0"><b>没有读到可显示的 SPU —— 自查信息</b> <span class="meta">请截图发回</span>
    <pre style="white-space:pre-wrap;font-size:11px">${esc(JSON.stringify({ read: DIAG.read, missing: DIAG.missing, sample: wk.slice(0, 2) }, null, 1))}</pre></div>`);
}
try {
  if (window.__SNAPSHOT__) {
    const S = window.__SNAPSHOT__;
    finish(S.wk, S.day, S.pm, `本地快照 ${S.at}（预览：保存只是模拟，不写回）`, S);
  } else {
    SDK = await import(SDK_URL);
    setupSave();
    const wk = await readTable('wk');
    let pm = [];
    try { pm = await readTable('pm'); } catch (e) { console.warn('产品主表读不到，卡片不显示图片和毛利', e); }
    const inv = {};
    for (const k of ['ov', 'ship', 'bh', 'sv', 'ch', 'tg']) { try { inv[k] = await readTable(k); } catch (e) { inv[k] = []; console.warn(`${TABLES[k].name} 读不到，库存预测不完整`, e); } }
    DAY_LOADING = true;
    finish(wk, [], pm, '取数：四季品经营表 + 产品主表 + 备货计划五表', inv);
    const meta0 = $('meta').textContent;
    // 日表最大，放最后后台读：复盘页先能用，产品表现页读完再出
    readTable('day').then((day) => { buildDay(day.map((r) => normRow('day', r))); DAY_LOADING = false; $('meta').textContent = meta0 + ' + 每日数据表';
      if (state.mode === 'perf') render(); else refreshMonthBars(); })
      .catch((e) => { DAY_LOADING = false; DAY_ERR = e && e.message ? e.message : String(e); console.warn('每日数据表读不到', e); $('meta').textContent = meta0; if (state.mode === 'perf') render(); });
  }
} catch (e) {
  const msg = esc(e && e.message ? e.message : e);
  $('meta').textContent = '';
  $('main').innerHTML = `<div class="card0 err">加载失败：${msg}</div>`;
  if (SDK) { try { $('main').innerHTML += await diagnose(); } catch (e2) { /* 保留报错 */ } }
}
</script>
