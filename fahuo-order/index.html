<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发货指令</title>
<!--
  飞书应用「灯具组-全流程」插件页：发货指令（2026-10-27）
  运营建发货指令（选产品→填箱数→发货安排，可分批/复制）→ 指令列表（就地编辑、提交审核、勾选批量）→ 审核人（发货指令表配置行）审核
  → 逐行写进「出口对账-发货计划」（指令号/指令状态/渠道/预计到达）→ 待发货（只读，可驳回；货件号读发货计划 货件1~6）。
  页面里只有 base token 和表 ID，没有任何密钥。发布：连同 sdk/ 拷到 github-pages/fahuo-order/。本地调试：?mock（mock-sdk.mjs，不发布）。
-->
<style>
  :root {
    --bg: #f5f6f7; --card: #ffffff; --ink: #1f2329; --sub: #646a73; --line: #e5e6eb;
    --blue: #3370ff; --blue-soft: #e1eaff; --red: #f54a45; --red-soft: #fde2e2;
    --yellow: #ff8800; --yellow-soft: #fff1d6; --green: #2ea121; --green-soft: #d9f5d6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { padding: 12px 16px 0; height: 100vh; display: flex; flex-direction: column; }
  .sticky { flex: none; background: var(--bg); margin: 0 -16px; padding: 4px 16px 10px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .sticky h1 { margin: 0; font-size: 17px; }
  #main { flex: 1; min-height: 0; overflow: auto; margin: 0 -16px; padding: 0 16px 32px; }
  .tabs { display: flex; gap: 4px; background: #eceef1; border-radius: 8px; padding: 3px; }
  .tabs button { border: 0; background: none; padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--sub); }
  .tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .tabs .num { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; line-height: 18px; margin-left: 4px; }
  .meta { color: var(--sub); font-size: 12px; }
  .who { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); }
  .preview-tag { background: var(--yellow-soft); color: #b25e00; border-radius: 4px; padding: 1px 8px; font-size: 12px; }
  .card { background: var(--card); border-radius: 8px; padding: 14px 16px; border: 1px solid var(--line); margin-bottom: 12px; }
  .card h3 { margin: 0 0 12px; font-size: 15px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card h3 small { font-weight: normal; color: var(--sub); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 16px; align-items: end; }
  .grid .seg { height: 32px; } .grid .seg button { height: 100%; }
  .grid input[type=date] { height: 32px; }
  .rg { font-weight: 600; padding: 0 6px; border-radius: 4px; font-size: 12.5px; }
  span.rg.rg-w { color: #c2410c; background: #fff1e6; } span.rg.rg-m { color: #15803d; background: #e8f7ec; } span.rg.rg-e { color: #6d28d9; background: #f1ebff; }
  .ship span.rg { font-size: 12.5px; }
  .cf-head span.rg { background: #fff !important; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--sub); }
  label.f b { color: var(--red); font-weight: normal; }
  input, select, textarea { font: inherit; color: var(--ink); border: 1px solid #d0d3d6; border-radius: 6px; padding: 5px 8px; background: #fff; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-soft); }
  input.miss, select.miss { border-color: var(--red); background: #fff8f8; }
  input[readonly] { background: var(--bg); color: var(--sub); }
  .seg { display: inline-flex; border: 1px solid #d0d3d6; border-radius: 6px; overflow: hidden; width: max-content; }
  .seg button { border: 0; background: #fff; padding: 5px 16px; cursor: pointer; font: inherit; }
  .seg button + button { border-left: 1px solid #d0d3d6; }
  .seg button.on { background: var(--blue); color: #fff; }
  .hint { font-size: 12px; color: var(--sub); }
  .link { border: 0; background: none; color: var(--blue); cursor: pointer; font: inherit; font-size: 12px; padding: 0; }
  .link.red { color: var(--red); }
  .badge { display: inline-block; border-radius: 4px; padding: 1px 8px; font-size: 12px; white-space: nowrap; }
  .b-green { background: var(--green-soft); color: var(--green); }
  .b-yellow { background: var(--yellow-soft); color: #b25e00; }
  .b-red { background: var(--red-soft); color: var(--red); }
  .b-blue { background: var(--blue-soft); color: var(--blue); }
  .b-gray { background: #eff0f1; color: var(--sub); }

  /* 选产品下拉 */
  .picker { position: relative; max-width: 900px; }
  .picker-row { display: flex; gap: 8px; align-items: stretch; } .picker-row .picker-box { flex: 1; min-width: 0; }
  .po-btn { height: auto; min-height: 34px; white-space: nowrap; }
  .btn.red-solid { background: var(--red); color: #fff; }
  .po-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #fafbfc; }
  .po-q { flex: 1; min-width: 220px; }
  .store-cell { font-size: 12px; color: #3b4a6b; background: #eef3ff; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
  .row-store { height: 28px; font-size: 12px; max-width: 170px; }
  .store-filter { height: 28px; font-size: 12.5px; } .store-filter.on { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
  .po-ctl { display: contents; }
  .store-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .store-row select { min-width: 220px; height: 32px; }
  .po-top .seg button:disabled { opacity: .35; cursor: not-allowed; }
  .po-item .sub div { line-height: 1.7; }
  .picker-box { display: flex; align-items: center; gap: 8px; border: 1px solid #d0d3d6; border-radius: 6px; padding: 4px 8px; background: #fff; cursor: text; }
  .picker-box.open { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-soft); }
  .picker-box input { border: 0; box-shadow: none !important; flex: 1; padding: 3px 0; }
  .pick-panel { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: #fff; border: 1px solid var(--line); border-radius: 8px;
                box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: 360px; overflow: auto; z-index: 30; }
  .pick-item { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 7px 12px; cursor: pointer; border-bottom: 1px solid #f2f3f5; }
  .pick-item:hover { background: #f5f8ff; }
  .pick-item.dis { opacity: .4; cursor: not-allowed; }
  .pick-item .nm { font-weight: 500; }
  .pick-item .sub { color: var(--sub); font-size: 12px; font-family: Consolas, monospace; }
  .pick-foot { position: sticky; bottom: 0; background: #fafbfc; padding: 6px 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }

  .lines { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  .tbl th, .tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: middle; }
  .tbl th { color: var(--sub); font-weight: normal; background: #fafbfc; font-size: 12px; }
  .tbl tr.cont td { border-top: 0; background: #fcfcfd; }
  .tbl tr.grp-end td { border-bottom: 1px solid #d8dbe0; }
  .mono { font-family: Consolas, monospace; font-size: 12.5px; }
  .auto { color: var(--blue); }
  .tbl input.num { width: 70px; text-align: right; }
  .tbl input.tot-auto { background: var(--bg); color: var(--ink); font-weight: 600; border-color: transparent; }
  .tbl input.po { width: 130px; } .tbl input.rk { width: 150px; }
  .tbl td.total { font-weight: 600; }
  .empty { padding: 20px; text-align: center; color: var(--sub); border: 1px dashed #d0d3d6; border-radius: 8px; }

  .ships { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 10px; }
  .ship { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fafbfc; display: grid; grid-template-columns: 52px 1fr; gap: 6px 8px; align-items: center; }
  .ship .t { grid-column: 1 / -1; font-weight: 600; }
  .ship span { font-size: 12px; color: var(--sub); }

  .sumbar { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .sumbar .n { font-size: 20px; font-weight: 600; }
  .btn { height: 34px; padding: 0 18px; border: 0; border-radius: 6px; background: var(--blue); color: #fff; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .btn.sm { height: 28px; padding: 0 12px; font-size: 13px; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid #d0d3d6; }
  .btn.green { background: var(--green); } .btn.red { background: #fff; color: var(--red); border: 1px solid #f9b9b7; }
  .errs { color: var(--red); font-size: 12px; margin-top: 8px; }

  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid #d0d3d6; background: #fff; border-radius: 14px; padding: 3px 12px; cursor: pointer; font: inherit; font-size: 12px; }
  .chip.on { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
  .order { padding: 0; overflow: hidden; }
  .order-head { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; padding: 10px 14px; background: var(--blue); color: #fff; }
  .order-head .no { font-weight: 700; font-family: Consolas, monospace; font-size: 15px; color: #fff; }
  .order-head .kv { font-size: 12.5px; color: rgba(255,255,255,.82); } .order-head .kv b { color: #fff; font-weight: 600; }
  .order-head .badge { box-shadow: 0 0 0 1px rgba(255,255,255,.6); }
  .order-head .btn.ghost { border-color: #fff; }
  .order-head .btn:not(.ghost):not(.red):not(.green) { background: #fff; color: var(--blue); font-weight: 600; }
  .order-head .btn.green { box-shadow: 0 0 0 1px #fff; }
  .card.order { border: 1px solid #b9cdfb; margin-bottom: 16px; }
  .order.editing .order-head { background: #1d4fd8; }
  .order-head .acts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .order .tbl th { background: #f0f5ff; color: #3b4a6b; }
  .order-foot { padding: 8px 14px; display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--sub); border-top: 1px solid var(--line); }
  .reason { margin: 0 14px 10px; padding: 8px 12px; border-radius: 6px; background: var(--red-soft); color: #c0322e; font-size: 12.5px; }
  .rejbox { display: flex; gap: 8px; padding: 10px 14px; background: #fff8f8; border-bottom: 1px solid var(--line); }
  .rejbox input { flex: 1; }
  .toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: #1f2329; color: #fff; padding: 8px 18px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99; }
  .toast.show { opacity: .92; }
  /* v3 追加 */
  .bulkbar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
  .bulkbar.on { border-color: var(--blue); background: #f5f8ff; }
  .batch { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; }
  .batch input { width: 56px; text-align: right; }
  .order-head input[type=checkbox] { width: 16px; height: 16px; margin: 0; }
  .pick-panel { display: flex; flex-direction: column; overflow: hidden; }
  .pick-list { overflow: auto; max-height: 300px; }
  .pick-grp { position: sticky; top: 0; z-index: 1; background: #eef3ff; padding: 5px 12px; font-size: 12.5px; font-weight: 600; color: #2b3a5c; border-bottom: 1px solid #dbe5ff; }
  .shoe-spu { cursor: pointer; position: static; }
  .shoe-color { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 28px; border-bottom: 1px solid #f2f3f5; flex-wrap: wrap; }
  .shoe-color .cn { min-width: 64px; font-weight: 600; }
  .szs { display: flex; gap: 4px; flex-wrap: wrap; }
  .szc { min-width: 34px; text-align: center; padding: 2px 6px; border: 1px solid #d0d3d6; border-radius: 4px; cursor: pointer; font-size: 12.5px; background: #fff; user-select: none; }
  .szc.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .szc.dis { opacity: .35; cursor: not-allowed; }
  .shoe-tbl { border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; overflow: hidden; }
  .shoe-head { background: #fff7ed; color: #9a3412; font-size: 12.5px; padding: 6px 12px; border-bottom: 1px solid var(--line); }
  .shoe-grp { display: grid; grid-template-columns: 220px 1fr 110px 220px; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .shoe-grp:last-child { border-bottom: 0; }
  .sg-color { font-weight: 600; color: #9a3412; }
  .sg-sizes { display: flex; flex-wrap: wrap; gap: 6px; }
  .sz { display: inline-flex; flex-direction: column; align-items: center; position: relative; border: 1px solid #e5e6eb; border-radius: 6px; padding: 2px 4px 4px; background: #fafbfc; }
  .sz span { font-size: 11.5px; color: var(--sub); }
  .sz input.num { width: 52px; text-align: center; padding: 3px 4px; }
  .sz .x { position: absolute; top: -6px; right: -6px; width: 14px; height: 14px; line-height: 13px; text-align: center; font-size: 11px; border-radius: 50%; background: #c9cdd4; color: #fff; cursor: pointer; display: none; }
  .sz:hover .x { display: block; }
  .sg-po { display: flex; gap: 6px; align-items: center; } .sg-po input { width: 130px; }
  @media (max-width: 900px) { .shoe-grp { grid-template-columns: 1fr; } }
  .shoe-tbl.ro { margin: 10px 14px; }
  .shoe-grp.ro { grid-template-columns: 220px 1fr 140px; }
  .szv { display: inline-flex; flex-direction: column; align-items: center; min-width: 44px; border: 1px solid #e5e6eb; border-radius: 6px; padding: 2px 6px; background: #fafbfc; }
  .szv span { font-size: 11.5px; color: var(--sub); } .szv b { font-size: 13.5px; }
  .szv.cf { min-width: 96px; gap: 2px; } .szv.cf .chk { font-size: 11.5px; }
  .merge-box { border: 2px dashed #7aa2ff; border-radius: 10px; padding: 8px 8px 0; margin-bottom: 16px; background: #f6f9ff; }
  .merge-head { font-size: 13px; color: #1d4fd8; padding: 2px 6px 8px; }
  .fill-orders { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 13px; }
  .fill-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .fill-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .fill-slot { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fafbfc; font-size: 13px; }
  .fill-slot input { font-size: 14px; }
  .fill-cands { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 12.5px; line-height: 1.8; }
  .pick-err { position: sticky; top: 0; z-index: 2; background: var(--red-soft); color: var(--red); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid #f9b9b7; }
  .modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 95; display: none; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow: auto; }
  .modal.show { display: flex; }
  .modal-box { background: #fff; border-radius: 10px; width: min(980px, 100%); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .modal-box > h3 { margin: 0; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 16px; }
  .modal-body { padding: 12px 18px; max-height: 70vh; overflow: auto; }
  .modal-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
  .cf-order { border: 1px solid #b9cdfb; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  .cf-order .cf-head { background: var(--blue); color: #fff; padding: 8px 12px; font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; }
  .cf-order .cf-head b { font-family: Consolas, monospace; font-size: 14px; }
  .chk { color: var(--red); font-weight: 700; background: var(--red-soft); border-radius: 4px; padding: 1px 6px; }
  .cf-ships { padding: 6px 12px 10px; font-size: 12.5px; color: var(--sub); display: flex; gap: 14px; flex-wrap: wrap; }
  .ship { grid-template-columns: 60px 1fr; }
  .ship .sug { grid-column: 1 / -1; font-size: 12px; color: var(--sub); }
  .ship .sug b { color: var(--ink); }
  .editing { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-soft); }
  .editing .ed { padding: 12px 14px 0; }
  .ed h4 { margin: 14px 0 8px; font-size: 13px; color: var(--sub); font-weight: 500; }
  .ed h4:first-child { margin-top: 0; }
  .edit-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 14px; border-top: 1px solid var(--line); background: #fafbfc; margin-top: 12px; }
  .me-auto { display: inline-flex; align-items: center; gap: 6px; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 11px; }
  .sim { font-size: 11px; color: #b0b3b8; } .sim select { font-size: 11px; padding: 1px 4px; color: var(--sub); }
  .wrote { font-size: 12px; color: var(--green); }
  /* 插件页框架 */
  .tip { flex: none; background: #fff7e8; color: #b25e00; border-radius: 8px; padding: 6px 12px; font-size: 12.5px; margin-bottom: 8px; }
  .savebar { flex: none; display: none; align-items: center; gap: 12px; background: #fff7e8; border: 1px solid #ffd591; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
  .savebar.show { display: flex; }
  .savebar button { height: 32px; padding: 0 16px; border: 0; border-radius: 6px; background: var(--blue); color: #fff; font-size: 14px; cursor: pointer; }
  .loading { padding: 40px; text-align: center; color: var(--sub); }
  .err { color: var(--red); white-space: pre-wrap; }
  .busy { position: fixed; inset: 0; background: rgba(255,255,255,.55); z-index: 90; display: none; place-items: center; font-size: 14px; color: var(--ink); }
  .busy.show { display: grid; }
  .warn { background: var(--yellow-soft); color: #8a4b00; border-radius: 6px; padding: 6px 10px; font-size: 12px; margin-bottom: 8px; }

  /* 货件卡片（指令卡里每个货件一张） */
  .shipcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .shipcard { border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 8px; padding: 10px 12px; background: #fafbfc; display: flex; flex-direction: column; gap: 4px; }
  .shipcard .h { font-size: 13px; font-weight: 600; color: var(--blue); }
  .shipcard .ch { font-size: 15px; font-weight: 600; color: var(--ink); }
  .shipcard .ch.none { color: var(--sub); font-weight: normal; }
  .shipcard .eta { font-size: 14px; color: var(--ink); }
  .shipcard .no { font-size: 13px; font-family: Consolas, monospace; }
  .shipcard.built { border-left-color: var(--green); }
</style>
</head>
<body>
<div class="wrap">
  <div class="tip" id="tallTip" style="display:none">插件框比屏幕还高，往下滑时顶部会被滚走。请在应用编辑模式里把这个插件组件的高度拖到一屏以内。</div>
  <div class="savebar" id="savebar">
    <span>这是插件的配置预览。确认没问题后点右边按钮，插件才会保存到应用页面上。</span>
    <button id="saveBtn">保存到页面</button>
    <span class="meta" id="saveMsg"></span>
  </div>
  <div class="sticky" id="sticky">
    <h1>发货指令</h1>
    <div class="tabs" id="tabs"></div>
    <button class="btn sm ghost" id="reload" title="重新读取多维表（别人刚改过时点一下）">⟳ 刷新数据</button>
    <button class="link" id="selfcheck" style="color:var(--sub)">自检</button>
    <div class="who"><span class="me-auto"><span class="avatar" id="meAv">?</span><span id="meName">识别中…</span><span class="hint" id="meRole"></span></span></div>
  </div>
  <div id="main"><div class="loading">正在读取多维表数据…</div></div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-box"><h3 id="mTitle"></h3><div class="modal-body" id="mBody"></div>

SDK_URLS.push('https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/dist/index.mjs', 'https://unpkg.com/@lark-base-open/js-sdk@1.0.2/dist/index.mjs');
const MOCK = /[?&]mock\b/.test(location.search);           // 本地调试：?mock 用 mock-sdk.mjs（不发布）
const BASE_TOKEN = 'JGvebyaAYapWtOslxc9cuKYXnwd';   // 灯具组-全流程
const TABLES = {
  // 第一张 = saveConfig 第一条 dataCondition（应用只认第一条给授权）；其余表在应用页「数据授权（勿删）/数据授权2（勿删）」有列表组件引用
  ord:  { id: 'tbl83YlBQgKzooyz', name: '发货指令', core: true,
          fields: ['指令号', '序号', '状态', '提交人', '国家', '发货日期', '是否分仓', '合计箱数', '合计件数', '摘要', '明细JSON', '货件JSON', '备注', '驳回原因', '分批计划', '合并批次', '店铺', '审核人', '审核时间', '最后修改'] },
  pm:   { id: 'tblqksywqgYvywOT', name: '产品主表-灯类+精铺', core: true, fields: ['ASIN', '国家', '店铺', '品名', 'MSKU', 'FNSKU', '领星SKU', '单箱数量', 'SPU'] },

// ================= ② 工具 =================
const $ = (id) => document.getElementById(id);
const DAY = 86400000, BJ = 8 * 3600000;
const dnMs = (ms) => Math.floor((Number(ms) + BJ) / DAY);               // 毫秒 → 北京天序号
const dn = (s) => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY; };   // 'YYYY-MM-DD' → 天序号
const ds = (n) => new Date(n * DAY).toISOString().slice(0, 10);          // 天序号 → 'YYYY-MM-DD'
const msOf = (s) => s ? dn(s) * DAY - BJ : null;                         // 'YYYY-MM-DD' → 多维表日期（北京 0 点）
const md = (s) => s ? s.slice(5).replace('-', '/') : '—';
const TODAY = ds(dnMs(Date.now()));
const fmtTime = (ms) => { if (!ms) return ''; const d = new Date(Number(ms) + BJ); return d.toISOString().slice(0, 16).replace('T', ' '); };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
function toast(t, ms = 2600) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), ms); }
function busy(msg) { $('busy').classList.toggle('show', !!msg); if (msg) $('busyMsg').textContent = msg; }

function cell(v) {
  if (v == null) return null;
  if (typeof v === 'number' || typeof v === 'string' || typeof v === 'boolean') return v;
  if (Array.isArray(v)) {
    if (!v.length) return null;
    if (v.every((x) => x && typeof x === 'object' && 'text' in x && !('id' in x && 'name' in x && !('type' in x)))) return v.map((x) => x.text ?? '').join('');
    if (v.length === 1) return cell(v[0]);
    return v.map(cell).join('、');
  }
  if (typeof v === 'object') { if ('text' in v) return v.text; if ('name' in v) return v.name; if ('value' in v) return cell(v.value); }
  return String(v);
}
// 人员字段 → [{id, name}]
function users(v) {
  if (!v) return [];
  const a = Array.isArray(v) ? v : [v];
  return a.filter((x) => x && typeof x === 'object' && x.id).map((x) => ({ id: x.id, name: x.name || x.enName || '' }));
}
const num = (v) => { if (v == null || v === '') return 0; const n = Number(String(v).replace(/[^\d.-]/g, '')); return isNaN(n) ? 0 : n; };
const json = (s, d) => { try { return s ? JSON.parse(s) : d; } catch (e) { return d; } };

// ================= ③ 读写多维表 =================
let SDK = null;
const META = {};      // key → { table, idByName, byName }
const DATA = {};      // key → rows（{_id, 字段名: 普通值, _raw: {字段名: 原始值}}）
const LOADERR = {};   // key → 报错文字（非核心表读不到时页面降级）

async function openTable(key) {
  if (META[key]) return META[key];
  const cfg = TABLES[key];
  const table = await SDK.bitable.base.getTableById(cfg.id);
  const fields = await table.getFieldMetaList();
  const m = { table, idByName: Object.fromEntries(fields.map((f) => [f.name, f.id])), byName: Object.fromEntries(fields.map((f) => [f.name, f])) };
  m.missing = cfg.fields.filter((w) => !m.idByName[w]);
  META[key] = m; return m;
}
async function readTable(key) {
  const cfg = TABLES[key], m = await openTable(key);
  const rows = []; let pageToken;
  for (let guard = 0; guard < 300; guard++) {
    const q = { pageSize: 200, pageToken }; if (cfg.view) q.viewId = cfg.view;
    let res;
    try { res = await m.table.getRecordsByPage(q); } catch (e) {
      if (!q.viewId) throw e; cfg.view = ''; delete q.viewId; rows.length = 0; res = await m.table.getRecordsByPage(q);
    }
    for (const r of res.records) {
      const o = { _id: r.recordId, _raw: {} };
      for (const w of cfg.fields) { const id = m.idByName[w]; if (id) { o._raw[w] = r.fields[id]; o[w] = cell(r.fields[id]); } }
      rows.push(o);
    }
    if (!res.hasMore) break; pageToken = res.pageToken;
  }
  return rows;
}
async function loadKey(key) {
  try { DATA[key] = await readTable(key); delete LOADERR[key]; }
  catch (e) { DATA[key] = []; LOADERR[key] = e && e.message ? e.message : String(e); if (TABLES[key].core) throw new Error(`读「${TABLES[key].name}」失败：${LOADERR[key]}`); }
}

// 写值：按字段类型转换（文本/数字/单选/日期/人员/关联）
function val(key, name, v) {
  const f = META[key].byName[name]; if (!f) return undefined;
  if (v == null || v === '') return null;
  const t = f.type;          // FieldType: 1 文本 2 数字 3 单选 5 日期 11 人员 18/21 关联
  if (t === 1) return [{ type: 'text', text: String(v) }];
  if (t === 2) return Number(v);
  if (t === 3) { const op = (f.property?.options || []).find((o) => o.name === v); return op ? { id: op.id, text: op.name } : undefined; }
  if (t === 5) return typeof v === 'number' ? v : msOf(v);
  if (t === 11) return Array.isArray(v) ? v : [{ id: v }];
  if (t === 18 || t === 21) return { recordIds: Array.isArray(v) ? v : [v], tableId: f.property?.tableId || TABLES.po.id };
  return v;
}
function fieldsOf(key, obj) {
  const out = {};
  for (const [name, v] of Object.entries(obj)) { const id = META[key].idByName[name]; const x = val(key, name, v); if (id && x !== undefined) out[id] = x; }
  return out;
}
const T = (key) => META[key].table;

// ================= ④ 数据整理 =================
let PM = {}, PRODS = [], poBySku = {}, poRec = {}, POS = [], chByName = {}, CHS = [], planById = {};
let ORDERS = [], REVIEWER = { ids: [], names: [REVIEWER_FALLBACK], name: REVIEWER_FALLBACK }, CONFIG_ID = null;   // 审核人可多个（配置行人员字段）
let ME = { ids: [], name: '', known: false };

function buildRef() {
  PM = {};
  for (const r of DATA.pm) {
    const c = r['国家'], m = r['MSKU'];
    if (!r['ASIN'] || !m || !c) continue;
    PM[c + '|' + m] ||= { c, m, a: r['ASIN'], n: r['品名'] || '', s: r['店铺'] || '', fn: r['FNSKU'] || '', sku: r['领星SKU'] || '', box: num(r['单箱数量']), spu: r['SPU'] || '', line: '灯' };
  }
  // 鞋类：没固定箱规；尺码取 MSKU 末段数字（如 JmWZA-Wh-39），取不到再看品名里的「39码」
  for (const r of DATA.shoe || []) {
    const c = r['国家'], m = r['MSKU'];
    if (!m || !c) continue;
    const size = (m.match(/-(\d{2}(?:\.\d)?)$/) || [])[1] || ((r['品名'] || '').match(/(\d{2})码/) || [])[1] || '';
    PM[c + '|' + m] ||= { c, m, a: r['ASIN'] || '', n: r['品名'] || '', s: r['店铺'] || '', fn: r['FNSKU'] || '', sku: r['领星SKU'] || '', box: 0, spu: r['SPU'] || '(无SPU)', color: r['颜色'] || '', size, line: '鞋' };
  }
  const cRank = (c) => c === '美国' ? 0 : c === '加拿大' ? 1 : 2;
  PRODS = Object.values(PM).sort((a, b) => cRank(a.c) - cRank(b.c) || (a.line === '鞋') - (b.line === '鞋') || (!a.spu) - (!b.spu) || (a.spu || '').localeCompare(b.spu || '', 'zh') ||
    (a.color || '').localeCompare(b.color || '', 'zh') || (+a.size || 0) - (+b.size || 0) || a.n.localeCompare(b.n, 'zh'));
  poBySku = {}; poRec = {};
  for (const r of DATA.po || []) {
    if (!r['SKU'] || !r['采购合同']) continue;
    if (r['类型'] && !String(r['类型']).includes('产品')) continue;
    const o = { po: r['采购合同'], sku: r['SKU'], q: num(r['数量']), rem: r['剩余发货数'] == null || r['剩余发货数'] === '' ? null : num(r['剩余发货数']), name: r['名称'] || '', d: r['下单日期'] ? ds(dnMs(r['下单日期'])) : '', st: r['到货状态'] || '' };
    (poBySku[o.sku] ||= []).push(o); poRec[o.po + '|' + o.sku] = r._id;
  }
  Object.values(poBySku).forEach((a) => a.sort((x, y) => y.d.localeCompare(x.d)));
  const skuSet = new Set(PRODS.map((p) => p.sku)), byPo = {};
  for (const a of Object.values(poBySku)) for (const o of a) {
    if (!skuSet.has(o.sku)) continue;
    const g = byPo[o.po] ||= { po: o.po, d: o.d, st: o.st, items: [] };
    g.items.push(o); if (o.d > g.d) g.d = o.d;
  }
  POS = Object.values(byPo).sort((a, b) => b.d.localeCompare(a.d) || b.po.localeCompare(a.po));
  chByName = {}; CHS = [];
  for (const r of DATA.ch || []) { if (!r['物流渠道'] || r['启用'] === false) continue; const c = { n: r['物流渠道'], c: r['国家'] || '', t: r['运输方式'] || '', d: num(r['标准时效天数']) }; chByName[c.n] = c; CHS.push(c); }
  planById = Object.fromEntries((DATA.plan || []).map((r) => [r._id, r]));
}
function buildOrders() {
  ORDERS = []; CONFIG_ID = null;
  for (const r of DATA.ord) {
    const no = r['指令号'] || '';
    if (no === CONFIG_NO) { CONFIG_ID = r._id; const us = users(r._raw['审核人']); if (us.length) REVIEWER = { ids: us.map((u) => u.id), names: us.map((u) => u.name), name: us.map((u) => u.name).join('/') }; continue; }
    if (no.startsWith('_')) continue;
    const by = users(r._raw['提交人'])[0] || { id: '', name: '?' };
    const ships = json(r['货件JSON'], []); while (ships.length < SHIP_SLOTS) ships.push({ no: '', ch: '', eta: '' });
    ORDERS.push({
      rid: r._id, no: no || `（未编号 ${r._id.slice(-4)}）`, seq: +(String(r['序号'] ?? '').match(/\d+/)?.[0] || 0), status: r['状态'] || '草稿', byId: by.id, by: by.name,
      shipDate: r['发货日期'] ? ds(dnMs(r['发货日期'])) : '', split: r['是否分仓'] || '否', rows: json(r['明细JSON'], []).map((x, i) => ({ ...x, id: ++rowSeq })),
      ships, note: r['备注'] || '', reason: r['驳回原因'] || '', plan: r['分批计划'] || '', merge: r['合并批次'] || '', store: r['店铺'] || '', checkedAt: fmtTime(r['审核时间']), editedAt: fmtTime(r['最后修改']),
    });
  }
  // 认人：先拿 SDK 给的 ID 对「提交人/审核人」字段里的人；对不上的话第一次建单后会对上
  const seen = [...DATA.ord.flatMap((r) => [...users(r._raw['提交人']), ...users(r._raw['审核人'])])];
  const hit = seen.find((u) => ME.ids.includes(u.id));
  if (hit) { ME.name = hit.name; ME.known = true; }
}
const isReviewer = () => REVIEWER.ids.some((id) => ME.ids.includes(id)) || (ME.known && REVIEWER.names.includes(ME.name));
const isMine = (o) => ME.ids.includes(o.byId);

// ================= ⑤ 页面状态 =================
let view = 'new', rowSeq = 1;
const emptyShips = () => Array.from({ length: SHIP_SLOTS }, () => ({ no: '', ch: '', eta: '' }));
const blankForm = () => ({ rows: [], store: '', shipDate: '', split: '是', ships: emptyShips(), note: '' });
function newRow(p, perBox) { return { id: ++rowSeq, key: p.c + '|' + p.m, c: p.c, m: p.m, a: p.a, n: p.n, fn: p.fn, sku: p.sku, s: p.s, line: p.line || '灯', spu: p.spu || '', color: p.color || '', size: p.size || '', perBox: perBox ?? (p.box || ''), boxes: '', po: '', note: '' }; }
let clearArm = null;   // 「清空明细」点了第一下，等第二下确认
let F = blankForm(), E = null, editNo = null, showErr = null, pick = { scope: null, q: '' };
let listFilter = { mine: true, st: '全部', store: '' }, shipStore = '', rejecting = null, sel = new Set(), bulkRej = false, copying = null, shipFilter = '全部';

const P = (r) => PM[r.key] || { c: r.c, m: r.m, a: r.a, n: r.n, fn: r.fn, sku: r.sku, s: r.s, box: 0, line: r.line, spu: r.spu, color: r.color, size: r.size };
const isShoe = (r) => P(r).line === '鞋';   // 主表里删了也能用明细里的快照
const byBox = (r) => +r.perBox > 0 && +r.boxes > 0;
const tot = (r) => byBox(r) ? +r.perBox * +r.boxes : (+r.qty || 0);   // 没箱规的直接填总数
const countryOf = (rows) => rows.length ? P(rows[0]).c : '';
// 一张指令只能一个店铺：有明细取明细的店铺，没明细取手选的
const storeOf = (S) => S.rows.length ? (S.store || P(S.rows[0]).s || '') : '';   // 整单一个店铺：自动带出，可在明细行里改
const storeCountry = (s) => /-CA\b|-CA-|CA$/.test(s || '') ? '加拿大' : s ? '美国' : '';
// 店铺清单 = 产品主表-灯类+精铺 / 产品主表-鞋类 两张表「店铺」字段的全部选项（7 个店 × 美国/加拿大站），读不到字段时退回产品里出现过的店铺
function storeList() {
  const names = new Set();
  for (const k of ['pm', 'shoe']) for (const o of META[k]?.byName['店铺']?.property?.options || []) if (o.name) names.add(o.name);
  PRODS.forEach((p) => p.s && names.add(p.s));
  const n = {}; PRODS.forEach((p) => { if (p.s) n[p.s] = (n[p.s] || 0) + 1; });
  const g = { '美国': [], '加拿大': [] };
  [...names].sort((a, b) => (n[b] || 0) - (n[a] || 0) || a.localeCompare(b, 'zh')).forEach((s) => (g[storeCountry(s)] ||= []).push(s));
  return g;
}
// only = 只列这个国家的店铺（明细里已有产品时）
const storeOptions = (sel, empty, only) => (empty === '—' ? '' : `<option value="">${empty}</option>`) + Object.entries(storeList()).filter(([c, ss]) => ss.length && (!only || c === only))
  .map(([c, ss]) => `<optgroup label="${c}">${ss.map((s) => `<option value="${esc(s)}" ${s === sel ? 'selected' : ''}>${esc(s)}</option>`).join('')}</optgroup>`).join('');
// 换店铺：明细里每个产品换成新店铺里同 SKU、同国家的 MSKU；有对不上的就不换
function switchStore(S, to) {
  const miss = [], map = [];
  for (const r of S.rows) {
    const p = P(r), q = PRODS.find((x) => x.s === to && x.sku === p.sku && x.c === p.c);
    if (!q) miss.push(p.m); else map.push([r, q]);
  }
  // 新店铺有同 SKU 的产品 → 换成它的 MSKU/FNSKU；没有 → 店铺照改，MSKU/FNSKU 沿用，行上标红让人核对
  for (const [r, q] of map) Object.assign(r, { key: q.c + '|' + q.m, c: q.c, m: q.m, a: q.a, n: q.n, fn: q.fn, sku: q.sku, s: q.s, line: q.line || '灯', spu: q.spu || '', color: q.color || '', size: q.size || '' });
  S.store = to;
  return `已改成「${to}」` + (map.length ? `；${map.length} 行换成了该店铺的 MSKU/FNSKU` : '') + (miss.length ? `；${miss.length} 行产品主表里该店铺没有，MSKU/FNSKU 沿用原来的（标红），请核对` : '');
}
const sumOf = (rows) => ({ msku: new Set(rows.map((r) => r.key)).size, boxes: rows.reduce((s, r) => s + (byBox(r) ? +r.boxes : 0), 0), qty: rows.reduce((s, r) => s + tot(r), 0) });
const usedShips = (o) => o.split === '是' ? o.ships.map((s, i) => ({ ...s, i })).filter((s) => s.ch || s.eta || s.no) : [{ ...o.ships[0], i: 0 }];
const statusCls = (s) => ({ '草稿': 'b-gray', '待审核': 'b-yellow', '已驳回': 'b-red', '待发货': 'b-blue' }[s]);
function grouped(rows) { const order = [], g = {}; rows.forEach((r) => { if (!g[r.key]) { g[r.key] = []; order.push(r.key); } g[r.key].push(r); }); return order.flatMap((k) => g[k]); }
const stateOf = (scope) => scope === 'new' ? F : (scope === editNo ? E : null);
function dueBadge(o) {
  if (!o.shipDate) return '';
  const d = dn(o.shipDate) - dn(TODAY);
  if (d < 0) return `<span class="badge b-red">已过发货日 ${-d} 天</span>`;
  if (d === 0) return '<span class="badge b-red">今天发</span>';
  return `<span class="badge ${d <= 3 ? 'b-yellow' : 'b-gray'}">${d} 天后发</span>`;
}
function planOf(o) {
  if (!o.plan) return null;
  const m = ORDERS.filter((x) => x.plan === o.plan).sort((a, b) => (a.shipDate || '').localeCompare(b.shipDate || '') || a.seq - b.seq);
  return m.length > 1 ? { idx: m.indexOf(o) + 1, n: m.length, qty: m.reduce((s, x) => s + sumOf(x.rows).qty, 0) } : null;
}
// 每行的货件号：读发货计划里本行写入的那条记录的 货件1~6
function fbaOf(r) { const p = r.planRec && planById[r.planRec]; return p ? [1, 2, 3, 4, 5, 6].map((i) => p['货件' + i]).filter(Boolean).join(' / ') : ''; }
function slotNo(o, i) {
  const fromPlan = o.rows.map((r) => r.planRec && planById[r.planRec]?.['货件' + (i + 1)]).filter(Boolean);
  return [...new Set([o.ships[i]?.no, ...fromPlan].filter(Boolean))].join(' / ');
}
const built = (o) => usedShips(o).some((x) => slotNo(o, x.i));

// ================= ⑥ 写入动作 =================
function orderFields(S) {
  const s = sumOf(S.rows), c = countryOf(S.rows);
  const rows = S.rows.map(({ id, ...r }) => r);   // 页面行号不存
  return {
    '国家': c || null, '店铺': storeOf(S) || null, '发货日期': S.shipDate || null, '是否分仓': S.split, '合计箱数': s.boxes, '合计件数': s.qty,
    '摘要': grouped(S.rows).map((r) => `${P(r).n} ${P(r).m} ×${tot(r)}`).join('；').slice(0, 900),
    '明细JSON': JSON.stringify(rows), '货件JSON': JSON.stringify(S.ships.map(({ no, ch, eta }) => ({ no, ch, eta }))), '备注': S.note || null,
  };
}
async function createOrder(S, extra = {}) {
  const rid = await T('ord').addRecord({ fields: fieldsOf('ord', { ...orderFields(S), '状态': '草稿', ...extra }) });
  // 指令号 = FH- + 自动序号（序号由多维表发，多人同时建单也不会重号）；刚建好时序号可能还没出来，等一下再读
  let rec, digits = '';
  for (const w of [0, 300, 600, 1000, 1500, 2000]) {
    if (w) await new Promise((r) => setTimeout(r, w));
    rec = await T('ord').getRecordById(rid);
    digits = String(cell(rec.fields[META.ord.idByName['序号']]) || '').match(/\d+/)?.[0] || '';
    if (digits) break;
  }
  const no = digits ? 'FH-' + digits.padStart(4, '0') : 'FH-' + rid.slice(-6);   // 读不到序号的，下次打开页面会自动改正（healNos）
  await T('ord').setRecord(rid, { fields: fieldsOf('ord', { '指令号': no }) });
  expect('ord', rid, { '指令号': no });
  // 顺手认人：新记录的「提交人」就是我
  const u = users(rec.fields[META.ord.idByName['提交人']])[0];
  if (u) { if (!ME.ids.includes(u.id)) ME.ids.push(u.id); ME.name = u.name; ME.known = true; }
  return { rid, no };
}
async function setOrder(o, obj) {
  await T('ord').setRecord(o.rid, { fields: fieldsOf('ord', obj) });
  const want = {}; for (const [k, v] of Object.entries(obj)) if (['状态', '指令号', '分批计划', '合并批次', '发货日期'].includes(k)) want[k] = v;
  if (Object.keys(want).length) expect('ord', o.rid, want);
}
async function delOrder(o) { await T('ord').deleteRecord(o.rid); expect('ord', o.rid, 'gone'); }
// 飞书写入后立刻读，常常还是旧数据（10-28 实测：新建/复制的单要手动刷新才出来，自动序号也读不到）
// → 每次写入登记「应该看到的结果」，写完反复重读直到都看到（最多约 8 秒）
let EXPECT = [];
function expect(key, rid, want) { EXPECT.push({ key, rid, want }); }
function seen() {
  return EXPECT.every(({ key, rid, want }) => {
    const r = (DATA[key] || []).find((x) => x._id === rid);
    if (want === 'gone') return !r;
    if (want === 'exists') return !!r;
    if (!r) return false;
    return Object.entries(want).every(([k, v]) => {
      const cur = r[k];
      if (k === '发货日期') return (cur ? ds(dnMs(cur)) : '') === (v || '');
      return String(cur ?? '') === String(v ?? '');
    });
  });
}
async function syncAfterWrite() {
  const waits = [0, 400, 700, 1000, 1500, 2000, 2500];
  for (const w of waits) {
    if (w) await new Promise((r) => setTimeout(r, w));
    await Promise.all([loadKey('ord'), loadKey('plan')]);
    if (seen()) break;
  }
  const ok = seen(); EXPECT = [];
  buildRef(); buildOrders(); render();
  return ok;
}
// 刷新前后状态要一致（别人刚改过就不动）
async function fresh(o, expect) {
  const rec = await T('ord').getRecordById(o.rid);
  const st = cell(rec.fields[META.ord.idByName['状态']]);
  if (expect && !expect.includes(st)) throw new Error(`${o.no} 状态已变成「${st}」（别人刚改过），已刷新`);
  return rec;
}
function shiftCopy(o, days) {
  const c = clone({ rows: o.rows, shipDate: o.shipDate, split: o.split, ships: o.ships, note: o.note });
  const sh = (s) => s ? ds(dn(s) + days) : s;
  c.shipDate = sh(c.shipDate); c.ships.forEach((s) => { s.eta = sh(s.eta); s.no = ''; });
  c.rows.forEach((r) => { delete r.planRec; r.id = ++rowSeq; });
  return c;
}
async function makeCopies(src, n, gap, planNo) {
  const made = [];
  for (let k = 1; k <= n; k++) { busy(`复制第 ${k}/${n} 张…`); made.push((await createOrder(shiftCopy(src, k * gap), { '分批计划': planNo })).no); }
  return made;
}

// 审核通过：每行写/更新一条发货计划
async function approve(o) {
  await fresh(o, ['待审核']);
  if (!META.plan || LOADERR.plan) throw new Error('读不到「出口对账-发货计划」，没法写入（查应用数据权限）');
  const chTxt = usedShips(o).map((s) => (o.split === '是' ? `货件${s.i + 1} ` : '') + (s.ch || '渠道未定') + (s.eta ? ` ${md(s.eta)}到` : '')).join('；');
  const keep = new Set();
  const rows = clone(o.rows);
  for (const r of rows) {
    const p = P(r), poId = r.po && poRec[r.po + '|' + p.sku];
    const memo = [r.po && !poId ? `采购单 ${r.po}（采购合同表没找到）` : '', r.note, o.note].filter(Boolean).join(' / ');
    const f = fieldsOf('plan', {
      '日期': o.shipDate, '发货国家': p.c, '计划SKU': p.sku, '总数': tot(r), '每箱数量-手改': byBox(r) && +r.perBox !== +(PM[r.key]?.box) ? +r.perBox : null,
      '是否分仓': o.split, '备注名': `${+o.shipDate.slice(5, 7)}.${+o.shipDate.slice(8, 10)}-${p.n}${o.split === '是' ? '-分仓' : ''}`,
      '备注': memo || null, '来源': `发货指令 ${o.no}`, '指令号': o.no, '指令状态': '待发货', '渠道': chTxt || null, '预计到达': o.ships[0].eta || null,
      '采购合同': poId || null,
    });
    const write = async (ff) => { if (r.planRec && planById[r.planRec]) await T('plan').setRecord(r.planRec, { fields: ff }); else r.planRec = await T('plan').addRecord({ fields: ff }); };
    try { await write(f); }
    catch (e) {   // 关联字段写法不被接受时：不挂采购合同，把采购单号写进备注再试一次
      const lk = META.plan.idByName['采购合同']; if (!poId || !(lk in f)) throw e;
      delete f[lk]; f[META.plan.idByName['备注']] = val('plan', '备注', [`采购单 ${r.po}`, memo].filter(Boolean).join(' / '));
      await write(f);
    }
    keep.add(r.planRec);
  }
  // 上次写过、这次没有的行：没建货件就删，建了就标已驳回
  for (const pr of (DATA.plan || []).filter((x) => x['指令号'] === o.no && !keep.has(x._id))) {
    if ([1, 2, 3, 4, 5, 6].some((i) => pr['货件' + i])) await T('plan').setRecord(pr._id, { fields: fieldsOf('plan', { '指令状态': '已驳回' }) });
    else await T('plan').deleteRecord(pr._id);
  }
  const obj = { '状态': '待发货', '审核时间': Date.now(), '驳回原因': null, '明细JSON': JSON.stringify(rows.map(({ id, ...r }) => r)) };
  await setOrder(o, obj);
  try { if (ME.ids[0]) await setOrder(o, { '审核人': [{ id: ME.ids[0] }] }); } catch (e) { /* 人员 ID 不认就算了，审核时间已记 */ }
  return rows.length;
}
// 驳回：待审核的直接退回；待发货的，没建货件的行从发货计划删掉，建了货件的行保留并标「已驳回」
async function reject(o, why) {
  const was = o.status;
  await fresh(o, was === '待发货' ? ['待发货'] : ['待审核']);
  const rows = clone(o.rows);
  if (was === '待发货') for (const r of rows) {
    if (!r.planRec) continue;
    if (fbaOf(r)) await T('plan').setRecord(r.planRec, { fields: fieldsOf('plan', { '指令状态': '已驳回' }) });
    else { try { await T('plan').deleteRecord(r.planRec); } catch (e) { /* 已被手动删 */ } delete r.planRec; }
  }
  await setOrder(o, { '状态': '已驳回', '驳回原因': `${ME.name || '审核人'}：${why}`, '审核时间': null, '明细JSON': JSON.stringify(rows.map(({ id, ...r }) => r)) });
}

// 跑一个写操作：加遮罩、出错提示、完了重读
async function act(label, fn) {
  busy(label + '…'); EXPECT = [];
  try {
    const msg = await fn();
    busy('等飞书同步…');
    const ok = await syncAfterWrite();
    if (msg) toast(msg + (ok ? '' : '（飞书同步较慢，几秒后点「⟳ 刷新数据」）'), ok ? 3600 : 6000);
  }
  catch (e) { EXPECT = []; await reload(true).catch(() => {}); toast('失败：' + (e && e.message ? e.message : e), 6000); console.error(e); }
  finally { busy(''); }
}
async function reload(silent) {
  if (!silent) busy('刷新中…');
  try { await Promise.all([loadKey('ord'), loadKey('plan')]); buildRef(); buildOrders(); render(); }
  finally { if (!silent) busy(''); }
}

// ================= 开船日 / 预计到达 默认值 =================
// 下一开船日期：都是「下一周」（周一起算）的日期 —— 美国 = 下周三，加拿大 = 下周五
function nextSail(c) {
  const t = dn(TODAY), mon = (new Date(t * DAY).getUTCDay() + 6) % 7;   // 0=周一
  const nextMon = t + 7 - mon;
  return ds(nextMon + (c === '加拿大' ? 4 : 2));
}
// 美国分仓 5 个货件的大区；不分仓、加拿大不显示
const REGION = [{ n: '美西', d: '30-35天', k: 'w' }, { n: '美西', d: '30-35天', k: 'w' }, { n: '美中', d: '35-45天', k: 'm' }, { n: '美东', d: '40-50天', k: 'e' }, { n: '美东', d: '50-60天', k: 'e' }];
function shipLabel(o, i) {
  if (o.split !== '是') return '货件';
  const r = countryOf(o.rows) === '美国' && REGION[i];
  return `货件${i + 1}` + (r ? ` <span class="rg rg-${r.k}">${r.n} ${r.d}</span>` : '');
}
// 预计到达默认 = 开船日 + 天数：分仓 5 个货件 30/30/35/45/55；不分仓 美国 35、加拿大 40
const ETA_SPLIT = [30, 30, 35, 45, 55];
function etaOffsets(S, c) { return S.split === '是' ? ETA_SPLIT : [c === '加拿大' ? 40 : 35]; }
// 只填「空着的」或「还是上次自动填的」格子，手改过的不动
function applyDefaults(S) {
  const c = countryOf(S.rows) || storeCountry(S.store); if (!c) return;
  const a = S._auto || (S._auto = { ship: '', eta: [] });
  const defSplit = c === '美国' ? '是' : '否';
  if (!('split' in a) || S.split === a.split) { S.split = defSplit; a.split = defSplit; }
  const sail = nextSail(c);
  if (!S.shipDate || S.shipDate === a.ship) { S.shipDate = sail; a.ship = sail; }
  if (!S.shipDate) return;
  const off = etaOffsets(S, c);
  S.ships.forEach((s, i) => {
    const def = i < off.length ? ds(dn(S.shipDate) + off[i]) : '';
    if (!s.eta || s.eta === a.eta[i]) { s.eta = def; a.eta[i] = def; }
  });
}

// ---- 领星货件候选：本批指令里的 MSKU 出现在哪些货件里（同国家、审核后新建、没被别的指令占用）----
// 目的仓三字母 → 大区（美西/美中/美东），用来把候选货件排到对应的货件格
const FC_W = ['ONT', 'LGB', 'SBD', 'LAX', 'SMF', 'OAK', 'SJC', 'SCK', 'GYR', 'PHX', 'LAS', 'SLC', 'PDX', 'SEA', 'BFI', 'GEG', 'MCE', 'FAT', 'XLX', 'POC', 'QXY', 'VGT', 'KRB', 'TCY', 'RFD5'];
const FC_M = ['MDW', 'IND', 'STL', 'MKC', 'MCI', 'DFW', 'FTW', 'OKC', 'SAT', 'HOU', 'IAH', 'MEM', 'CMH', 'DET', 'MSP', 'ORD', 'DEN', 'TUL', 'ICT', 'OMA', 'DSM', 'MQJ', 'FWA', 'LFT', 'SDF', 'CVG', 'LIT', 'MSY', 'AUS', 'ELP', 'IGQ', 'SWF'];
const FC_E = ['ABE', 'AVP', 'BWI', 'PHL', 'EWR', 'JFK', 'TEB', 'CLT', 'RDU', 'ATL', 'JAX', 'MCO', 'TPA', 'MIA', 'BOS', 'PIT', 'RIC', 'ALB', 'BDL', 'ACY', 'CHA', 'TYS', 'BNA', 'GSO', 'ILG', 'MGE', 'LGA', 'HGR', 'SAV', 'XEW'];
function fcRegion(fc) { const c = String(fc || '').toUpperCase().slice(0, 3); return FC_W.includes(c) ? '美西' : FC_M.includes(c) ? '美中' : FC_E.includes(c) ? '美东' : ''; }
function fbaCandidates(os) {
  const mskus = new Set(os.flatMap((o) => o.rows.map((r) => P(r).m))), c = countryOf(os[0].rows);
  const mine = new Set(os.flatMap((o) => o.ships.map((s) => s.no)).filter(Boolean));
  const taken = new Set(ORDERS.filter((o) => !os.includes(o)).flatMap((o) => o.ships.map((s) => s.no)).filter(Boolean));
  const since = Math.min(...os.map((o) => dn(o.shipDate) - 21));      // 开船日前 3 周起建的货件
  const ship = Object.fromEntries((DATA.fba || []).map((r) => [r['货件号'], r]));
  const hit = {};
  for (const it of DATA.fbaItem || []) {
    if (!mskus.has(it['MSKU'])) continue;
    const no = it['货件号'], s = ship[no]; if (!no || (taken.has(no) && !mine.has(no))) continue;
    if (s && s['国家'] && c && s['国家'] !== c) continue;
    if (s && s['店铺'] && storeOf(os[0]) && s['店铺'] !== storeOf(os[0])) continue;   // 货件只属于一个店铺
    const t = s && s['FBA建单时间'] ? dnMs(typeof s['FBA建单时间'] === 'number' ? s['FBA建单时间'] : Date.parse(String(s['FBA建单时间']).replace(' ', 'T') + '+08:00')) : null;
    if (t != null && t < since && !mine.has(no)) continue;
    const h0 = hit[no] ||= { no, name: s?.['货件名称'] || '', fc: s?.['目的仓'] || '', t, n: 0, qty: 0 };
    h0.n++; h0.qty += num(it['发货量']);
  }
  return Object.values(hit).map((x) => ({ ...x, region: fcRegion(x.fc) })).sort((a, b) => b.n - a.n || (b.t || 0) - (a.t || 0));
}
let FILL = null;   // { os, slots:[i], cands }

}
async function saveFba(os, nos) {
  const merge = os.length > 1 ? 'M-' + os.map((o) => o.no).sort()[0] : '';
  for (const [k, o] of os.entries()) {
    busy(`写货件号 ${k + 1}/${os.length}：${o.no}…`);
    const ships = clone(o.ships).map(({ no, ch, eta }) => ({ no, ch, eta }));
    for (const [i, v] of Object.entries(nos)) if (ships[+i]) ships[+i].no = v;
    await setOrder(o, { '货件JSON': JSON.stringify(ships), '合并批次': merge || (o.merge && os.length === 1 ? o.merge : null) });
    // 发货计划：本单每行的 货件1~5 = 对应货件号
    for (const r of o.rows) {
      if (!r.planRec || !planById[r.planRec]) continue;
      const f = {}; for (const [i, v] of Object.entries(nos)) f['货件' + (+i + 1)] = v || null;
      await T('plan').setRecord(r.planRec, { fields: fieldsOf('plan', f) });
    }
  }
  return `${os.map((o) => o.no).join('、')} 已写货件号` + (merge ? `（合并批次 ${merge}）` : '');
}

function bulk(a) {
  const os = ORDERS.filter((o) => sel.has(o.no));
  if (a === 'bulkSubmit') {
    const mine = os.filter((o) => isMine(o) && o.status !== '待审核'), bad = mine.filter((o) => problems(o).length), good = mine.filter((o) => !problems(o).length);
    if (!good.length) { toast(`勾选的 ${bad.length} 张都没填全：${bad.map((o) => o.no).join('、')}`, 5000); return; }
    return confirmSubmit(good).then((ok) => ok && bulkSubmit(good, bad));
  }
  return bulk2(a, os);
}
function bulkSubmit(good, bad) {
  return act('批量提交中', async () => {
    for (const [i, o] of good.entries()) { busy(`提交 ${i + 1}/${good.length}…`); await fresh(o, ['草稿', '已驳回']); await setOrder(o, { '状态': '待审核' }); }
    sel = new Set(bad.map((o) => o.no));
    return `已提交 ${good.length} 张` + (bad.length ? `；${bad.length} 张没填全仍勾着：${bad.map((o) => o.no).join('、')}` : '');
  });
}
function bulk2(a, os) {
  if (a === 'bulkDel') return act('批量删除中', async () => {
    const del = os.filter((o) => isMine(o) && (o.status === '草稿' || o.status === '已驳回'));
    for (const o of del) await delOrder(o);

  if (a === 'bulkApprove') return act('批量审核中', async () => {
    const todo = os.filter((o) => o.status === '待审核'); let rows = 0;
    for (const [i, o] of todo.entries()) { busy(`审核 ${i + 1}/${todo.length}：${o.no}（写入发货计划）…`); rows += await approve(o); }
    sel.clear(); return `${todo.length} 张审核通过 → 已写入发货计划 ${rows} 行`;
  });
  if (a === 'bulkReject') {
    const why = $('bulkReason').value.trim(); if (!why) { toast('写一下驳回原因'); return; }
    bulkRej = false;
    return act('批量驳回中', async () => {

      for (const [i, o] of todo.entries()) { busy(`驳回 ${i + 1}/${todo.length}…`); await reject(o, why); }
      sel.clear(); return `已驳回 ${todo.length} 张到指令列表`;
    });
  }
}

// ================= ⑨ 自检（认人 / 读表 / 写删权限），截图即可定位 =================
async function selfCheck(auto) {
  const res = [];
  const t = async (name, fn) => {
    try {
      const v = await Promise.race([fn(), new Promise((_, rej) => setTimeout(() => rej(new Error('超时 10s')), 10000))]);
      let shown; try { shown = typeof v === 'string' ? v : JSON.stringify(v); } catch (x) { shown = String(v); }
      res.push(['✔', name, String(shown ?? '').slice(0, 300)]); return v;
    } catch (e) { res.push(['✘', name, e && e.message ? e.message : String(e)]); return undefined; }
  };
  busy('自检中…');
  try {
    if (SDK) {
      await t('dashboard.state', async () => SDK.dashboard.state);
      await t('bridge.getUserId', () => SDK.bitable.bridge.getUserId());
      await t('bridge.getBaseUserId', () => SDK.bitable.bridge.getBaseUserId());
      res.push(['ℹ', '本页认出的我', `${ME.name || '（未认出）'} · ids=${ME.ids.join(',')} · 审核人=${REVIEWER.name}(${REVIEWER.ids.join(',') || '无ID'}) · 我是审核人=${isReviewer()}`]);
      for (const k of Object.keys(TABLES)) {
        await t(`读「${TABLES[k].name}」`, async () => {
          if (LOADERR[k]) throw new Error(LOADERR[k]);
          const m = META[k]; return `${(DATA[k] || []).length} 行${m && m.missing.length ? '；缺字段：' + m.missing.join('、') : ''}`;
        });
      }
      if (!auto) {
        // 写一条测试行 → 看提交人是谁 → 删掉（验证 新增/读回/删除 权限 和 人员ID 对不对得上）
        const rid = await t('发货指令：新增测试行', () => T('ord').addRecord({ fields: fieldsOf('ord', { '指令号': '_TEST 自检（会自动删）', '状态': '草稿' }) }));
        if (rid) {
          await t('读回测试行的「提交人」', async () => { const rec = await T('ord').getRecordById(rid); const u = users(rec.fields[META.ord.idByName['提交人']])[0]; return u ? `${u.name} (${u.id}) · 与 getUserId ${ME.ids.includes(u.id) ? '一致 ✔' : '不一致'}` : '空'; });
          await t('发货指令：删除测试行', () => T('ord').deleteRecord(rid));
        }
        if (META.plan && isReviewer()) {
          const pid = await t('发货计划：新增测试行（审核人才测）', () => T('plan').addRecord({ fields: fieldsOf('plan', { '指令号': '_TEST', '来源': '发货指令页自检，会自动删' }) }));
          if (pid) await t('发货计划：删除测试行', () => T('plan').deleteRecord(pid));
        }
      }
    } else res.push(['✘', 'SDK', '没加载上']);
  } finally { busy(''); }
  const html = `<div class="card"><h3>自检结果 <small>有 ✘ 的话把这块整体截图发回；点「⟳ 刷新」回到页面</small></h3><table class="tbl"><tbody>${res.map((r) =>
    `<tr><td style="width:24px">${r[0]}</td><td>${esc(r[1])}</td><td style="white-space:normal;color:var(--sub)">${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>`;
  $('main').innerHTML = html + ($('main').innerHTML.includes('加载失败') ? '' : '');
  return html;
}

  return false;
}

// 启动（预览版换人时会再调一次：重新认人、重读表）
async function boot() {
  try {
    if (!SDK) { SDK = await loadSdk(); setupSave(); }
    ME = { ids: [], name: '', known: false }; sel.clear(); editNo = null; E = null; rejecting = null; copying = null; closePick();
    for (const f of ['getUserId', 'getBaseUserId']) { try { const id = await SDK.bitable.bridge[f](); if (id && !ME.ids.includes(id)) ME.ids.push(id); } catch (e) { /* 自检里看 */ } }
    await Promise.all(Object.keys(TABLES).map(loadKey));
    buildRef(); buildOrders();
    await healNos();
    view = isReviewer() ? 'list' : 'new';
    if (!F.rows.length && loadDraft()) toast('已恢复上次没保存的新建内容', 3000);
    render();
  } catch (e) {
    const msg = esc(e && e.message ? e.message : e);
    $('main').innerHTML = `<div class="card err">加载失败：${msg}</div>`;
    if (SDK) { try { $('main').innerHTML = `<div class="card err">加载失败：${msg}</div>` + await selfCheck(true); } catch (e2) { /* 保留报错 */ } }
  }
}
if (MOCK) window.__fahuoBoot = boot;
await boot();
</script>
